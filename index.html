  const jig = run ? Math.sin(t * 70) * (0.25 + ru * 0.6) : 0;
  ctx.save(); ctx.translate(jig, jig * 0.4);
  ctx.drawImage(E.cv, 0, 0, BAY_W, BAY_H);
  // Riementrieb (dreht sich mit)
  if (info.pulleys.length) {
    const P = info.pulleys;
    ctx.strokeStyle = '#0c0c10'; ctx.lineWidth = 1.2; ctx.beginPath(); P.concat([P[0]]).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    for (const [x, y, r] of P) {
      let g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0.5, x, y, r); g.addColorStop(0, '#e8ecf2'); g.addColorStop(1, '#5a5e68');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a2b33'; ctx.beginPath(); ctx.arc(x, y, r * 0.42, 0, Math.PI * 2); ctx.fill();
      for (let k = 0; k < 3; k++) { const a = _bayAng * (6 / r) + k * 2.094; ctx.fillStyle = '#c8ccd4'; ctx.fillRect(x + Math.cos(a) * r * 0.7 - 0.4, y + Math.sin(a) * r * 0.7 - 0.4, 0.8, 0.8); }
    }
  }
  if (info.sc) { const [x, y, r] = info.sc; ctx.fillStyle = '#2a2b33'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); for (let k = 0; k < 6; k++) { const a = _bayAng * 2 + k * 1.047; ctx.fillStyle = '#8a8e98'; ctx.fillRect(x + Math.cos(a) * 3 - 0.4, y + Math.sin(a) * 3 - 0.4, 0.8, 0.8); } }
  // Gebläse (Boxer) und Turbinenrad dreht sich
  for (const [x, y, r] of info.fans) { ctx.fillStyle = '#16171c'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); for (let k = 0; k < 11; k++) { const a = _bayAng * 3 + k * 0.571; ctx.strokeStyle = '#6a6e78'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 3, y + Math.sin(a) * 3); ctx.lineTo(x + Math.cos(a + 0.25) * (r - 1), y + Math.sin(a + 0.25) * (r - 1)); ctx.stroke(); } ctx.fillStyle = '#c8ccd4'; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill(); }
  for (const [x, y] of info.turbos) for (let k = 0; k < 7; k++) { const a = _bayAng * 9 + k * 0.898; ctx.strokeStyle = '#9aa0ac'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 3, y + Math.sin(a) * 3); ctx.stroke(); }
  // Krümmer glühen bei hoher Drehzahl
  const glow = run ? clamp((ru - 0.5) * 2.2, 0, 1) : 0;
  if (glow > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; for (const [x, y] of info.glow) { const g = ctx.createRadialGradient(x, y, 0.5, x, y, 9); g.addColorStop(0, `rgba(255,120,40,${(0.65 * glow).toFixed(2)})`); g.addColorStop(1, 'rgba(255,60,20,0)'); ctx.fillStyle = g; ctx.fillRect(x - 9, y - 9, 18, 18); } ctx.restore(); }
  ctx.restore();
  // Kühlerlüfter-Andeutung (vorne, dreht)
  for (const fx of [72, 120]) { ctx.save(); ctx.globalAlpha = 0.5; for (let k = 0; k < 5; k++) { const a = _bayAng * 2.5 + k * 1.257; ctx.strokeStyle = '#2a2b33'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(fx, 11); ctx.lineTo(fx + Math.cos(a) * 5, 11 + Math.sin(a) * 2.2); ctx.stroke(); } ctx.restore(); }
}
/* =============================================================================
   Teil 6: Wirtschaft – Produktion, Verkauf, Werbung, Ereignisse, Kosten,
   Fabrik-Ausbau, Forschung, Modelle/Motoren speichern, Erfolge
   ============================================================================= */
const classIdx = cls => CLASS_ORDER.indexOf(cls);
const modelById = id => S.models.find(m => m.id === id);
const stockTotal = () => Object.values(S.stock).reduce((a, b) => a + (b || 0), 0);
const pendingUnits = () => S.factory.lines.filter(l => l.paid).length;
const warehouseCap = () => Math.round(STAGES[S.factory.stage].wh * (1 + 0.5 * S.factory.wh));
function buildDays(m) {
  const f = S.factory;
  const sp = STAGES[f.stage].rate * (1 + 0.2 * f.speed) * (1 + bonus('prodSpeed')) * Math.max(0.2, 1 + modSum('speed'));
  return CLASSES[BODIES[m.body].cls].buildDays / sp;
}
/** Finanzbuch: Beträge des laufenden Tages sammeln (rev, prod, fixed, ads, inv) */
function finAdd(k, v) {
  if (!S) return;
  if (!S.fin) S.fin = { cur: {}, days: [], m0: S.money };
  S.fin.cur[k] = (S.fin.cur[k] || 0) + v;
}
function finCloseDay() {
  if (!S.fin) S.fin = { cur: {}, days: [], m0: S.money };
  const c = S.fin.cur, known = (c.rev || 0) - (c.prod || 0) - (c.fixed || 0) - (c.ads || 0) - (c.inv || 0);
  const other = Math.round(S.money - S.fin.m0 - known);
  S.fin.days.push(Object.assign({ d: S.day, other }, c)); if (S.fin.days.length > 60) S.fin.days.shift();
  S.fin.cur = {}; S.fin.m0 = S.money;
}
/** Gewinn pro Tag eines Modells bei einem Preis (begrenzt durch Nachfrage und Produktion) */
function modelProfitDay(m, price) {
  const car = carOf(m), keep = m.price;
  if (price != null) m.price = price;
  const dmd = demandBreakdown(m).total;
  m.price = keep;
  const cap = S.factory.lines.filter(l => l.modelId === m.id && l.active).reduce((a) => a + 1 / buildDays(m), 0);
  const units = cap > 0 ? Math.min(dmd, cap) : dmd;
  return { units, dmd, cap, profit: units * ((price != null ? price : m.price) - car.prodCost) };
}
/** bester Preis: Gewinn pro Tag maximieren */
function bestPrice(m) {
  const car = carOf(m); let best = null;
  for (let f = 0.7; f <= 2.2; f += 0.02) { const p = Math.round(car.value * f / 100) * 100, r = modelProfitDay(m, p); if (!best || r.profit > best.profit) best = Object.assign({ price: p }, r); }
  return best;
}
function staffCount() { return STAGES[S.factory.stage].staff + (S.factory.lines.length - 1) * 3; }
function monthlyCost() { return STAGES[S.factory.stage].rent + staffCount() * WAGE + S.factory.lines.length * 300; }

// ---------- Produktion (läuft kontinuierlich in Spieltagen) ----------
function tickProduction(dtDays) {
  const cap = warehouseCap();
  for (const L of S.factory.lines) {
    L.stall = '';
    if (!L.active) continue;
    const m = modelById(L.modelId);
    if (!m) { L.active = false; continue; }
    if (!L.paid) {
      if (stockTotal() + pendingUnits() >= cap) { L.stall = 'Lager voll'; continue; }
      if (L.mode === 'keep' && (S.stock[m.id] || 0) >= Math.max(1, L.qty)) { L.stall = 'Lager reicht'; continue; }
      const cost = carOf(m).prodCost;
      if (S.money < cost) { L.stall = 'Kein Geld'; continue; }
      S.money -= cost; m.stat.cost += cost; L.paid = true; L.prog = 0; finAdd('prod', cost);
    }
    L.prog += dtDays / buildDays(m);
    if (L.prog >= 1) {
      L.prog = 0; L.paid = false; L.done++;
      S.stock[m.id] = (S.stock[m.id] || 0) + 1;
      m.stat.prod++; S.stats.produced++;
      addXP(6 + carOf(m).prodCost / 1500);
      if (L.mode !== 'keep' && L.qty > 0 && L.done >= L.qty) { L.active = false; toast(`${ico('factory')} Auftrag fertig: ${L.qty}× ${esc(m.name)}`, 'good'); }
    }
  }
}

// ---------- Nachfrage ----------
function adMult(seg) {
  let v = 0;
  for (const c of S.campaigns) { const C0 = CAMPAIGNS.find(x => x.id === c.id); if (C0 && c.until > S.day) v += C0.mult * (C0.seg[seg] || 0); }
  return 1 + Math.min(2.5, v);
}
/** erwartete Verkäufe pro Tag je Kundengruppe */
function demandBreakdown(m) {
  const car = carOf(m), cls = CLASSES[car.cls];
  const price = m.price || car.value;
  const pr = price / car.value;
  const repF = 0.25 + S.rep / 100 * 1.5;
  const dem = Math.max(0.1, 1 + bonus('demand') + modSum('demand'));
  const same = S.models.filter(x => x.id !== m.id && BODIES[x.body].cls === car.cls && (S.stock[x.id] || 0) > 0).length;
  const comp = 1 / Math.sqrt(1 + same);
  const rivF = rivalFactor(car);            // Vergleich mit der Konkurrenz
  const evF = (car.isEV || car.E.type === 'hybrid') ? 1 + modSum('ev') : 1;
  let mBoost = 1;
  for (const md of S.mods) if (md.until > S.day && md.modelId === m.id) mBoost += md.mult;
  const out = {}; let total = 0;
  for (const seg in SEGMENTS) {
    const G = SEGMENTS[seg];
    const base = G.size * (cls.aff[seg] || 0) * Math.pow(car.score[seg] / 100, 2.2);
    const pf = clamp(Math.exp(-G.sens * (pr - 1)), 0, 3);
    const segMod = seg === 'sport' ? 1 + modSum('sport') : 1;
    out[seg] = base * pf * repF * dem * comp * evF * adMult(seg) * segMod * Math.max(0.1, mBoost) * rivF;
    total += out[seg];
  }
  out.total = total;
  return out;
}

// ---------- Tageswechsel ----------
function dayTick() {
  S.day++;
  // Verkäufe
  let soldToday = 0, revToday = 0;
  for (const m of S.models) {
    const stock = S.stock[m.id] || 0;
    let n = 0;
    if (stock > 0) {
      const dmd = demandBreakdown(m);
      n = Math.min(stock, poisson(dmd.total));
    }
    m.stat.recent.push(n); if (m.stat.recent.length > 30) m.stat.recent.shift();
    if (!n) continue;
    const car = carOf(m), ci = classIdx(car.cls);
    S.stock[m.id] = stock - n;
    const rev = Math.round(n * m.price * prestigeMul());
    S.money += rev; m.stat.sold += n; m.stat.rev += rev; S.stats.sold += n; S.stats.revenue += rev;
    soldToday += n; revToday += rev;
    addXP(n * (10 + m.price / 600));
    const q = Math.max(car.score.family, car.score.sport, car.score.hyper) / 100;
    addRep(n * (q - 0.45) * 0.05 * (1 + ci * 0.4) * (m.price > car.value * 1.4 ? 0.5 : 1));
  }
  finAdd('rev', revToday);
  if (soldToday) chalEvent('sell', soldToday);
  if (soldToday && S.speed <= 2) toast(`${ico('money')} ${soldToday} Auto${soldToday > 1 ? 's' : ''} verkauft: <b>+${fmtMoney(revToday)}</b>`, 'good', 2200);
  // Werbung: Ruf verteilt über die Laufzeit
  for (const c of S.campaigns) { const C0 = CAMPAIGNS.find(x => x.id === c.id); if (C0 && c.until >= S.day) addRep(C0.rep / C0.days); }
  const ended = S.campaigns.filter(c => c.until <= S.day);
  ended.forEach(c => { const C0 = CAMPAIGNS.find(x => x.id === c.id); toast(`${ico('ad')} Kampagne beendet: ${C0 ? C0.name : c.id}`); });
  S.campaigns = S.campaigns.filter(c => c.until > S.day);
  S.mods = S.mods.filter(md => md.until > S.day);
  // langsamer Rufverlust ohne Aktivität
  if (S.rep > 25 && !soldToday) S.rep = Math.max(25, S.rep - 0.01);
  // Monatskosten
  if (S.day % 30 === 0) {
    const cost = monthlyCost();
    S.money -= cost;
    const zins = loanMonthly();
    finAdd('fixed', cost + zins);
    toast(`${ico('date')} Monatskosten (Löhne ${staffCount()} MA, Miete${zins ? ', Kreditzins' : ''}): <b class="bad">-${fmtMoney(cost + zins)}</b>`, S.money < 0 ? 'bad' : '', 4500);
    if (S.money < 0) toast('Achtung: Dein Konto ist im Minus! Verkaufe Autos oder senke Kosten.', 'bad', 6000);
  }
  // Zufallsereignisse
  if (S.day >= S.nextEvent) { triggerEvent(); S.nextEvent = S.day + randi(22, 42); }
  salvageDay();
  leagueDay();
  showDay();
  rivalsDay();
  // Statistik
  S.hist.push(Math.round(S.money)); if (S.hist.length > 120) S.hist.shift();
  finCloseDay();
  checkAchievements();
}

// ---------- Werbekampagnen ----------
function startCampaign(id) {
  const C0 = CAMPAIGNS.find(x => x.id === id);
  if (!C0 || !has(C0.tech)) return false;
  if (S.campaigns.some(c => c.id === id)) { toast('Diese Kampagne läuft bereits.', 'bad'); return false; }
  if (S.money < C0.cost) { toast('Nicht genug Geld für die Kampagne.', 'bad'); return false; }
  S.money -= C0.cost; finAdd('ads', C0.cost);
  S.campaigns.push({ id, until: S.day + C0.days });
  S.stats.adsRun[id] = (S.stats.adsRun[id] || 0) + 1;
  addXP(C0.xp);
  toast(`${ico('ad')} Kampagne <b>${C0.name}</b> gestartet (${C0.days} Tage)`, 'good');
  checkAchievements();
  return true;
}

// ---------- Zufallsereignisse ----------
function triggerEvent() {
  const soldModels = S.models.filter(m => m.stat.sold > 0);
  const pool = EVENTS.filter(e => {
    if (['review', 'badreview', 'recall'].includes(e.id)) return soldModels.length > 0;
    if (e.id === 'evsub') return S.models.some(m => { const c = carOf(m); return c.isEV || c.E.type === 'hybrid'; });
    if (e.id === 'strike') return S.factory.stage >= 1;
    return true;
  });
  for (let tries = 0; tries < 8; tries++) {
    const ev = pick(pool);
    let text = ev.text;
    if (ev.special === 'review') {
      const m = soldModels.slice().sort((a, b) => maxScore(b) - maxScore(a))[0];
      if (maxScore(m) < 45) continue;
      addRep(4); S.mods.push({ modelId: m.id, mult: 0.5, until: S.day + 30 });
      text = `Das Magazin <b>PixelMotor</b> vergibt 5 Sterne an den „${esc(m.name)}“! +4 Ruf, +50 % Nachfrage (30 Tage).`;
    } else if (ev.special === 'badreview') {
      const m = soldModels.slice().sort((a, b) => maxScore(a) - maxScore(b))[0];
      if (maxScore(m) > 55) continue;
      addRep(-3); S.mods.push({ modelId: m.id, mult: -0.3, until: S.day + 30 });
      text = `Tester bemängeln den „${esc(m.name)}“. -3 Ruf, -30 % Nachfrage (30 Tage).`;
    } else if (ev.special === 'recall') {
      const m = soldModels.slice().sort((a, b) => carOf(a).rel - carOf(b).rel)[0];
      const rel = carOf(m).rel;
      if (Math.random() > (100 - rel) / 55 * (1 - S.factory.qc * 0.12)) continue;
      const cost = Math.round(Math.min(m.stat.sold, 300) * carOf(m).prodCost * 0.08);
      S.money -= cost; addRep(-5);
      text = `Beim „${esc(m.name)}“ (Zuverlässigkeit ${rel}) gibt es einen Defekt. Rückruf kostet <b class="bad">${fmtMoney(cost)}</b>, -5 Ruf. Tipp: Qualitätskontrolle ausbauen!`;
    } else if (ev.special === 'carshow') { addRep(3); addXP(150); }
    else if (ev.special === 'investor') {
      const amt = Math.round(5000 * Math.pow(S.level, 1.4) / 100) * 100;
      S.money += amt; text = `Ein Investor glaubt an ${esc(S.company)}: <b>+${fmtMoney(amt)}</b>`;
    }
    if (ev.mod) S.mods.push(Object.assign({ id: ev.id }, ev.mod, { until: S.day + ev.mod.days }));
    if (ev.rep) addRep(ev.rep);
    S.log.unshift({ day: S.day, title: ev.title, text }); if (S.log.length > 30) S.log.pop();
    showEventPopup(ev, text);
    return;
  }
}
const maxScore = m => { const s = carOf(m).score; return Math.max(s.family, s.sport, s.hyper); };

// ---------- Fabrik-Ausbau ----------
function nextStageInfo() {
  const n = STAGES[S.factory.stage + 1];
  if (!n) return null;
  const ok = has(n.tech) && S.level >= n.lvl && S.money >= n.cost;
  const why = !has(n.tech) ? `Forschung „${TECH[n.tech].name}“ nötig` : S.level < n.lvl ? `Level ${n.lvl} nötig` : S.money < n.cost ? 'Zu wenig Geld' : '';
  return { st: n, ok, why };
}
function buyStage() {
  const info = nextStageInfo();
  if (!info || !info.ok) return false;
  S.money -= info.st.cost; S.factory.stage++; finAdd('inv', info.st.cost);
  addXP(250 * S.factory.stage);
  toast(`${ico('factory')} Ausbau abgeschlossen: <b>${info.st.name}</b>!`, 'good', 5000);
  checkAchievements();
  return true;
}
const lineCost = () => STAGES[S.factory.stage].lineCost * Math.pow(1.35, Math.max(0, S.factory.lines.length - 1));
function buyLine() {
  const f = S.factory, st = STAGES[f.stage];
  if (f.lines.length >= st.maxLines) return false;
  const cost = Math.round(lineCost());
  if (S.money < cost) { toast('Nicht genug Geld für eine neue Linie.', 'bad'); return false; }
  S.money -= cost; finAdd('inv', cost); f.lines.push(newLine(S.models[0] && S.models[0].id));
  addXP(80); toast(`${ico('factory')} Neue Produktionslinie gebaut!`, 'good');
  return true;
}
const upgradeCost = k => Math.round(UPGRADES[k].base * Math.pow(1.9, S.factory[k]) * (1 + S.factory.stage * 0.8));
function buyUpgrade(k) {
  const U = UPGRADES[k];
  if (S.factory[k] >= U.max || !has(U.tech)) return false;
  const cost = upgradeCost(k);
  if (S.money < cost) { toast('Nicht genug Geld.', 'bad'); return false; }
  S.money -= cost; finAdd('inv', cost); S.factory[k]++; _carCache.clear();
  addXP(40 + S.factory[k] * 20);
  toast(`${ico('wrench')} ${U.name} auf Stufe ${S.factory[k]} verbessert`, 'good');
  return true;
}

// ---------- Forschung ----------
function techState(t) {
  if (S.techs.includes(t.id)) return 'done';
  if (S.level >= t.lvl && t.req.every(r => S.techs.includes(r))) return S.rp >= t.cost ? 'avail' : 'nopts';
  return 'lock';
}
function research(id) {
  const t = TECH[id];
  if (!t || techState(t) !== 'avail') return false;
  S.rp -= t.cost; S.techs.push(id); _carCache.clear();
  toast(`${ico('research')} Erforscht: <b>${t.name}</b>`, 'good');
  checkAchievements();
  return true;
}

// ---------- Modelle & Motoren ----------
function validateDesign(d) {
  if (!String(d.name || '').trim()) return 'Bitte gib dem Modell einen Namen.';
  if (!classUnlocked(d.cls)) return 'Diese Fahrzeugklasse ist noch nicht erforscht.';
  if (!bodyUnlocked(d.body) || BODIES[d.body].cls !== d.cls) return 'Diese Karosserie ist nicht verfügbar.';
  if (!S.engines.find(e => e.id === d.engineId)) return 'Bitte wähle einen Motor.';
  return '';
}
const devCost = car => Math.round(car.prodCost * 0.5 / 100) * 100;
function saveModelFromDraft(asNew) {
  const d = S.draft, err = validateDesign(d);
  if (err) { toast(err, 'bad'); return null; }
  const car = computeCar(d);
  const existing = !asNew && d.id && modelById(d.id);
  if (existing) {
    const keep = { id: existing.id, stat: existing.stat, price: existing.price, created: existing.created };
    Object.assign(existing, clone(d), keep);
    _carCache.delete(existing.id);
    toast(`${ico('car')} Modell „${esc(existing.name)}“ aktualisiert`, 'good');
    return existing;
  }
  const cost = devCost(car);
  if (S.money < cost) { toast(`Entwicklung kostet ${fmtMoney(cost)} – zu wenig Geld.`, 'bad'); return null; }
  S.money -= cost; finAdd('inv', cost);
  const m = clone(d); m.id = 'm' + uid(); m.stat = newModelStats(); m.created = S.day;
  m.price = Math.round(car.value / 100) * 100;
  S.models.push(m); S.stock[m.id] = 0; S.stats.designs++;
  S.draft.id = m.id;
  addXP(100 + classIdx(car.cls) * 70);
  toast(`${ico('car')} Neues Modell „${esc(m.name)}“ entwickelt (${fmtMoney(cost)})`, 'good', 4000);
  checkAchievements();
  return m;
}
function deleteModel(id) {
  const m = modelById(id);
  if (!m) return;
  const refund = Math.round((S.stock[id] || 0) * carOf(m).prodCost * 0.4);
  S.money += refund;
  S.factory.lines.forEach(l => { if (l.modelId === id) { if (l.paid) S.money += carOf(m).prodCost; l.active = false; l.paid = false; l.prog = 0; l.modelId = null; } });
  delete S.stock[id];
  S.models = S.models.filter(x => x.id !== id);
  if (S.draft.id === id) S.draft.id = null;
  toast(`Modell gelöscht${refund ? ', Lager verkauft: +' + fmtMoney(refund) : ''}`);
}
function saveEngineFromDraft(asNew) {
  const e = S.engDraft;
  if (!String(e.name || '').trim()) { toast('Bitte gib dem Motor einen Namen.', 'bad'); return null; }
  if (!has(ENGINE_TYPES[e.type].tech)) { toast('Motortyp nicht erforscht.', 'bad'); return null; }
  const existing = !asNew && e.id && S.engines.find(x => x.id === e.id);
  if (existing) { Object.assign(existing, clone(e)); _carCache.clear(); toast(`${ico('engine')} Motor „${esc(e.name)}“ aktualisiert`, 'good'); return existing; }
  const ne = clone(e); ne.id = 'e' + uid();
  S.engines.push(ne); S.engDraft.id = ne.id;
  addXP(50);
  toast(`${ico('engine')} Neuer Motor „${esc(ne.name)}“ gespeichert`, 'good');
  checkAchievements();
  return ne;
}
function deleteEngine(id) {
  if (S.engines.length <= 1) { toast('Mindestens ein Motor muss bleiben.', 'bad'); return; }
  if (S.models.some(m => m.engineId === id)) { toast('Motor wird noch von einem Modell verwendet.', 'bad'); return; }
  S.engines = S.engines.filter(e => e.id !== id);
  if (S.draft.engineId === id) S.draft.engineId = S.engines[0].id;
  if (S.engDraft.id === id) S.engDraft.id = null;
}

// ---------- Erfolge ----------
function checkAchievements() {
  if (!S) return;
  const st = S.stats;
  const cond = {
    model1: st.designs >= 1, sale1: st.sold >= 1, sale100: st.sold >= 100, sale1000: st.sold >= 1000,
    money1m: S.money >= 1e6, money10m: S.money >= 1e7, lvl10: S.level >= 10, lvl25: S.level >= 25,

// ---------- Ereignis-Delegation ----------
function bindDelegation(root) {
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled || !root.contains(b)) return;
    if (b.classList.contains('lock')) { if (b.dataset.why) toast(b.dataset.why, 'bad'); return; }
    const fn = ACTIONS[b.dataset.act];
    if (fn) { e.preventDefault(); if (b.dataset.act !== 'sfxToggle') sfx('click'); fn(b.dataset, b, e); }
  });
  const inp = e => {
    const el = e.target.closest('[data-inp]');
    if (!el) return;
    const fn = INPUTS[el.dataset.inp];
    if (fn) fn(el, e.type);
  };
  root.addEventListener('input', inp);
  root.addEventListener('change', inp);
}

function toast(html, type = '', ms = 3200) {
  const box = $('#toasts');

  const t = document.createElement('div');
  t.className = 'toast ' + type; t.innerHTML = html.trim().startsWith('<div') ? html : '<div>' + html + '</div>';
  if (type === 'good') sfx(html.includes(iconURL('money')) ? 'cash' : 'good'); else if (type === 'bad') sfx('bad');

  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, ms);
}

let _lvlAnim = null;
function showLevelUp(level, rp) {
  const box = $('#lvlup'), cv = $('#lvlup canvas'), ctx = hdCtx(cv);
  box.classList.remove('hidden');
  const parts = Array.from({ length: 70 }, () => ({ x: 160, y: 80, vx: rand(-90, 90), vy: rand(-110, 20), c: pick(['#ffcd75', '#a7f070', '#73eff7', '#ef7d57', '#f4f4f4']), s: randi(1, 3) }));
  const t0 = performance.now();
  cancelAnimationFrame(_lvlAnim);
  const frame = now => {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, 320, 180);
    // Hintergrund-Streifen
    const a = Math.min(1, t * 4) * (t > 2.4 ? Math.max(0, 1 - (t - 2.4) * 3) : 1);
    ctx.globalAlpha = a * 0.85; ctx.fillStyle = '#1a1c2c'; ctx.fillRect(0, 52, 320, 76);
    ctx.fillStyle = '#ffcd75'; ctx.fillRect(0, 52, 320, 2); ctx.fillRect(0, 126, 320, 2);
    ctx.globalAlpha = a;
    // Partikel
    for (const p of parts) { const px = p.x + p.vx * t, py = p.y + p.vy * t + 60 * t * t; ctx.fillStyle = p.c; ctx.fillRect(Math.round(px), Math.round(py), p.s, p.s); }
    // Text mit Hüpfen
    const bounce = Math.max(0, Math.sin(t * 9) * 6 * Math.max(0, 1 - t * 1.2));
    cxText(ctx, 'LEVEL UP!', 160, 62 - bounce, (Math.floor(t * 8) % 2) ? '#ffcd75' : '#ef7d57', 4, 'c', '#000');
    cxText(ctx, 'LEVEL ' + level, 160, 92, '#f4f4f4', 2, 'c', '#000');
    cxText(ctx, '+' + rp + ' FORSCHUNGSPUNKTE', 160, 110, '#a7f070', 1, 'c', '#000');
    ctx.globalAlpha = 1;
    if (t < 2.8) _lvlAnim = requestAnimationFrame(frame); else box.classList.add('hidden');
  };
  _lvlAnim = requestAnimationFrame(frame);
  sfx('level');
  toast(`${ico('level')} <b>Level ${level}!</b> +${rp} Forschungspunkte`, 'good', 4000);
  renderNav();
}

function drawMoneyChart() {

  const ctx = hdCtx(cv), W = cv._lw, H = cv._lh;
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 10) { ctx.fillStyle = '#1a1c2c'; ctx.fillRect(0, y, W, 1); }
  const h = S.hist.slice(-W / 2);
  if (h.length < 2) { cxText(ctx, 'NOCH KEINE DATEN', W / 2, H / 2 - 2, '#566c86', 1, 'c'); return; }
  const mn = Math.min(0, ...h), mx = Math.max(1, ...h);

  if (mn < 0) { ctx.fillStyle = '#b13e53'; ctx.fillRect(0, yOf(0), W, 1); }
  for (let i = 1; i < h.length; i++) {

function setPath(obj, path, v) { const p = path.split('.'); let o = obj; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = v; }
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj); }
/** Knopfreihe: items = [[wert, label, techId, extraLockGrund]] */
function optBtns(act, key, items, cur, type = '') {
  return `<div class="opts">${items.map(([v, label, tech, lockWhy]) => {
    const locked = (tech && !has(tech)) || !!lockWhy;
    const why = lockWhy || (tech ? 'Benötigt Forschung: ' + techLabel(tech) : '');
    return `<button class="btn sm ${String(cur) === String(v) ? 'sel' : ''} ${locked ? 'lock' : ''}" data-act="${act}" data-k="${key}" data-v="${v}" data-t="${type}" ${locked ? `data-why="${esc(why)}" title="${esc(why)}"` : ''}>${label}</button>`;
  }).join('')}</div>`;
}
function swatches(act, key, colors, cur, inpName) {
  return `<div class="opts" style="align-items:center">${colors.map(c => c === 'none'
    ? `<button class="btn sm ${cur === 'none' ? 'sel' : ''}" data-act="${act}" data-k="${key}" data-v="none">Aus</button>`
    : `<button class="sw ${String(cur).toLowerCase() === c.toLowerCase() ? 'on' : ''}" style="background:${c}" data-act="${act}" data-k="${key}" data-v="${c}" title="${c}"></button>`).join('')}
    ${inpName ? `<input type="color" value="${cur && cur !== 'none' ? cur : '#ffffff'}" data-inp="${inpName}" data-k="${key}" title="Eigene Farbe">` : ''}</div>`;
}
const conv = (v, t) => t === 'n' ? +v : t === 'b' ? v === 'true' : v;

const maxGears = () => has('tun_gear8') ? 8 : has('tun_gear6') ? 6 : 5;

  if (e.type === 'ev') { e.ind = 'none'; e.nos = 'none'; e.exh = 'stock'; e.motors = clamp(e.motors | 0 || 1, 1, has('eng_evmulti') ? 4 : 2); }

}
ACTIONS.eset = d => {
  const v = conv(d.v, d.t);
  S.engDraft[d.k] = v;
  if (d.k === 'type') { const T = ENGINE_TYPES[v]; S.engDraft.disp = v === 'ev' ? 70 : Math.round((T.dmin + (T.dmax - T.dmin) * 0.4) * 10) / 10; }
  fixEngineDraft(); rerender();
};

INPUTS.erange = (el, type) => {
  S.engDraft[el.dataset.k] = +el.value;

  if (type === 'change') { fixEngineDraft(); rerender(); } else updateEngineLive();
};
function engRangeLabel(k, v) {

  return `${known ? row('Leistung', c.ps, 1600, c.ps + ' PS', 'var(--orange)') : row('Leistung', 0, 1, '??? PS', 'var(--orange)')}
    ${known ? row('Drehmoment', c.nm, 1800, c.nm + ' Nm', 'var(--orange)') : row('Drehmoment', 0, 1, '??? Nm', 'var(--orange)')}
    ${known ? '' : `<div class="card" style="box-shadow:0 0 0 3px var(--line),inset 0 0 0 2px var(--orange)"><div class="flex"><span>Leistung unbekannt – ab auf den Prüfstand!</span><span class="sp"></span><button class="btn yellow" data-act="dynoRun" data-v="draft">${ico('dyno')} Dyno (${fmtMoney(dynoCost(c))})</button></div></div>`}
    ${row('Drehzahlgrenze', c.red, 20000, fmtNum(c.red) + ' U/min', 'var(--yellow)')}

    <div class="stat"><span>Getriebe</span><span>${c.isEV ? '1-Gang (E-Antrieb)' : c.gears + ' Gänge'}</span><span>Achse ${c.final}</span></div>

function drawEngineCurve() {
  const cv = $('#curvecv'); if (!cv) return;
  const ctx = hdCtx(cv), W = cv._lw, H = cv._lh, c = computeEngine(S.engDraft);
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0, 0, W, H);
  if (!dynoKnown(c.key)) { cxText(ctx, '? ? ?', W / 2, H / 2 - 8, '#566c86', 3, 'c'); cxText(ctx, 'LEISTUNGSKURVE NACH DEM DYNO', W / 2, H - 10, '#566c86', 1, 'c'); return; }
  for (let x = 0; x < W; x += 16) { ctx.fillStyle = '#1a1c2c'; ctx.fillRect(x, 0, 1, H); }
  let maxP = 0; for (let x = 0; x < W; x++) { const rpm = (x + 1) / W * c.red; maxP = Math.max(maxP, c.torque(rpm) * rpm); }
  for (let x = 0; x < W; x++) {
    const rpm = (x + 1) / W * c.red;
    const tq = c.torque(rpm) / c.nm, p = c.torque(rpm) * rpm / maxP;
    ctx.fillStyle = '#ef7d57'; ctx.fillRect(x, Math.round(H - 6 - tq * (H - 14)), 1, 2);
    ctx.fillStyle = '#ffcd75'; ctx.fillRect(x, Math.round(H - 6 - p * (H - 14)), 1, 2);
  }
  ctx.fillStyle = '#b13e53'; ctx.fillRect(Math.round(W * 0.86), 0, Math.round(W * 0.14), 3);
  cxText(ctx, 'NM', 3, 3, '#ef7d57'); cxText(ctx, 'PS', 16, 3, '#ffcd75');
  cxText(ctx, fmtNum(c.red) + ' U/MIN', W - 3, H - 6, '#94b0c2', 1, 'r');
}

      const pl = Math.floor(x / 11), gap = x % 11 === 10, tone = hash2(pl, 3);
      c = gap ? [44, 28, 20] : mixRGB([120, 78, 46], [150, 100, 60], tone);
      if (!gap && hash2(pl, Math.floor(y / 3)) > 0.82) c = shadeRGB(c, -0.12);                  // Maserung
      if (!gap && y % 37 === Math.floor(tone * 30)) c = shadeRGB(c, -0.25);                    // Stoss
    } else if (sel.wall === 'concrete') {
      c = mixRGB([118, 120, 126], [140, 142, 148], hash2(x >> 2, y >> 2) * 0.6 + n * 0.4);
      if (x % 50 === 0 || y % 26 === 0) c = shadeRGB(c, -0.15);

    if (k === 0) { ctx.fillStyle = '#41a6f6'; ctx.fillRect(152, 26, 40, 14); ctx.fillStyle = '#566c86'; ctx.fillRect(152, 40, 40, 9); for (let i = 0; i < 5; i++) { ctx.fillStyle = '#ffcd75'; ctx.fillRect(152 + ((i * 11 + t * 30) % 40), 44, 4, 1); } ctx.fillStyle = '#b13e53'; ctx.fillRect(166, 37, 12, 3); }
    else if (k === 1) { ctx.fillStyle = '#0d0f1a'; ctx.fillRect(152, 26, 40, 23); cxText(ctx, 'DRAG', 172, 29, '#ffcd75', 1, 'c'); cxText(ctx, (S.stats.best14 ? S.stats.best14.toFixed(2) : '--.--') + 'S', 172, 38, '#a7f070', 1, 'c'); }
    else { ctx.fillStyle = '#1a1c2c'; ctx.fillRect(152, 26, 40, 23); for (let i = 0; i < 3; i++) { ctx.fillStyle = ['#ff4b55', '#ffcd75', '#38e070'][i]; ctx.fillRect(160 + i * 9, 34, 6, 6 * (Math.floor(t * 2) % 3 === i ? 1 : 0.3)); } }
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(152, 26, 40, 2);
  }
  if (sel.right === 'arcade') {
    ctx.fillStyle = '#05060c'; ctx.fillRect(161, 46, 20, 16);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = ['#73eff7', '#ff4bd0', '#ffcd75'][i % 3]; ctx.fillRect(162 + ((i * 7 + t * 9) % 18), 47 + ((i * 5 + t * 4) % 14), 1, 1); }
    ctx.fillStyle = '#a7f070'; ctx.fillRect(170 + Math.round(Math.sin(t * 2) * 6), 59, 3, 2);
    if (Math.floor(t * 2) % 2) { ctx.fillStyle = 'rgba(255,75,85,0.5)'; ctx.fillRect(160, 38, 22, 6); }
  }
  if (sel.light === 'neon') {
    const fl = Math.sin(t * 17) > 0.96 ? 0.4 : 1;
    ctx.save(); ctx.globalAlpha = fl;
    ctx.fillStyle = '#ff4bd0'; ctx.fillRect(10, 9, 60, 2); ctx.fillStyle = '#73eff7'; ctx.fillRect(130, 9, 60, 2);
    ctx.globalAlpha = 0.12 * fl; ctx.fillStyle = '#ff4bd0'; ctx.fillRect(0, 6, 100, 76); ctx.fillStyle = '#41a6f6'; ctx.fillRect(100, 6, 100, 76);
    ctx.restore();
  } else if (sel.light === 'cold') { ctx.fillStyle = 'rgba(190,220,255,0.07)'; ctx.fillRect(0, 0, 200, 112); }
  void d;
}
/* =============================================================================
   Teil 8b: Motoren – Prüfstand (Dyno) und Fertigmotoren
   Neu entwickelte Motoren zeigen ihre Leistung erst nach einem Prüfstandlauf
   („??? PS“) – das macht das Entwickeln spannender. Fertigmotoren kauft man
   mit Herstellerangabe und kann sie sofort einbauen.
   ============================================================================= */
const engKey = e => JSON.stringify([e.type, +(+e.disp).toFixed(2), e.ind, e.mat, e.exh, e.nos, e.gears | 0, e.ratio, e.motors | 0]);
function dynoKnown(key) { return !!(S && S.dyno && S.dyno[key]); }
function dynoMark(key) { S.dyno = S.dyno || {}; S.dyno[key] = 1; }
/** alte Spielstände: alle vorhandenen Motoren gelten als bekannt */
function dynoMigrate() { if (!S || S.dynoInit) return; S.dyno = S.dyno || {}; S.engines.forEach(e => dynoMark(engKey(e))); S.dynoInit = 1; }
/** Anzeige-Helfer: Werte nur, wenn der Motor schon auf dem Prüfstand war */
const carKnown = car => !car.engKey || car.factory || dynoKnown(car.engKey);
const psStr = car => carKnown(car) ? car.ps + ' PS' : '??? PS';
const tStr = (car, v, dec = 2) => carKnown(car) ? v.toFixed(dec) + ' s' : '?.?? s';

// ---------- Prüfstand ----------
let DYN = null;
function dynoCost(c) { return Math.max(300, Math.round(c.cost * 0.06 / 50) * 50); }
ACTIONS.dynoRun = d => {
  const e = d.v === 'draft' ? S.engDraft : S.engines.find(x => x.id === d.v); if (!e) return;
  const c = computeEngine(e), cost = dynoCost(c), key = engKey(e);
  if (S.money < cost) { toast('Zu wenig Geld für den Prüfstand.', 'bad'); return; }
  S.money -= cost; updateTopbar(true);
  openModal(`<h2 class="title">${ico('dyno', 'big')} Prüfstand – ${esc(e.name)}</h2>
    <div class="panel dark" style="padding:6px"><canvas id="dyncv" width="320" height="150" class="cv"></canvas></div>
    <div class="flex"><span class="hint" id="dynmsg" style="margin:0">Der Motor läuft warm …</span><span class="sp"></span><button class="btn gray" data-act="close" id="dynclose" disabled>Weiter</button></div>`);
  $('#modal').dataset.onclose = 'dynoStop';
  DYN = { e, c, key, t0: performance.now(), raf: 0, done: false, V: null };
  try { AUD = AUD || new (window.AudioContext || window.webkitAudioContext)(); if (AUD.state === 'suspended') AUD.resume(); DYN.V = makeVoice(c, e, 0.08, 0); } catch (er) { DYN.V = null; }
  DYN.raf = requestAnimationFrame(dynoLoop);
};
function dynoStop() { if (!DYN) return; cancelAnimationFrame(DYN.raf); if (DYN.V) { try { DYN.V.out.gain.value = 0; DYN.V.nodes.forEach(n => n.stop()); } catch (e) { /* egal */ } } DYN = null; rerender(); }
function dynoLoop() {
  const D = DYN; if (!D) return;
  D.raf = requestAnimationFrame(dynoLoop);
  const t = (performance.now() - D.t0) / 1000, c = D.c, warm = 1.2, pull = 3.6;
  const u = clamp((t - warm) / pull, 0, 1), rpm = t < warm ? (c.isEV ? 0 : c.idle) + Math.sin(t * 20) * 30 : (c.isEV ? 0 : c.idle * 1.2) + u * (c.red - (c.isEV ? 0 : c.idle * 1.2));
  if (D.V && AUD) voiceUpdate(D.V, { c: { E: c }, rpm: Math.max(0, rpm) }, t < warm ? 0.2 : 1, !SFX.on, AUD.currentTime);
  if (u >= 1 && !D.done) {
    D.done = true; dynoMark(D.key); sfx('goal');
    const m = $('#dynmsg'); if (m) m.innerHTML = `<b style="font-size:18px">${c.ps} PS</b> bei ${fmtNum(Math.round(c.red * (c.peakU || 0.85) / 100) * 100)} U/min · <b style="font-size:18px">${c.nm} Nm</b>`;
    const b = $('#dynclose'); if (b) { b.disabled = false; b.className = 'btn green'; }
    if (D.V) setTimeout(() => { if (D && D.V) D.V.out.gain.setTargetAtTime(0, AUD.currentTime, 0.3); }, 200);
  }
  const cv = $('#dyncv'); if (!cv) return;
  const ctx = hdCtx(cv), W = 320, H = 150;
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0, 0, W, H);
  // Raster
  for (let x = 30; x < W - 10; x += 26) { ctx.fillStyle = '#1a1c2c'; ctx.fillRect(x, 10, 1, H - 40); }
  for (let y = 10; y < H - 30; y += 20) { ctx.fillStyle = '#1a1c2c'; ctx.fillRect(30, y, W - 40, 1); }
  // Rolle + Auto-Silhouette (Rad dreht)
  const spin = t * (2 + u * 30);
  ctx.fillStyle = '#22263a'; ctx.fillRect(0, H - 26, W, 26);
  for (const rx of [70, 250]) { ctxDisc(ctx, rx, H - 14, 9, '#3a3e48'); for (let k = 0; k < 6; k++) { const a = spin + k * Math.PI / 3; ctx.fillStyle = '#8a8e98'; ctx.fillRect(rx + Math.cos(a) * 6 - 0.5, H - 14 + Math.sin(a) * 6 - 0.5, 1.5, 1.5); } }
  // Messkurven bis zur aktuellen Drehzahl
  let maxP = 0; for (let r = 500; r <= c.red; r += 50) maxP = Math.max(maxP, c.torque(r) * r);
  const X = r => 30 + (r / c.red) * (W - 44), Y = v => H - 32 - v * (H - 46);
  for (let r = (c.isEV ? 200 : c.idle * 1.2); r <= rpm; r += c.red / 260) {
    const tq = c.torque(r) / (c.nm || 1), p = c.torque(r) * r / maxP;
    ctx.fillStyle = '#ef7d57'; ctx.fillRect(X(r), Y(tq), 1.2, 1.2);
    ctx.fillStyle = '#ffcd75'; ctx.fillRect(X(r), Y(p), 1.2, 1.2);
  }
  // Anzeige
  const psNow = Math.round(c.ps * clamp((c.torque(rpm) * rpm) / maxP, 0, 1));
  cxText(ctx, fmtNum(Math.round(rpm / 10) * 10) + ' U/MIN', W - 8, 14, '#94b0c2', 1, 'r');
  cxText(ctx, t < warm ? 'WARMLAUF' : (D.done ? 'FERTIG' : 'VOLLGAS'), 34, 14, D.done ? '#a7f070' : '#ef7d57', 1, 'l');
  cxText(ctx, (D.done ? c.ps : psNow) + ' PS', W / 2, H - 22 - 0, '#ffcd75', 2, 'c', '#000');
  cxText(ctx, 'NM', 34, 24, '#ef7d57'); cxText(ctx, 'PS', 48, 24, '#ffcd75');
  if (!D.done && t > warm) { ctx.fillStyle = 'rgba(255,120,60,' + (0.1 + Math.random() * 0.1).toFixed(2) + ')'; ctx.fillRect(0, 0, W, H); }
}

/** Verbindungslinien im Pixel-Stil zwischen Voraussetzungen und Technologien */
function drawTreeLines() {
  const tree = $('#tree'), cv = $('#treecv'); if (!tree || !cv) return;
  const W = tree.scrollWidth, H = tree.scrollHeight;
  cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'), tr = tree.getBoundingClientRect();
  for (const t of TECHS) for (const r of t.req) {
    const a = $('#tn-' + r), b = $('#tn-' + t.id); if (!a || !b) continue;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const done = S.techs.includes(r);
    ctx.fillStyle = done ? (S.techs.includes(t.id) ? '#38b764' : '#ffcd75') : '#3e4a6b';
    if (Math.abs(ra.left - rb.left) < 5) {          // gleiche Spalte: senkrecht am linken Rand
      const x = Math.round(ra.left - tr.left - 8), y0 = Math.round(ra.top - tr.top + ra.height / 2), y1 = Math.round(rb.top - tr.top + rb.height / 2);
      ctx.fillRect(x, Math.min(y0, y1), 3, Math.abs(y1 - y0)); ctx.fillRect(x, y0, 10, 3); ctx.fillRect(x, y1, 10, 3);
    } else {
      const left = ra.left < rb.left;
      const x0 = Math.round((left ? ra.right : ra.left) - tr.left), y0 = Math.round(ra.top - tr.top + ra.height / 2);
      const x1 = Math.round((left ? rb.left : rb.right) - tr.left), y1 = Math.round(rb.top - tr.top + 12);
      const mx = Math.round(left ? x1 - 9 : x1 + 6);
      ctx.fillRect(Math.min(x0, mx), y0, Math.abs(mx - x0) + 3, 3);
      ctx.fillRect(mx, Math.min(y0, y1), 3, Math.abs(y1 - y0) + 3);
      ctx.fillRect(Math.min(mx, x1), y1, Math.abs(x1 - mx), 3);
    }
  }
}

/** Finanzen der letzten 30 Tage: Einnahmen, Ausgaben nach Art, Gewinn pro Tag als Balken */
function financePanelHTML() {

  const sum = k => days.reduce((a, d) => a + (d[k] || 0), 0);

  const prof = days.map(d => (d.rev || 0) - (d.prod || 0) - (d.fixed || 0) - (d.ads || 0) - (d.inv || 0) + (d.other || 0));

      <div><b>Ergebnis</b></div><div class="${net >= 0 ? 'good' : 'bad'}"><b>${fmtMoney(Math.round(net))}</b></div></div></div>

      <div class="hint">Laufende Kosten pro Monat: <b class="bad">${fmtMoney(monthlyCost())}</b> · Werbung läuft: ${S.campaigns.length}</div></div></div>`

function svBaseValue(o) {
  if (!o._base || o._baseKey !== S.techs.length) { o._base = computeCar(o.design, o.engine).value; o._baseKey = S.techs.length; }
  return o._base;
}
const condF = c => 0.2 + 0.8 * Math.pow(c / 100, 1.3);
function svTrueValue(o) {
  let v = svBaseValue(o) * condF(o.cond);
  for (const d of o.defects) if (!d.fixed) v *= SV_DEFECTS[d.id].val;
  return Math.round(v * (o.gem ? 1.9 : 1));
}
function svApparentValue(o) {
  let v = svBaseValue(o) * condF(o.cond);
  for (const d of o.defects) if (!d.fixed && d.known) v *= SV_DEFECTS[d.id].val;
  return v;
}

function svSyncWear(o) {
  const rust = o.defects.some(d => d.id === 'rust' && !d.fixed);
  o.design.wear = { w: Math.round(clamp(1 - o.cond / 100, 0, 1) * 20) / 20, rust, crack: o.cond < 30 };

function svEffective(o) {

}

  // Reifenberg

  // Bürocontainer mit Schild

function sfxCtx() {
  try { AUD = AUD || new (window.AudioContext || window.webkitAudioContext)(); if (AUD.state === 'suspended') AUD.resume(); return AUD; } catch (e) { return null; }
}
/** einzelner Pixel-Ton: Frequenz, Dauer, Wellenform, Lautstärke, Startversatz, Zielfrequenz */
function tone(f, dur, type = 'square', vol = 0.04, at = 0, f2 = null) {
  const ac = sfxCtx(); if (!ac) return;
  const t0 = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(kind) {
  if (!SFX.on) return;
  switch (kind) {
    case 'click': tone(660, 0.04, 'square', 0.025); break;
    case 'good': tone(523, 0.08, 'square', 0.03); tone(784, 0.12, 'square', 0.03, 0.07); break;
    case 'bad': tone(220, 0.18, 'sawtooth', 0.03, 0, 110); break;
    case 'cash': tone(988, 0.06, 'square', 0.03); tone(1319, 0.14, 'square', 0.03, 0.06); break;
    case 'level': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.14, 'square', 0.035, i * 0.09)); break;
    case 'goal': [659, 784, 988].forEach((f, i) => tone(f, 0.12, 'triangle', 0.05, i * 0.08)); break;
    case 'buy': tone(392, 0.06, 'square', 0.03); tone(523, 0.1, 'square', 0.03, 0.05); break;
  }
}

  { id: 'vortek',    name: 'Vortek Motors',     color: '#ef7d57', focus: { small: 1.12, family: 1.0, suv: 0.9, sport: 0.8, super: 0.55, hyper: 0.4 }, models: ['Pico', 'Strada', 'Terra', 'Furia', 'Saetta', 'Zenith'] },
  { id: 'kessler',   name: 'Kessler AG',        color: '#41a6f6', focus: { small: 0.85, family: 1.15, suv: 1.12, sport: 0.9, super: 0.7, hyper: 0.55 }, models: ['Mini', 'Kombi K5', 'Gelande X', 'Rapido', 'Blitz GT', 'Omega'] },
  { id: 'raijin',    name: 'Raijin Industries', color: '#a7f070', focus: { small: 0.95, family: 0.8, suv: 0.85, sport: 1.2, super: 1.1, hyper: 0.85 }, models: ['Kei', 'Sedan R', 'Yama', 'Kaze', 'Raiden', 'Tenkai'] },
  { id: 'stellmark', name: 'Stellmark',         color: '#c040a0', focus: { small: 0.35, family: 0.6, suv: 0.95, sport: 1.0, super: 1.22, hyper: 1.25 }, models: ['Petit', 'Royale', 'Atlante', 'Lumen', 'Vortice', 'Aeternum'] }
];
// Gesamtmarkt je Klasse (Autos pro Tag, die die Konkurrenz verkauft)
const CLASS_MARKET = { small: 3.5, family: 4.5, suv: 3.5, sport: 1.4, super: 0.35, hyper: 0.07 };
const RIVAL_BASE = { small: 46, family: 46, suv: 46, sport: 48, super: 52, hyper: 56 };

function ensureRivals() {
  if (!S.rivals) {
    S.rivals = {};
    for (const r of RIVALS) { const sc = {}; for (const c of CLASS_ORDER) sc[c] = Math.round(RIVAL_BASE[c] * r.focus[c] + rand(-3, 3)); S.rivals[r.id] = { score: sc, gen: {} }; }
    S.rivalNext = 40;
  }
  return S.rivals;
}
/** bester Konkurrenzwert einer Klasse (wächst mit der Zeit) */
function rivalBest(cls) {
  const R = ensureRivals(), drift = Math.min(25, S.day / 365 * 7);
  let best = 0, who = RIVALS[0];
  for (const r of RIVALS) { const v = Math.min(96, R[r.id].score[cls] + drift * r.focus[cls]); if (v > best) { best = v; who = r; } }
  return { v: best, r: who };
}
/** Nachfrage-Faktor: dein Auto im Vergleich zur besten Konkurrenz */
function rivalFactor(car) {
  const q = Math.max(car.score.family, car.score.sport, car.score.hyper, 1);
  const R = rivalBest(car.cls).v;
  return clamp(2 * Math.pow(q, 3) / (Math.pow(q, 3) + Math.pow(R, 3)), 0.15, 1.8);
}
/** dein Marktanteil in einer Klasse (aus erwarteter Nachfrage) */
function classShare(cls) {
  let mine = 0;
  for (const m of S.models) if (BODIES[m.body].cls === cls) mine += demandBreakdown(m).total;
  return mine / (mine + CLASS_MARKET[cls] * (0.6 + rivalBest(cls).v / 120));
}
function bestShare() { let b = 0; for (const c of CLASS_ORDER) if (S.models.some(m => BODIES[m.body].cls === c)) b = Math.max(b, classShare(c)); return b; }

/** Tageswechsel: Konkurrenz bringt neue Modelle oder hat Pech */
function rivalsDay() {
  ensureRivals();
  if (S.day < S.rivalNext) return;
  S.rivalNext = S.day + randi(35, 70);
  const r = pick(RIVALS), st = S.rivals[r.id];
  // Konkurrenz zielt bevorzugt auf Klassen, in denen du stark bist
  const mine = CLASS_ORDER.filter(c => S.models.some(m => BODIES[m.body].cls === c));
  const cls = mine.length && Math.random() < 0.6 ? pick(mine) : pick(CLASS_ORDER);
  if (Math.random() < 0.8) {
    const gain = randi(3, 7);
    st.score[cls] = Math.min(94, st.score[cls] + gain);
    st.gen[cls] = (st.gen[cls] || 1) + 1;
    const mname = `${r.name.split(' ')[0]} ${r.models[CLASS_ORDER.indexOf(cls)]} ${['', '', 'II', 'III', 'IV', 'V', 'VI'][Math.min(6, st.gen[cls])]}`.trim();
    const text = `${r.name} bringt den neuen <b>${esc(mname)}</b> (${CLASSES[cls].name}) – Wertung ${Math.round(rivalBest(cls).v)}. Halte deine Modelle aktuell!`;
    S.log.unshift({ day: S.day, title: 'Konkurrenz: neues Modell', text }); if (S.log.length > 30) S.log.pop();
    toast(`<div>${ico('market', 'big')}</div><div><b>Konkurrenz!</b><br>${text}</div>`, 'bad', 6500);
  } else {
    st.score[cls] = Math.max(30, st.score[cls] - 6);
    const text = `Grosser Rückruf bei <b>${r.name}</b> (${CLASSES[cls].name}): Die Kunden wechseln zu dir!`;
    S.log.unshift({ day: S.day, title: 'Konkurrenz patzt', text }); if (S.log.length > 30) S.log.pop();
    toast(`<div>${ico('trophy', 'big')}</div><div><b>Chance!</b><br>${text}</div>`, 'good', 6500);
  }
}

function rivalsPanelHTML() {
  ensureRivals();
  const drift = Math.min(25, S.day / 365 * 7);
  const myBest = c => { let b = 0; for (const m of S.models) if (BODIES[m.body].cls === c) b = Math.max(b, maxScore(m)); return b; };
  return `<div class="panel"><h3>${ico('market')}Konkurrenz & Marktanteile</h3><div style="overflow:auto">
    <table class="t"><tr><th>Hersteller</th>${CLASS_ORDER.map(c => `<th>${CLASSES[c].name}</th>`).join('')}</tr>
    <tr><td><b style="color:var(--yellow)">${esc(S.company)}</b></td>${CLASS_ORDER.map(c => { const v = myBest(c), R = rivalBest(c).v; return `<td class="${v ? (v >= R ? 'good' : 'bad') : 'muted'}">${v || '–'}</td>`; }).join('')}</tr>
    ${RIVALS.map(r => `<tr><td><span class="sw" style="width:10px;height:10px;background:${r.color}"></span> ${r.name}</td>${CLASS_ORDER.map(c => `<td>${Math.round(Math.min(96, S.rivals[r.id].score[c] + drift * r.focus[c]))}</td>`).join('')}</tr>`).join('')}
    <tr><td>Dein Marktanteil</td>${CLASS_ORDER.map(c => { const sh = S.models.some(m => BODIES[m.body].cls === c) ? classShare(c) : 0; return `<td><div class="bar" style="width:60px;display:inline-block;vertical-align:middle"><i style="width:${sh * 100}%;background:var(--yellow)"></i></div> ${Math.round(sh * 100)}%</td>`; }).join('')}</tr>
    </table></div>
    <div class="hint">Wertung = beste Kundengruppen-Punkte eines Modells. Ist dein Auto besser als die beste Konkurrenz seiner Klasse (grün), verkaufst du deutlich mehr. Die Konkurrenz entwickelt sich laufend weiter – bring regelmässig neue oder verbesserte Modelle!</div></div>`;
}
/* =============================================================================
   Teil 9e: Drag-Liga – Saisons mit 6 Rennen, Punktetabelle, Pokale, Sponsoren
   Jede Woche ein Ligarennen. Gewertet wird deine Gesamtzeit (Reaktion + Fahrzeit)
   gegen alle Fahrer der Liga. Top 2 steigen auf, Top 3 bekommen Pokal & Sponsor.
   ============================================================================= */
ICONS.cup = ['k.kkkk.k', 'kykyyyky', 'kkyyyykk', '.kyyyyk.', '..kyyk..', '...kk...', '..kyyk..', '.kkkkkk.'];
const LEAGUE_TIERS = [
  { name: 'Amateur-Liga',  lvl: 1,  opps: ['rookie', 'street'],        prize: 20000,   sponsor: 400,   xp: 60 },
  { name: 'Pro-Liga',      lvl: 8,  opps: ['street', 'pro'],           prize: 120000,  sponsor: 2500,  xp: 160 },
  { name: 'Elite-Liga',    lvl: 15, opps: ['pro', 'legend'],           prize: 500000,  sponsor: 10000, xp: 400 },
  { name: 'Legenden-Liga', lvl: 22, opps: ['legend', 'boss', 'king'],  prize: 2500000, sponsor: 45000, xp: 1000 }
];
const LEAGUE_NAMES = ['Nina „Nitro“ Brandt', 'Jo Kawa', 'Mika Sturm', 'Dario Vento', 'Lea Blitz', 'Kenji Hara', 'Toni Zünder', 'Sam Rakete', 'Rita Rauch', 'Oskar Vollgas', 'Yuki Funke', 'Ben Kolben'];
const SPONSORS = ['PixelOil', 'Turbox Energy', 'Nitro Cola', 'GripMax Reifen', 'Voltwerk', 'Rakete Versicherung'];
const ROUNDS = 6, LPOINTS = [25, 18, 15, 12, 10, 8], LPRIZE = [1, 0.6, 0.4, 0.25, 0.15, 0.1];
const LTRACKS = ['sunset', 'desert', 'night', 'airfield', 'harbor', 'alpine', 'volcano'];

function newSeasonDrivers(tier) {
  const T = LEAGUE_TIERS[tier], names = LEAGUE_NAMES.slice().sort(() => Math.random() - 0.5);
  return names.slice(0, 5).map((name, i) => {
    const o = OPPONENTS.find(x => x.id === T.opps[i % T.opps.length]);
    return { name, opp: o.id, color: pick(PAINT_COLORS), color2: pick(PAINT_COLORS), num: randi(2, 99), skill: clamp(o.skill + rand(-0.15, 0.08), 0.2, 0.98), pts: 0 };
  });
}
function ensureLeague() {
  if (!S.league) S.league = { tier: 0, season: 1, round: 0, next: 0, me: 0, drivers: newSeasonDrivers(0), trophies: [], log: [] };
  return S.league;
}
/** Auto eines Ligafahrers (Gegner-Auto in eigener Lackierung) */
function leagueCar(dr) {
  const o = OPPONENTS.find(x => x.id === dr.opp);
  const d = Object.assign(clone(o.design), { color: dr.color, color2: dr.color2, number: dr.num, name: dr.name });
  return { design: d, engine: o.engine, brand: o.brand, react: o.react };
}
const leagueTrack = L => { const ok = LTRACKS.filter(t => S.level >= (TRACKS[t].lvl || 1)); return ok[(L.season * 3 + L.round) % ok.length]; };
const leagueOpp = L => L.drivers[L.round % L.drivers.length];

ACTIONS.lgstart = () => {
  const L = ensureLeague();
  if (S.day < L.next) { toast(`Das nächste Ligarennen ist am ${fmtDate(L.next)}.`, 'bad'); return; }
  const me = raceEntry(RSEL.modelId); if (!me) { toast('Wähle ein Auto.', 'bad'); return; }
  const dr = leagueOpp(L), c = leagueCar(dr);
  startRace({
    player: { design: me.design, engine: me.engine, name: me.name, brand: me.brand, blowAt: me.risk && Math.random() < me.risk ? rand(1.2, 7) : null, salvageId: me.salvage ? me.id : null },
    opp: { design: c.design, engine: c.engine, name: dr.name, brand: c.brand, react: c.react, skill: dr.skill },
    dist: 'quarter', prize: 0, xp: LEAGUE_TIERS[L.tier].xp, rep: 1, fee: 0, league: true, track: leagueTrack(L), tod: RSEL.tod
  });
};
INPUTS.lgcar = el => { RSEL.modelId = el.value; rerender(); };

/** nach einem Ligarennen: Gesamtwertung aller Fahrer berechnen (aus showRaceResult aufgerufen) */
function leagueAfterRace(cfg, p, o) {
  const L = ensureLeague(), opp = leagueOpp(L);
  const total = (rec, foul) => (foul || !rec.et) ? 99 : (rec.react || 0) + rec.et;
  const res = [{ who: 'me', t: total(p, p.foul || p.blown) }];
  for (const dr of L.drivers) {
    if (dr === opp) { res.push({ who: dr, t: total(o, o.foul) }); continue; }
    const c = leagueCar(dr), car = computeCar(c.design, c.engine);
    res.push({ who: dr, t: car.t14 * (1 + rand(0.005, 0.02 + (1 - dr.skill) * 0.08)) + rand(c.react[0], c.react[1]) });
  }
  res.sort((a, b) => a.t - b.t);
  res.forEach((r, i) => { if (r.who === 'me') L.me += LPOINTS[i]; else r.who.pts += LPOINTS[i]; });
  const place = res.findIndex(r => r.who === 'me') + 1;
  L.log.unshift({ season: L.season, round: L.round + 1, place, track: cfg.track }); if (L.log.length > 12) L.log.pop();
  L.round++; L.next = S.day + 7;
  let txt = `<div class="card"><b>${ico('cup')} Ligarennen ${L.round}/${ROUNDS}: Platz ${place} von 6</b> – +${LPOINTS[place - 1]} Punkte<div class="hint">Gewertet: Reaktion + Fahrzeit aller 6 Fahrer.</div></div>`;
  if (L.round >= ROUNDS) setTimeout(leagueSeasonEnd, 400);
  return txt;
}
function leagueTable(L) {
  return [{ name: S.company + ' (Du)', me: true, pts: L.me }, ...L.drivers.map(d => ({ name: d.name, pts: d.pts, d }))].sort((a, b) => b.pts - a.pts);
}
function leagueSeasonEnd() {
  const L = ensureLeague(), T = LEAGUE_TIERS[L.tier], tab = leagueTable(L);
  const place = tab.findIndex(r => r.me) + 1, prize = Math.round(T.prize * LPRIZE[place - 1]);
  S.money += prize; addXP(T.xp * (7 - place)); addRep([5, 3, 2, 1, 0, 0][place - 1]);
  let extra = '';
  if (place <= 3) {
    L.trophies.push({ season: L.season, tier: L.tier, place });
    S.gems = (S.gems || 0) + [30, 20, 10][place - 1];
    extra += `<p>${ico('gem')} +${[30, 20, 10][place - 1]} Diamanten</p>`;
    const sp = pick(SPONSORS), per = Math.round(T.sponsor * [1, 0.6, 0.35][place - 1]);
    S.sponsor = { name: sp, perDay: per, until: S.day + 90 };
    extra += `<p>${ico('money')} Neuer Sponsor: <b>${sp}</b> zahlt dir <b>${fmtMoney(per)} pro Tag</b> für 90 Tage!</p>`;
  }
  const up = place <= 2 && L.tier < LEAGUE_TIERS.length - 1;
  if (up && S.level >= LEAGUE_TIERS[L.tier + 1].lvl) { L.tier++; extra += `<p class="good">${ico('star')} <b>Aufstieg in die ${LEAGUE_TIERS[L.tier].name}!</b></p>`; }
  else if (up) extra += `<p class="warn">Aufstieg in die ${LEAGUE_TIERS[L.tier + 1].name} ab Level ${LEAGUE_TIERS[L.tier + 1].lvl}.</p>`;
  openModal(`<h2 class="title">${ico('cup', 'big')} Saison ${L.season} beendet – Platz ${place}!</h2>
    <canvas id="podiumcv" width="200" height="70" class="cv" style="max-width:420px;margin:0 auto 10px;display:block"></canvas>
    <table class="t"><tr><th>#</th><th>Fahrer</th><th>Punkte</th></tr>${tab.map((r, i) => `<tr><td>${i + 1}</td><td>${r.me ? '<b>' + esc(r.name) + '</b>' : esc(r.name)}</td><td>${r.pts}</td></tr>`).join('')}</table>
    <p style="margin-top:8px">Preisgeld: <b class="good">${fmtMoney(prize)}</b></p>${extra}
    <button class="btn green" data-act="close">Neue Saison starten</button>`, true);
  drawPodium($('#podiumcv'), tab);
  sfx(place <= 3 ? 'level' : 'good');
  L.season++; L.round = 0; L.me = 0; L.drivers = newSeasonDrivers(L.tier); L.next = S.day + 3;
  checkAchievements(); saveGame();
}
/** Siegertreppchen mit Pixel-Pokalen */
function drawPodium(cv, tab) {
  if (!cv) return;
  const ctx = hdCtx(cv);
  ctx.fillStyle = '#1a1c2c'; ctx.fillRect(0, 0, 200, 70);
  for (let i = 0; i < 30; i++) { ctx.fillStyle = ['#ffcd75', '#a7f070', '#73eff7', '#ef7d57'][i % 4]; ctx.fillRect(Math.floor(hash2(i, 1) * 200), Math.floor(hash2(i, 2) * 40), 2, 1); }
  const steps = [[80, 30, 40, 1], [40, 40, 40, 2], [120, 46, 40, 3]];
  for (const [x, y, w, p] of steps) {
    ctx.fillStyle = '#566c86'; ctx.fillRect(x, y, w, 70 - y); ctx.fillStyle = '#94b0c2'; ctx.fillRect(x, y, w, 2);
    cxText(ctx, String(p), x + w / 2, y + 6, '#1a1c2c', 2, 'c');
    const r = tab[p - 1];
    cxText(ctx, (r.me ? 'DU' : r.name.split(' ')[0]).toUpperCase().slice(0, 9), x + w / 2, y - 8, r.me ? '#ffcd75' : '#f4f4f4', 1, 'c');
    drawTrophy(ctx, x + w / 2 - 5, y - 22, p);
  }
}
function drawTrophy(ctx, x, y, place) {
  const c = ['#ffcd75', '#c8ccd4', '#d48a3c'][place - 1] || '#566c86', d = shadeHex(c, -0.35);
  ctx.fillStyle = c; ctx.fillRect(x, y, 10, 6); ctx.fillRect(x + 1, y + 6, 8, 2); ctx.fillRect(x + 4, y + 8, 2, 3); ctx.fillRect(x + 2, y + 11, 6, 2);
  ctx.fillStyle = d; ctx.fillRect(x - 2, y + 1, 2, 3); ctx.fillRect(x + 10, y + 1, 2, 3); ctx.fillRect(x + 7, y + 1, 2, 6);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 2, y + 1, 1, 3);
}
/** Tageswechsel: Sponsorgeld */
function leagueDay() {
  if (S.sponsor && S.sponsor.until > S.day) S.money += S.sponsor.perDay;

function drawTrophyCase() {
  const cv = $('#trophycv'); if (!cv) return;

}
/* =============================================================================
   Teil 9f: Tuning-Werkstatt mit Leistungsprüfstand
   Renn-Tuning für eigene Modelle und Gebrauchtwagen (gilt nur fürs Drag Race,
   nicht für die Serienproduktion). Prüfstand mit animierter Leistungskurve.
   ============================================================================= */
ICONS.dyno = ['kkkkkkkk', 'kyyyyyyk', 'ky.yy.yk', 'kyyyyyyk', 'kkkkkkkk', '.kk..kk.', 'kssk.ssk', '.kk..kk.'];
// Anteile vom Neuwert pro Stufe; lvl = benötigtes Firmenlevel je Stufe
const TUNE_PARTS = {
  chip:    { name: 'Motor-Software',     max: 3, cost: [0.04, 0.08, 0.14], lvl: [1, 4, 9],  ps: [0.08, 0.16, 0.25], txt: l => `+${[8, 16, 25][l]} % Leistung` },

  nitro:   { name: 'Lachgas-Kit',        max: 2, cost: [0.05, 0.12], lvl: [5, 12], nos: ['small', 'big'], noEV: true, txt: l => ['NOS klein (+30 %)', 'NOS gross (+55 %)'][l] }
};
/** Tuning auf Design/Motor anwenden (Kopien, Original bleibt unverändert) */
function applyTune(d, e, tune) {
  d = clone(d); e = clone(e);
  if (!tune) return { d, e };
  const isEV = e.type === 'ev';
  let ps = 1, w = 1, grip = 0, shift = 1;
  for (const [k, P] of Object.entries(TUNE_PARTS)) {
    const l = tune[k] | 0; if (!l || (P.noEV && isEV)) continue;
    if (P.ps) ps *= 1 + P.ps[l - 1];
    if (P.w) w *= P.w[l - 1];
    if (P.grip) grip += P.grip[l - 1];
    if (P.shift) shift *= P.shift[l - 1];
    if (P.nos) { const n = P.nos[l - 1]; if (NOS_TYPES[n].mul > (NOS_TYPES[e.nos] || NOS_TYPES.none).mul) e.nos = n; }
  }
  e.wearMul = (e.wearMul || 1) * ps; e.shiftMul = (e.shiftMul || 1) * shift;
  d.wAdj = (d.wAdj || 1) * w; d.gripAdj = (d.gripAdj || 0) + grip;
  return { d, e };
}
/** Fahrzeug-Objekt (Modell oder Gebrauchtwagen) zu einer ID */
function tuneTarget(id) {
  const pe = premiumEntry(id);
  if (pe) { S.ptune = S.ptune || {}; const h = S.ptune[id] = S.ptune[id] || { tune: {} }; return { obj: h, design: pe.d, engine: pe.e, name: pe.P.name, base: computeCar(pe.d, pe.e).prodCost }; }
  const m = modelById(id); if (m) return { obj: m, design: m, engine: getEngine(m.engineId), name: m.name, base: carOf(m).prodCost };
  const o = S.salvage && S.salvage.owned.find(x => x.id === id);
  if (o) { const ef = svEffective(o); return { obj: o, design: ef.d, engine: ef.e, name: o.name, base: svBaseValue(o) / 1.4, salvage: true }; }
  return null;
}
const tuneCost = (T, k, l) => Math.max(500, Math.round(T.base * TUNE_PARTS[k].cost[l] / 100) * 100);

let TSEL = null, DYNO = null;
INPUTS.tcar = el => { TSEL = el.value; DYNO = null; rerender(); };
ACTIONS.tbuy = d => {
  const T = tuneTarget(TSEL); if (!T) return;
  const k = d.v, P = TUNE_PARTS[k], tune = T.obj.tune = T.obj.tune || {}, l = tune[k] | 0;
  if (l >= P.max) return;
  if (S.level < P.lvl[l]) { toast(`Stufe ${l + 1} ab Level ${P.lvl[l]}.`, 'bad'); return; }
  const c = tuneCost(T, k, l);
  if (S.money < c) { toast('Zu wenig Geld.', 'bad'); return; }
  S.money -= c; tune[k] = l + 1; if (T.salvage) T.obj.paid += c;
  addXP(20 + l * 20);
  toast(`${ico('wrench')} ${P.name} Stufe ${l + 1} verbaut: ${P.txt(l)}`, 'good');
  rerender();
};
ACTIONS.treset = () => {
  const T = tuneTarget(TSEL); if (!T || !T.obj.tune) return;
  confirmBox('Alle Tuningteile ausbauen? Du bekommst 30 % der Kosten zurück.', () => {
    let back = 0; for (const [k, l] of Object.entries(T.obj.tune)) for (let i = 0; i < l; i++) back += tuneCost(T, k, i) * 0.3;
    S.money += Math.round(back); T.obj.tune = {}; rerender();
  }, 'Ausbauen');
};
ACTIONS.tdyno = () => {
  const T = tuneTarget(TSEL); if (!T) return;
  const tt = applyTune(T.design, T.engine, T.obj.tune);
  const car = computeCar(tt.d, tt.e);
  DYNO = { t0: performance.now(), car, design: tt.d, prev: T.obj.dyno || null };
  T.obj.dyno = car.ps; if (T.engine) dynoMark(engKey(T.engine));
  if (SFX.on) { tone(70, 4.2, 'sawtooth', 0.035, 0, 330); tone(35, 4.2, 'square', 0.02, 0, 165); }
};

// ---------- Prüfstand-Szene 320x150 ----------
let _dynoBG = null;
function dynoBackground() {
  if (_dynoBG) return _dynoBG;
  const W = 320, H = 150, pb = new PB(W, H);
  for (let y = 0; y < 112; y++) for (let x = 0; x < W; x++) {
    const row = Math.floor(y / 6), off = (row % 2) * 8, mortar = y % 6 === 5 || (x + off) % 16 === 15;
    pb.set(x, y, Crgb(shadeRGB(mortar ? [20, 16, 32] : [42, 30, 58], (hash2((x + off) >> 4, row) - 0.5) * 0.2 - 0.1)));
  }
  for (let y = 112; y < H; y++) for (let x = 0; x < W; x++) pb.set(x, y, Crgb(shadeRGB(((x >> 4) + (y >> 3)) % 2 ? [30, 32, 44] : [38, 40, 54], -(y - 112) / 90)));
  pb.rect(0, 112, W, 1, Chex('#0d0f1a'));
  // Werkzeugwagen und Reifen
  pb.rect(276, 84, 34, 28, Chex('#b13e53')); for (let y = 88; y < 112; y += 6) pb.rect(277, y, 32, 1, Chex('#6a1e2e')); pb.rect(276, 84, 34, 1, Chex('#ef7d57'));
  for (let i = 0; i < 3; i++) { pb.disc(14, 104 - i * 7, 7, Chex('#1e1e24')); pb.rect(7, 101 - i * 7, 14, 1, Chex('#3a3a44')); }
  _dynoBG = pb.canvas();
  return _dynoBG;
}
function drawDyno(ctx, T, t) {
  const W = 320;
  ctx.drawImage(dynoBackground(), 0, 0);
  // Neon-Schriftzug flackert
  const name = (S.company + ' TUNING').toUpperCase().slice(0, 26), on = !(Math.sin(t * 13) > 0.93);
  ctx.save(); ctx.globalAlpha = on ? 0.35 : 0.1; ctx.fillStyle = '#ff4bd0'; ctx.fillRect(W / 2 - textW(name, 2) / 2 - 6, 6, textW(name, 2) + 12, 16); ctx.restore();
  cxText(ctx, name, W / 2, 9, on ? '#ffd0f4' : '#8a4a7a', 2, 'c');
  ctx.fillStyle = on ? '#73eff7' : '#2a4a5a'; ctx.fillRect(20, 30, 70, 2); ctx.fillRect(230, 30, 70, 2);
  if (!T) return;
  const run = DYNO ? clamp((performance.now() - DYNO.t0) / 4200, 0, 1) : 0, active = DYNO && run < 1;
  const tt = DYNO ? { d: DYNO.design } : applyTune(T.design, T.engine, T.obj.tune);
  const car = DYNO ? DYNO.car : computeCar(tt.d, tt.e), E = car.E;
  const rpmF = active ? 0.15 + 0.85 * run : DYNO ? 0.15 : 0.12;
  const rpm = E.isEV ? rpmF * E.red : E.idle + rpmF * (E.red - E.idle);
  const s = renderCar(tt.d, { angle: active ? (t * 40 * rpmF) % (Math.PI * 2) : 0, lights: true, exh: tt.e ? tt.e.exh : 'race', brand: S.company });
  const shake = active ? Math.round((Math.random() - 0.5) * 2 * run) : 0;
  const K = 1.5;                                                   // 1,5-fach: ein Sprite-Pixel = ein Bildschirmpixel
  const x0 = Math.round(200 - s.W * K / 2), y0 = Math.round(128 - s.gy * K) + shake;
  // Prüfstand-Plattform und Rollen
  ctx.fillStyle = '#22263a'; ctx.fillRect(x0 + s.ox * K - 12, 126, s.L * K + 24, 8); ctx.fillStyle = '#ffcd75'; for (let x = x0 + s.ox * K - 12; x < x0 + (s.ox + s.L) * K + 12; x += 8) ctx.fillRect(x, 126, 4, 1);
  for (const w of s.wheels) for (const dx of [-4, 4]) { ctxDisc(ctx, x0 + w.x * K + dx, 130, 3, '#5a5e68'); ctx.fillStyle = '#c8ccd4'; ctx.fillRect(x0 + w.x * K + dx - 1, 129, 1, 1); }
  ctx.drawImage(s.cv, x0, y0, s.W * K, s.H * K);
  // Abgasflammen bei hoher Drehzahl
  if (active && run > 0.6 && Math.random() > 0.4) { const ex = x0 + s.exhaust.x * K, ey = y0 + s.exhaust.y * K; for (let i = 0; i < 6 + run * 8; i++) { ctx.fillStyle = i < 2 ? '#fff4c0' : i < 5 ? '#ffcd75' : '#ef7d57'; ctx.fillRect(ex - i, ey - (i > 3 ? 1 : 0), 1, 2); } }
  // Grosser Ventilator vor dem Auto
  const fx = Math.min(W - 14, x0 + (s.ox + s.L) * K + 18), fy = 104;
  ctxDisc(ctx, fx, fy, 13, '#14151c'); ctxDisc(ctx, fx, fy, 11, '#2a2b33');
  const fa = active ? t * 25 : t * 2;
  for (let i = 0; i < 5; i++) for (let r = 2; r < 10; r += 0.5) { const a = fa + i * 1.2566 + r * 0.08; ctx.fillStyle = '#5a5e68'; ctx.fillRect(Math.round(fx + Math.cos(a) * r), Math.round(fy + Math.sin(a) * r), 1, 1); }
  ctx.fillStyle = '#3a3e48'; ctx.fillRect(fx - 2, fy + 12, 4, 10);
  // Monitor mit Leistungskurve
  const mx = 8, my = 34, mw = 104, mh = 58;
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4); ctx.fillStyle = '#05060c'; ctx.fillRect(mx, my, mw, mh);
  for (let x = 0; x < mw; x += 13) { ctx.fillStyle = '#14182a'; ctx.fillRect(mx + x, my, 1, mh); }
  let maxP = 0; for (let i = 1; i <= 50; i++) { const r = i / 50 * E.red; maxP = Math.max(maxP, E.torque(r) * r); }
  const upto = DYNO ? (active ? run : 1) : 0;
  for (let x = 0; x < mw * upto; x++) {
    const r = Math.max(E.isEV ? 1 : E.idle, (x + 1) / mw * E.red);
    const tq = E.torque(r) / E.nm, p = E.torque(r) * r / maxP;
    ctx.fillStyle = '#ef7d57'; ctx.fillRect(mx + x, Math.round(my + mh - 4 - tq * (mh - 14)), 1, 2);
    ctx.fillStyle = '#ffcd75'; ctx.fillRect(mx + x, Math.round(my + mh - 4 - p * (mh - 14)), 1, 2);
  }
  const psNow = DYNO ? Math.round(car.ps * (active ? Math.min(1, (E.torque(rpm) * rpm) / maxP) : 1)) : 0;
  cxText(ctx, DYNO ? psNow + ' PS' : 'BEREIT', mx + mw - 3, my + 3, '#a7f070', 1, 'r');
  cxText(ctx, Math.round(rpm) + ' U/MIN', mx + 3, my + 3, '#73eff7');
  if (DYNO && !active) {
    cxText(ctx, car.ps + ' PS', W / 2 + 4, 40, '#ffcd75', 3, 'c', '#000');
    cxText(ctx, car.nm + ' NM', W / 2 + 4, 62, '#ef7d57', 2, 'c', '#000');
    if (DYNO.prev && DYNO.prev !== car.ps) cxText(ctx, (car.ps > DYNO.prev ? '+' : '') + (car.ps - DYNO.prev) + ' PS ZUM LETZTEN LAUF', W / 2 + 4, 78, car.ps > DYNO.prev ? '#a7f070' : '#ff7b8a', 1, 'c', '#000');
  }
}

   Teil 9h: Konten, Anmeldung und Super-Admin
   Jedes Konto hat einen eigenen Spielstand. Konten liegen im localStorage des
   Browsers. HINWEIS: Das ist ein lokales Login ohne Server – wer Zugriff auf
   den Browser hat, kann die Daten ändern. Für echte Sicherheit braucht es

ICONS.crown = ['........', '.k.kk.k.', 'kykyykyk', 'kyyyyyyk', 'kyryyeyk', 'kyyyyyyk', 'kooooook', 'kkkkkkkk'];
ICONS.user = ['..kkkk..', '.kssssk.', '.kswwsk.', '.kssssk.', '..kkkk..', '.kbbbbk.', 'kbbbbbbk', 'kkkkkkkk'];

const ACC_KEY = 'autotycoon_accounts';
const SES_KEY = 'autotycoon_session';
let AUTH_USER = null;                     // angemeldeter Benutzername (klein geschrieben)

// ---------- Passwort-Hash (gesalzen, mehrfach) ----------
function _h53(str, seed) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}
function pwHash(pw, salt) { let h = salt + ':' + pw; for (let i = 0; i < 2000; i++) h = _h53(h + pw, i); return h; }
const newSalt = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

// ---------- Kontenspeicher ----------
function loadAccounts() {
  let a = null;
  try { a = JSON.parse(localStorage.getItem(ACC_KEY) || 'null'); } catch (e) { a = null; }
  if (!a || typeof a.users !== 'object') a = { users: {} };
  // Super-Admin-Konto immer vorhanden (Standard: admin / admin)
  if (!a.users.admin) { const s = newSalt(); a.users.admin = { name: 'admin', salt: s, hash: pwHash('admin', s), role: 'superadmin', created: Date.now(), last: 0 }; saveAccounts(a); }
  return a;
}
function saveAccounts(a) { try { localStorage.setItem(ACC_KEY, JSON.stringify(a)); } catch (e) { /* ignorieren */ } }
const userKey = n => String(n || '').trim().toLowerCase();
const currentAccount = () => AUTH_USER ? loadAccounts().users[AUTH_USER] : null;
const isAdmin = () => { const u = currentAccount(); return !!(u && (u.role === 'superadmin' || u.role === 'admin')); };
const isSuperAdmin = () => { const u = currentAccount(); return !!(u && u.role === 'superadmin'); };
const saveKeyFor = n => SAVE_KEY + ':' + userKey(n);
const ROLE_NAME = { superadmin: 'Super-Admin', admin: 'Admin', player: 'Spieler' };

function checkLogin(name, pw) {
  const u = loadAccounts().users[userKey(name)];
  return !!(u && pwHash(pw, u.salt) === u.hash);
}
function createAccount(name, pw, role = 'player') {
  const k = userKey(name);
  if (!/^[a-z0-9_.-]{3,16}$/.test(k)) return 'Benutzername: 3–16 Zeichen (Buchstaben, Zahlen, _ . -).';
  if (String(pw).length < 4) return 'Passwort: mindestens 4 Zeichen.';
  const a = loadAccounts();
  if (a.users[k]) return 'Diesen Benutzernamen gibt es schon.';
  const s = newSalt();
  a.users[k] = { name: String(name).trim(), salt: s, hash: pwHash(pw, s), role, created: Date.now(), last: 0 };
  saveAccounts(a);
  return null;
}

function loginAs(k, remember, fresh) {
  AUTH_USER = k;
  try {
    if (remember) localStorage.setItem(SES_KEY, k); else localStorage.removeItem(SES_KEY);
    sessionStorage.setItem(SES_KEY, k);
  } catch (e) { /* ignorieren */ }
  const a = loadAccounts(); a.users[k].last = Date.now(); saveAccounts(a);
  // alter Spielstand von vor den Konten → geht an den Super-Admin
  try {
    if (k === 'admin' && !localStorage.getItem(saveKeyFor(k)) && localStorage.getItem(SAVE_KEY)) localStorage.setItem(saveKeyFor(k), localStorage.getItem(SAVE_KEY));
  } catch (e) { /* ignorieren */ }
  $('#login').classList.add('hidden'); $('#login').innerHTML = '';
  startGameForUser(fresh);
}
function sessionUser() {
  let k = null;
  try { k = sessionStorage.getItem(SES_KEY) || localStorage.getItem(SES_KEY); } catch (e) { k = null; }
  return k && loadAccounts().users[k] ? k : null;
}
ACTIONS.logout = () => {

const adm = () => (S.admin = S.admin || { money: false, gems: false, rp: false, freeShop: false, noCost: false });
/** jede Frame: „unendlich“-Werte auffüllen */
function adminTick() {
  if (!S || !S.admin || !isAdmin()) return;
  const A = S.admin;
  if (A.money && S.money < 1e9) S.money = 1e9;
  if (A.gems && S.gems < 99999) S.gems = 99999;
  if (A.rp && S.rp < 999) S.rp = 999;
}
const adminInf = k => !!(S && S.admin && S.admin[k] && isAdmin());

function adminUnlockAll() {
  S.techs = Array.from(new Set(S.techs.concat(TECHS.map(t => t.id), STYLE_ITEMS.map(s => s.id))));
  S.premium = PREMIUM_CARS.map(p => p.id);
  _carCache.clear(); _spriteCache.clear();
}
function adminMaxTune() {
  S.ptune = S.ptune || {};
  const full = Object.fromEntries(Object.entries(TUNE_PARTS).map(([k, p]) => [k, p.max]));
  (S.premium || []).forEach(id => { S.ptune[id] = { tune: clone(full) }; });
  S.models.forEach(m => { m.tune = clone(full); });
  _carCache.clear(); _spriteCache.clear();
}
function adminSetLevel(l) {
  l = clamp(Math.round(l) || 1, 1, 99);
  while (S.level < l) { S.level++; S.rp += rpGain(S.level); }

}

function readUserSave(k) { try { return JSON.parse(localStorage.getItem(saveKeyFor(k)) || 'null'); } catch (e) { return null; } }
function writeUserSave(k, st) { try { localStorage.setItem(saveKeyFor(k), JSON.stringify(st)); } catch (e) { /* ignorieren */ } }

  if (!u) return;

ACTIONS.exportSave = () => {
  saveGame();
  const data = { game: 'AutoTycoon', format: 1, exported: new Date().toISOString(), user: AUTH_USER, state: S };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  const safe = String(S.company || 'spiel').replace(/[^a-z0-9_-]+/gi, '_').slice(0, 30);
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `AutoTycoon_${safe}_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`${ico('check')} Spielstand als Datei gespeichert: <b>${a.download}</b>`, 'good', 6000);
};
ACTIONS.importSave = () => { const f = $('#imp-file'); if (f) f.click(); };
/** prüft eine Import-Datei und lädt sie nach Rückfrage */
function parseImport(text) {
  let d; try { d = JSON.parse(text); } catch (e) { return { err: 'Die Datei ist keine gültige Spielstand-Datei.' }; }
  const st = d && d.game === 'AutoTycoon' ? d.state : d;     // auch reine Spielstände annehmen
  if (!st || st.v !== 1 || !Array.isArray(st.models) || !st.factory) return { err: 'Diese Datei enthält keinen AutoTycoon-Spielstand.' };
  return { st, info: `${esc(st.company)} · Level ${st.level} · ${fmtMoney(st.money)}${d.exported ? ' · exportiert am ' + new Date(d.exported).toLocaleDateString('de-CH') : ''}` };
}
function importSaveFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const r = parseImport(String(rd.result));
    if (r.err) { closeModal(); toast(r.err, 'bad', 5000); return; }
    confirmBox(`Spielstand laden?<br><b>${r.info}</b><br><span class="hint">Dein aktueller Spielstand wird dabei ersetzt. Tipp: Exportiere ihn vorher als Sicherung.</span>`, () => applyImport(r.st), 'Laden');
  };
  rd.readAsText(file);
}
function applyImport(st) {
  try { localStorage.setItem(curSaveKey(), JSON.stringify(st)); } catch (e) { toast('Speichern im Browser nicht möglich.', 'bad'); return; }
  const loaded = loadGame();
  if (!loaded) { toast('Der Spielstand konnte nicht geladen werden.', 'bad'); return; }
  S = loaded; _carCache.clear(); _spriteCache.clear(); _tbCache = '';
  renderTopbar(); setTab('home');
  toast(`${ico('check')} Spielstand <b>${esc(S.company)}</b> geladen.`, 'good', 5000);
}

const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function seededRand(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const CHAL_TYPES = [
  { id: 'win',     make: (r, L) => ({ n: 2 + Math.floor(r() * 3) }),           txt: c => `Gewinne ${c.n} Drag Races` },
  { id: 'track',   make: (r, L) => { const ok = Object.keys(TRACKS).filter(k => L >= (TRACKS[k].lvl || 1)); return { n: 1, track: ok[Math.floor(r() * ok.length)] }; }, txt: c => `Gewinne ein Rennen auf „${TRACKS[c.track].name}“` },
  { id: 'launch',  make: (r, L) => ({ n: 2 + Math.floor(r() * 2) }),           txt: c => `Schaffe ${c.n} perfekte Starts` },
  { id: 'shift',   make: (r, L) => ({ n: 5 + Math.floor(r() * 6) }),           txt: c => `Schalte ${c.n}-mal perfekt` },
  { id: 'sell',    make: (r, L) => ({ n: Math.round(5 + L * 4 + r() * L * 3) }), txt: c => `Verkaufe ${c.n} Autos` },
  { id: 'react',   make: (r, L) => ({ n: 1, lim: 0.2 }),                       txt: c => `Reaktionszeit unter ${c.lim.toFixed(2)} s` },
  { id: 'ghost',   make: (r, L) => ({ n: 1 }),                                 txt: c => 'Stelle eine neue Streckenbestzeit auf' }
];
function dailyEnsure() {
  if (!S) return null;
  const k = todayKey();
  if (S.daily && S.daily.key === k) return S.daily;
  const r = seededRand(k + '|' + (AUTH_USER || '') + '|' + S.company), L = S.level;
  const pool = CHAL_TYPES.slice(), list = [];
  while (list.length < 3 && pool.length) {
    const T = pool.splice(Math.floor(r() * pool.length), 1)[0];
    list.push(Object.assign({ type: T.id, cur: 0, done: false, claimed: false, gems: 10 + Math.floor(r() * 3) * 5, money: Math.round(2000 * Math.pow(L, 1.35) / 500) * 500 }, T.make(r, L)));
  }
  S.daily = { key: k, list };
  return S.daily;
}
const chalText = c => CHAL_TYPES.find(t => t.id === c.type).txt(c);
const dailyOpen = () => { const D = S && S.daily; return !!(D && D.key === todayKey() && D.list.some(c => c.done && !c.claimed)); };
/** Fortschritt melden: chalEvent('race', {win, R}) | chalEvent('sell', n) */
function chalEvent(kind, data) {
  const D = dailyEnsure(); if (!D) return;
  let changed = false;
  for (const c of D.list) {
    if (c.done) continue;
    const before = c.cur;
    if (kind === 'sell' && c.type === 'sell') c.cur += data;
    if (kind === 'race') {
      const R = data.R, p = R.p;
      if (c.type === 'win' && data.win) c.cur++;
      if (c.type === 'track' && data.win && R.cfg.track === c.track) c.cur++;
      if (c.type === 'launch' && p.launchQ === 'perfect') c.cur++;
      if (c.type === 'shift') c.cur += p.shifts.filter(s => s === 'perfect').length;
      if (c.type === 'react' && !p.foul && p.react != null && p.react < c.lim) c.cur++;
      if (c.type === 'ghost' && R.ghostNew) c.cur++;
    }
    if (c.cur !== before) changed = true;
    if (c.cur >= c.n) { c.cur = c.n; c.done = true; toast(`${ico('star', 'big')} <div><b>Tages-Herausforderung geschafft!</b><br>${chalText(c)} – hol dir die Belohnung unter <b>Ziele</b>.</div>`, 'good', 5000); sfx('goal'); }
  }
  if (changed) renderNav();
}

/** gefüllter Pixel-Kreis direkt auf Canvas (HD: aus Zwischenspeicher kopiert) */
const _discCache = new Map();
function ctxDisc(ctx, cx, cy, r, col) {
  const M = ctx.getTransform();
  if (M.a >= 2) {
    const rr = Math.round(r * M.a * 4) / 4, RR = Math.ceil(rr), key = col + '|' + rr;
    let c = _discCache.get(key);
    if (!c) {
      c = document.createElement('canvas'); c.width = c.height = RR * 2 + 1;
      const g = c.getContext('2d'); g.fillStyle = col;
      for (let y = -RR; y <= RR; y++) { const w = Math.floor(Math.sqrt(Math.max(0, rr * rr - y * y))); g.fillRect(RR - w, RR + y, w * 2 + 1, 1); }
      if (_discCache.size > 400) _discCache.clear();
      _discCache.set(key, c);
    }
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(c, Math.round(M.a * cx + M.e) - RR, Math.round(M.d * cy + M.f) - RR);
    ctx.restore(); return;
  }
  ctx.fillStyle = col;
  const R = Math.ceil(r);
  for (let y = -R; y <= R; y++) { const w = Math.floor(Math.sqrt(Math.max(0, r * r - y * y))); if (w >= 0) ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); }
}

    for (let y = 24; y < 30; y++) set(y, T.hills);

    if (h < 56) { const dx = h - 28, top = 12 + Math.round(dx * dx / 90); for (let y = top; y < 30; y++) set(y, y === top ? '#c8ccd4' : (h > 14 && h < 42 && y > 21) ? (y % 2 ? '#3a3e48' : '#566c86') : '#94a0b0'); }

    if (x > 300 && x < 307) set(13 + Math.floor((x - 300) / 4), (x % 2) ? '#ef7d57' : '#f4f4f4');
  } else if (T.scene === 'harbor') {
    for (let y = 26; y < 30; y++) set(y, (y + x) % 7 ? '#2a3a50' : '#4a5a70');                                          // Meer
    const c = x % 120;                                                                                                   // Containerkran
    if (c === 20 || c === 34) for (let y = 4; y < 26; y++) set(y, '#b13e53');
    if (c >= 8 && c <= 60) { set(5, '#b13e53'); if (c % 4 === 0) set(6, '#b13e53'); }
    if (c === 52) for (let y = 6; y < 14; y++) set(y, '#3a3e48');
    const st = x % 50;                                                                                                   // Containerstapel
    if (x % 120 > 62 && st < 44) { const hgt = 2 + Math.floor(hash2(Math.floor(x / 11), 4) * 4); const cols = ['#b13e53', '#3b5dc9', '#38b764', '#ef7d57', '#ffcd75'];
      for (let k = 0; k < hgt; k++) for (let y = 25 - k * 4 - 3; y < 25 - k * 4; y++) set(y, x % 11 === 0 ? '#1a1c2c' : shadeHex(cols[Math.floor(hash2(Math.floor(x / 11), k) * 5)], -0.35)); }

/** Alle Radstellungen beider Autos vorab zeichnen, damit das Rennen nicht ruckelt (mit Ladebalken) */
function preloadRace(R) {
  const jobs = [];
  for (const who of ['p', 'o']) for (const br of [true, false]) for (let k = 0; k < 16; k++) jobs.push([who, k / 16 * Math.PI * 2, br]);
  if (R.ghost) jobs.push(['g', 0, false]);
  const total = jobs.length;
  R.loading = true; R.raf = 0;
  const tick = () => {
    if (RACE !== R || R.manual) return;
    const t0 = performance.now();
    while (jobs.length && performance.now() - t0 < 25) { const [who, a, br] = jobs.shift(); if (who === 'g') { renderCar(R.ghost.design, { angle: 0, brake: false, lights: false }); continue; } const [d, o] = raceCarArgs(R, who, a, br); const Ly = carLayers(d, o); carWheelLayer(Ly, Math.round(a / (Math.PI * 2) * 16) % 16); }

    if (jobs.length) { R.loadTO = setTimeout(tick, 0); return; }
    R.hud = buildHUDLayer(R);
    R.loading = false; R.last = performance.now();
    R.raf = requestAnimationFrame(raceLoop);
  };

  R.loadTO = setTimeout(tick, 16);
}

// ---------- Hauptschleife ----------
function raceLoop(now) {
  const R = RACE; if (!R) return;
  R.raf = requestAnimationFrame(raceLoop);                 // zuerst neu anmelden: ein Fehler darf das Rennen nie einfrieren
  // Zeitschritt nie negativ (der Zeitstempel des ersten Bildes kann vor R.last liegen) und höchstens 50 ms
  const dt = clamp((now - R.last) / 1000, 0, 0.05) * photoFactor(R); R.last = Math.max(R.last, now);
  try {
    const steps = Math.max(1, Math.round(dt / (1 / 240)));
    for (let i = 0; i < steps; i++) (R.cruise ? cruiseStep : raceStep)(dt / steps);
    drawRace();
    audioUpdate();
  } catch (e) { if (!R.errLogged) { R.errLogged = true; console.error('Rennen:', e); } }
}

function raceStep(dt) {
  const R = RACE, pv = R.pv, ov = R.ov;
  R.t += dt;
  if (R.msgT > 0) R.msgT -= dt;

  R.flame.p = Math.max(0, R.flame.p - dt); R.flame.o = Math.max(0, R.flame.o - dt);
  const pre = !pv.launched;

      else {

        if (!R.pc.E.isEV) {

          else if (u > z.c) { raceMsg('ZU VIEL GAS!', '#ef7d57', 1.2); R.p.launchQ = 'high'; }
          else { raceMsg('ZU WENIG DREHZAHL', '#ffcd75', 1.2); R.p.launchQ = 'low'; }
