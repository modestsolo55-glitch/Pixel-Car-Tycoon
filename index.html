<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161f">
<title>AutoTycoon</title>
<!-- Pixel-Schriften (Fallback: Monospace, das Spiel läuft auch offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<!-- Three.js nur für den 3D-Showroom -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ===================== Grundfarben (Pixel-Palette) ===================== */
:root{
  --bg:#1a1c2c; --bg2:#22263a; --panel:#333c57; --panel2:#3e4a6b; --line:#0d0f1a;
  --text:#f4f4f4; --muted:#94b0c2; --yellow:#ffcd75; --orange:#ef7d57; --red:#b13e53;
  --green:#38b764; --lime:#a7f070; --blue:#3b5dc9; --sky:#41a6f6; --cyan:#73eff7;
  --purple:#5d275d; --dark:#29366f; --gray:#566c86;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Pixelify Sans','Courier New',monospace;font-size:16px;overflow:hidden;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
img.ico{image-rendering:pixelated;width:16px;height:16px;vertical-align:middle;display:inline-block}
img.ico.big{width:24px;height:24px}
.hf{font-family:'Press Start 2P',monospace}
b,strong{color:var(--yellow);font-weight:600}
.muted{color:var(--muted)} .good{color:var(--lime)} .bad{color:#ff7b8a} .warn{color:var(--yellow)}
/* ===================== Layout ===================== */
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
#topbar{display:flex;gap:7px;align-items:center;padding:6px 8px;background:var(--dark);border-bottom:4px solid var(--line);flex-wrap:wrap;position:relative;z-index:5}
#tb-goaltxt{max-width:210px;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--yellow)}
#topbar .brand{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:18px;color:var(--yellow);margin-right:6px;text-shadow:2px 2px 0 #000;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:5px;background:var(--bg2);padding:3px 8px;box-shadow:0 -2px 0 var(--line),0 2px 0 var(--line),-2px 0 0 var(--line),2px 0 0 var(--line);white-space:nowrap;font-size:15px;min-height:26px}
.xpbar{width:74px;height:9px;background:#000;position:relative;box-shadow:0 0 0 1px #566c86}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--lime) 0 5px,var(--green) 5px 6px)}
.spd{display:flex;gap:0}
.spd button{font-family:inherit;font-size:13px;background:#14182a;color:var(--muted);border:0;padding:4px 8px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.spd button.on{background:var(--yellow);color:var(--bg)}
#main{display:grid;grid-template-columns:172px 1fr;min-height:0}
#nav{background:var(--bg2);border-right:4px solid var(--line);overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:7px}
#nav button{font-family:inherit;font-size:15px;text-align:left;display:flex;align-items:center;gap:8px;color:var(--text);background:var(--panel);border:0;padding:7px 8px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.12),0 -2px 0 var(--line),0 2px 0 var(--line),-2px 0 0 var(--line),2px 0 0 var(--line)}
#nav button:hover{background:var(--panel2)}
#nav button.on{background:var(--yellow);color:var(--bg)}
#nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:0 5px}
#content{overflow:auto;padding:12px 14px 40px;min-height:0;position:relative}
/* ===================== Pixel-Elemente ===================== */
.btn{font-family:inherit;font-size:15px;color:#fff;background:var(--sky);border:0;padding:6px 12px;cursor:pointer;margin:4px;position:relative;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.28),0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line)}
.btn:hover{filter:brightness(1.12)}
.btn:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.35),0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line);transform:translateY(1px)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.orange{background:var(--orange)}
.btn.yellow{background:var(--yellow);color:var(--bg)} .btn.gray{background:var(--gray)} .btn.dark{background:#262b44}
.btn.sel{background:var(--yellow);color:var(--bg)}
.btn.sm{font-size:13px;padding:3px 8px;margin:3px}
.btn.big{font-size:18px;padding:10px 18px}
.btn:disabled,.btn.lock{background:#3a3f52;color:#7d8296;cursor:not-allowed;filter:none}
.btn.lock::after{content:'';position:absolute;right:-4px;top:-6px;width:10px;height:10px;background:var(--lock-ico) no-repeat center/10px;image-rendering:pixelated}
.panel{background:var(--panel);padding:10px 12px;margin:6px 4px 16px;box-shadow:0 -4px 0 var(--line),0 4px 0 var(--line),-4px 0 0 var(--line),4px 0 0 var(--line),inset 0 4px 0 rgba(255,255,255,.07),inset 0 -4px 0 rgba(0,0,0,.2)}
.panel h3{font-family:'Pixelify Sans','Courier New',monospace;font-weight:700;letter-spacing:1px;font-size:17px;color:var(--yellow);margin-bottom:10px;text-transform:uppercase;line-height:1.5;display:flex;align-items:center;gap:8px}
.panel.dark{background:#262b44}
h2.title{font-family:'Pixelify Sans','Courier New',monospace;font-weight:700;font-size:26px;letter-spacing:1px;color:var(--yellow);margin:4px 4px 12px;text-shadow:3px 3px 0 #000;display:flex;align-items:center;gap:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1 1 320px;min-width:0}
.col.narrow{flex:0 1 300px}
.opts{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:2px}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:1px}
input[type=text],input[type=number],input[type=password],select{font-family:inherit;font-size:16px;background:#0d0f1a;color:var(--text);border:0;padding:5px 8px;box-shadow:0 0 0 3px var(--gray);outline:none;margin:4px;max-width:100%}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,select:focus{box-shadow:0 0 0 3px var(--yellow)}
input[type=color]{width:34px;height:26px;border:0;padding:0;background:none;cursor:pointer;margin:3px;box-shadow:0 0 0 2px var(--line)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:#0d0f1a;box-shadow:0 0 0 2px var(--gray);margin:8px 0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;background:var(--yellow);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 0 0 2px var(--line);border:0}
input[type=range]::-moz-range-thumb{width:14px;height:22px;background:var(--yellow);border:0;border-radius:0;box-shadow:0 0 0 2px var(--line)}
.sw{width:22px;height:22px;border:0;cursor:pointer;box-shadow:0 0 0 2px var(--line);margin:3px;display:inline-block;vertical-align:middle}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--line)}
.stat{display:grid;grid-template-columns:118px 1fr 84px;gap:8px;align-items:center;font-size:14px;margin:3px 0}
.stat span:last-child{text-align:right}
.bar{height:10px;background:#0d0f1a;position:relative;box-shadow:0 0 0 1px #000}
.bar i{position:absolute;left:0;top:0;bottom:0}
.pbar{height:14px;background:#0d0f1a;position:relative;box-shadow:0 0 0 2px var(--line);overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--green) 0 6px,var(--lime) 6px 8px)}
.pbar.blue i{background:repeating-linear-gradient(90deg,var(--sky) 0 6px,var(--cyan) 6px 8px)}
.pbar em{position:absolute;inset:0;font-style:normal;font-size:11px;text-align:center;line-height:14px;color:#fff;text-shadow:1px 1px 0 #000}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{color:var(--yellow);text-align:left;font-weight:400;padding:4px 6px;border-bottom:3px solid var(--line);font-size:12px;text-transform:uppercase}
table.t td{padding:4px 6px;border-bottom:1px solid rgba(0,0,0,.3)}
table.t tr:nth-child(even) td{background:rgba(255,255,255,.035)}
.tag{display:inline-block;font-size:13px;padding:1px 6px;background:#0d0f1a;color:var(--muted);margin:1px}
.tag.y{color:var(--yellow)} .tag.g{color:var(--lime)} .tag.r{color:#ff7b8a}
.cv{width:100%;height:auto;box-shadow:0 0 0 4px var(--line);background:#000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.card{background:#262b44;padding:8px;box-shadow:0 0 0 3px var(--line);margin:6px 3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.hint{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.35}
/* ===================== Toasts, Modal, Level-Up ===================== */
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:9px;z-index:80;max-width:340px;pointer-events:none}
.toast{background:var(--panel2);padding:8px 11px;font-size:14px;line-height:1.3;display:flex;gap:8px;align-items:flex-start;animation:tin .32s steps(4);
  box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line),inset 4px 0 0 var(--yellow)}
.toast.good{box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line),inset 4px 0 0 var(--lime)}
.toast.bad{box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line),inset 4px 0 0 var(--red)}
.toast.out{animation:tout .3s steps(3) forwards}
@keyframes tin{from{transform:translateX(120%)}to{transform:none}}
@keyframes tout{to{transform:translateX(130%);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(8,9,18,.82);display:flex;align-items:center;justify-content:center;z-index:60;padding:10px}
.mbox{background:var(--panel);width:min(920px,97vw);max-height:95vh;overflow:auto;padding:14px 16px;
  box-shadow:0 -4px 0 var(--line),0 4px 0 var(--line),-4px 0 0 var(--line),4px 0 0 var(--line),inset 0 4px 0 rgba(255,255,255,.08)}
.mbox.small{width:min(520px,96vw)}
.hidden{display:none!important}
#lvlup{position:fixed;inset:0;z-index:90;pointer-events:none;display:flex;align-items:center;justify-content:center}
#lvlup canvas{width:min(640px,96vw);height:auto}
/* ===================== Forschungsbaum ===================== */
.treewrap{overflow:auto;padding:4px 4px 12px}
.tree{display:grid;grid-template-columns:repeat(7,minmax(158px,1fr));gap:18px;position:relative;min-width:1180px}
.tcol h4{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:14px;color:var(--cyan);text-align:center;padding:8px 2px;background:#14182a;margin-bottom:12px;box-shadow:0 0 0 3px var(--line);line-height:1.5}
.tnode{position:relative;z-index:1;background:#2b3046;padding:6px 7px;margin:0 2px 16px;font-size:13px;cursor:pointer;line-height:1.25;
  box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line)}
.tnode .tn{font-size:14px;color:#fff;display:flex;gap:5px;align-items:center}
.tnode .td{color:var(--muted);font-size:12px;margin-top:3px}
.tnode .tc{display:flex;justify-content:space-between;margin-top:4px;font-size:12px}
.tnode.done{background:#1d4a3a;box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line),inset 0 0 0 2px var(--green)}
.tnode.avail{background:#4b3d1c;animation:tpulse 1s steps(2) infinite}
.tnode.lock{opacity:.55;filter:grayscale(.6)}
@keyframes tpulse{50%{box-shadow:0 -3px 0 var(--yellow),0 3px 0 var(--yellow),-3px 0 0 var(--yellow),3px 0 0 var(--yellow)}}
#treecv{position:absolute;left:0;top:0;z-index:0;pointer-events:none;image-rendering:pixelated}
/* ===================== Drag Race ===================== */
#race,#roam{position:fixed;inset:0;background:#07080f;z-index:50;display:flex;flex-direction:column}
#race .rtop,#roam .rtop{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#14161f}
#racecv,#roamcv{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;background:#07080f}
.rctl{display:flex;justify-content:center;align-items:stretch;gap:8px;padding:8px;background:#14161f;flex-wrap:wrap;touch-action:none}
.rbtn{font-family:'Press Start 2P',monospace;font-size:11px;color:#fff;border:0;cursor:pointer;min-width:74px;padding:12px 10px;touch-action:none;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.4),inset 4px 4px 0 rgba(255,255,255,.25),0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000}
.rbtn.on{box-shadow:inset 4px 4px 0 rgba(0,0,0,.45),0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000;filter:brightness(1.3)}
.rbtn.gas{background:#38b764;min-width:120px;font-size:13px} .rbtn.clutch{background:#566c86;min-width:110px}
.rbtn.nos{background:#3b5dc9} .rbtn.shift{background:#ef7d57;min-width:58px;font-size:16px} .rbtn.stage{background:#b13e53}
.rbtn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
/* ===================== 3D-Showroom ===================== */
#show3d canvas{width:100%;height:auto;aspect-ratio:16/9;cursor:grab;touch-action:none;box-shadow:0 0 0 4px var(--line)}
/* ===================== Mobil ===================== */
@media (max-width:780px){
  #main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:4px solid var(--line);padding:6px}
  #nav button{flex:0 0 auto;font-size:13px;padding:6px 7px}
  #topbar .brand{display:none}
  .chip{font-size:13px;padding:2px 6px}
  #content{padding:8px 6px 40px}
  .tree{min-width:1100px}
  .rbtn{min-width:60px;padding:12px 6px;font-size:10px}
  .rbtn.gas{min-width:96px}
}
#login{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 8px),radial-gradient(ellipse at 50% 30%,#2b3260 0%,#1a1c2c 55%,#0d0f1a 100%)}
#login.hidden{display:none}
#title{position:fixed;inset:0;z-index:58;background:#05060c;overflow:hidden}
#title.hidden{display:none}
#ttl-cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.ttl-top{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:2;align-items:center}
.ttl-top>div{display:flex;gap:6px}
.ttl-chip{display:flex;align-items:center;gap:6px;background:var(--panel);padding:4px 8px;box-shadow:0 0 0 3px var(--line)}
.ttl-mid{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);z-index:2;text-align:center;width:min(560px,94vw);max-height:84vh;overflow:auto;padding:6px}
.ttl-play{font-family:inherit;font-size:38px;letter-spacing:4px;padding:12px 64px;color:#fff;background:#38b764;border:0;cursor:pointer;text-shadow:0 3px 0 #1e6a3a;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.25),0 0 0 4px #0d0f1a,0 8px 0 4px rgba(0,0,0,.45);animation:ttlp 1.6s ease-in-out infinite}
.ttl-play:hover{background:#45c873}
@keyframes ttlp{50%{transform:scale(1.06)}}
.ttl-sub{margin-top:12px;color:#f4f4f4;text-shadow:0 2px 0 #000;font-size:14px}
.ttl-panel{text-align:left;background:var(--panel);padding:12px 14px;box-shadow:0 0 0 4px var(--line),0 10px 0 4px rgba(0,0,0,.35);max-width:520px;margin:0 auto}
.ttl-foot{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#94b0c2;text-shadow:0 1px 0 #000;z-index:2}
#tour{position:fixed;inset:0;z-index:90}
.tour-dim{position:absolute;inset:0;background:rgba(5,6,12,.72)}
.tour-hole{position:absolute;box-shadow:0 0 0 9999px rgba(5,6,12,.72);outline:3px solid var(--yellow);animation:tourp 1.2s ease-in-out infinite;pointer-events:none}
@keyframes tourp{50%{outline-color:#fff}}
.tour-card{position:absolute;width:min(380px,90vw);background:var(--panel);padding:10px 12px;box-shadow:0 0 0 4px var(--yellow),0 10px 0 4px rgba(0,0,0,.4)}
.tour-card h3{margin:2px 0 4px;color:var(--yellow)}
.tour-card p{margin:0 0 8px;line-height:1.45}
.tour-step{font-size:11px;color:#94b0c2}

.lbox{width:100%;max-width:380px;background:var(--panel);padding:16px 18px 14px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.1),0 0 0 4px var(--line),0 10px 0 4px rgba(0,0,0,.35)}
.lbox input[type=text],.lbox input[type=password]{width:calc(100% - 8px)}
.lhead{display:flex;align-items:center;justify-content:center;gap:10px;font-size:30px;color:var(--yellow);text-shadow:3px 3px 0 var(--line)}
.lcar{display:block;margin:8px auto 2px;width:100%;max-width:300px;image-rendering:pixelated}
.lbox h3{text-align:center;margin:6px 0 2px}
.lmsg{background:#0d0f1a;padding:6px 8px;margin:8px 4px 0}
.lrem{display:flex;align-items:center;gap:6px;margin:10px 4px 6px;font-size:14px;cursor:pointer}
/* ===================== Vereinfachte Bedienung ===================== */
#nav button.nlock{background:#262b40;color:#7d8296}
#nav button.nlock .lv{margin-left:auto;font-size:10px;color:#7d8296;white-space:nowrap}
#nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 12px;padding-bottom:10px;border-bottom:3px solid var(--line)}
.subnav button{font-family:inherit;font-size:15px;display:flex;align-items:center;gap:6px;color:var(--text);background:var(--bg2);border:0;padding:6px 12px;cursor:pointer;box-shadow:0 0 0 3px var(--line)}
.subnav button:hover{background:var(--panel2)}
.subnav button.on{background:var(--yellow);color:var(--bg)}
.subnav button.lock{color:#7d8296;background:#20243a}
.subnav small{font-size:11px}
button.chip.menubtn{font-family:inherit;color:var(--text);border:0;cursor:pointer;background:var(--panel)}
button.chip.menubtn:hover{background:var(--panel2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 0 8px}
.mgrid .btn{text-align:left;display:flex;align-items:center;gap:6px}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,#2b3a5a,#333c57);padding:12px 14px;margin:4px 4px 14px;box-shadow:0 0 0 4px var(--line),inset 0 0 0 2px var(--yellow)}
.next .nl{display:flex;gap:10px;align-items:flex-start;flex:1 1 300px}
.next .nt{font-size:20px;color:var(--yellow);margin-top:2px}
.tl{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:0 4px 14px}
.tile{display:flex;align-items:center;gap:10px;background:var(--panel);padding:8px 10px;box-shadow:0 0 0 3px var(--line)}
.tile .tv{font-size:18px}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h3{margin-bottom:0}
details.fold>summary h3::after{content:'+';margin-left:auto;color:var(--muted)}
details.fold[open]>summary h3{margin-bottom:10px}
details.fold[open]>summary h3::after{content:'–'}
.tip{margin:3px 0}
img.face{image-rendering:pixelated;box-shadow:0 0 0 2px var(--line);background:#22263a;flex:0 0 auto}
.rquote{display:flex;align-items:center;gap:6px;font-size:12px;color:#c8ccd4;max-width:52%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.revbox #revcv{width:210px;height:28px;box-shadow:0 0 0 2px var(--line)}
.revtxt{font-size:20px;min-width:130px;font-variant-numeric:tabular-nums}
.revgas.on{filter:brightness(1.3);transform:translateY(1px)}
.revgas{touch-action:none;user-select:none}

<script>
'use strict';
/* =============================================================================
   AUTOTYCOON – Autofirma-Simulation mit Drag Racing im Pixel-Art-Stil
   Teil 1: Hilfsfunktionen, Farben, Pixel-Puffer, Bitmap-Schrift, Pixel-Icons
   ============================================================================= */

// ---------- Kurzhelfer ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** Geld formatieren, z. B. $ 12'500 oder $ 3.25 Mio */
function fmtMoney(v) {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e9) return s + '$' + (a / 1e9).toFixed(2) + ' Mrd';
  if (a >= 1e7) return s + '$' + (a / 1e6).toFixed(2) + ' Mio';
  return s + '$' + Math.round(a).toLocaleString('de-CH');
}
const fmtNum = (v, d = 0) => Number(v).toLocaleString('de-CH', { minimumFractionDigits: d, maximumFractionDigits: d });

/** Deterministisches Pixel-Rauschen (0..1) – für Metallic-Glitzer, Dithering usw. */
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

/** Zufallszahl mit Seed (für reproduzierbare Szenen) */
function seeded(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

// ---------- Farben ----------
function hex2rgb(h) {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgb2hex = c => '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
/** f < 0 abdunkeln, f > 0 aufhellen (-1..1) */
function shadeRGB(c, f) {
  if (f < 0) return [c[0] * (1 + f), c[1] * (1 + f), c[2] * (1 + f)];
  return [c[0] + (255 - c[0]) * f, c[1] + (255 - c[1]) * f, c[2] + (255 - c[2]) * f];
}
const mixRGB = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const shadeHex = (h, f) => rgb2hex(shadeRGB(hex2rgb(h), f));
const mixHex = (a, b, t) => rgb2hex(mixRGB(hex2rgb(a), hex2rgb(b), t).map(Math.round));
/** Farbe als 32-Bit-Zahl für ImageData (Little Endian: AABBGGRR) */
function C(r, g, b, a = 255) {
  return ((clamp(a | 0, 0, 255) << 24) | (clamp(b | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(r | 0, 0, 255)) >>> 0;
}
const Crgb = (c, a = 255) => C(Math.round(c[0]), Math.round(c[1]), Math.round(c[2]), a);
const Chex = (h, a = 255) => Crgb(hex2rgb(h), a);
const unC = c => [c & 255, (c >>> 8) & 255, (c >>> 16) & 255, c >>> 24];
/** Helligkeit 0..1 */
const luma = c => (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;

// ---------- Pixel-Puffer: alles wird pixelgenau ohne Anti-Aliasing gezeichnet ----------
/** Drosselung: true höchstens hz-mal pro Sekunde (für langsame Menü-Animationen) */
const _thr = {};
function every(key, hz) { const now = performance.now(); if (now - (_thr[key] || 0) < 1000 / hz - 2) return false; _thr[key] = now; return true; }
class PB {
  constructor(w, h) { this.w = w | 0; this.h = h | 0; this.d = new Uint32Array(this.w * this.h); }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  set(x, y, c) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[y * this.w + x] = c; }
  get(x, y) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0; return this.d[y * this.w + x]; }
  /** Farbe mit Deckkraft a (0..1) über bestehenden Pixel legen */
  blend(x, y, c, a) {
    x = Math.floor(x); y = Math.floor(y); if (!this.inb(x, y)) return;
    const i = y * this.w + x, o = this.d[i];
    const n = unC(c);
    if (!o) { this.d[i] = C(n[0], n[1], n[2], 255 * a); return; }
    const p = unC(o), oa = p[3] / 255, na = a + oa * (1 - a);
    this.d[i] = C((n[0] * a + p[0] * oa * (1 - a)) / na, (n[1] * a + p[1] * oa * (1 - a)) / na, (n[2] * a + p[2] * oa * (1 - a)) / na, na * 255);
  }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); }
  hline(x0, x1, y, c) { if (x1 < x0) [x0, x1] = [x1, x0]; for (let x = x0; x <= x1; x++) this.set(x, y, c); }
  vline(x, y0, y1, c) { if (y1 < y0) [y0, y1] = [y1, y0]; for (let y = y0; y <= y1; y++) this.set(x, y, c); }
  /** Bresenham-Linie */
  line(x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    for (let n = 0; n < 2000; n++) {
      this.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  }
  /** gefüllter Kreis (Mittelpunkt in Pixelkoordinaten, kann .5 sein) */
  disc(cx, cy, r, c) {
    const R = Math.ceil(r) + 1;
    for (let y = Math.floor(cy - R); y <= cy + R; y++) for (let x = Math.floor(cx - R); x <= cx + R; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r * r) this.set(x, y, c);
    }
  }
  /** Ring zwischen r0 und r1 */
  ring(cx, cy, r0, r1, c) {
    const R = Math.ceil(r1) + 1;
    for (let y = Math.floor(cy - R); y <= cy + R; y++) for (let x = Math.floor(cx - R); x <= cx + R; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = dx * dx + dy * dy;
      if (d <= r1 * r1 && d > r0 * r0) this.set(x, y, c);
    }
  }
  /** Anderen Puffer hineinkopieren (transparente Pixel überspringen) */
  blit(src, ox, oy, flip = false) {
    for (let y = 0; y < src.h; y++) for (let x = 0; x < src.w; x++) {
      const c = src.d[y * src.w + (flip ? src.w - 1 - x : x)];
      if (!c) continue;
      const a = (c >>> 24) / 255;
      if (a >= 0.99) this.set(ox + x, oy + y, c); else this.blend(ox + x, oy + y, c | 0xff000000, a);
    }
  }
  /** In ein Canvas umwandeln */
  canvas() {
    const cv = document.createElement('canvas'); cv.width = this.w; cv.height = this.h;
    const ctx = cv.getContext('2d'); const id = ctx.createImageData(this.w, this.h);
    new Uint32Array(id.data.buffer).set(this.d); ctx.putImageData(id, 0, 0);
    return cv;
  }
}

/** Canvas mit niedriger Auflösung erstellen (wird per CSS pixelig hochskaliert) */
function lowCanvas(w, h, cls = 'cv') {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.className = cls;
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  return cv;
}

// ---------- 3x5 Bitmap-Pixelschrift ----------
const FONT = (() => {
  const g = {
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
    '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
    'A': '010101111101101', 'B': '110101110101110', 'C': '011100100100011', 'D': '110101101101110', 'E': '111100110100111',
    'F': '111100110100100', 'G': '011100101101011', 'H': '101101111101101', 'I': '111010010010111', 'J': '001001001101010',
    'K': '101101110101101', 'L': '100100100100111', 'M': '101111111101101', 'N': '110101101101101', 'O': '010101101101010',
    'P': '110101110100100', 'Q': '010101101110011', 'R': '110101110101101', 'S': '011100010001110', 'T': '111010010010010',
    'U': '101101101101111', 'V': '101101101101010', 'W': '101101111111101', 'X': '101101010101101', 'Y': '101101010010010',
    'Z': '111001010100111', '.': '000000000000010', ':': '000010000010000', '-': '000000111000000', '+': '000010111010000',
    '/': '001001010100100', '%': '101001010100101', '!': '010010010000010', '?': '111001010000010', ' ': '000000000000000',
    '#': '101111101111101', ',': '000000000010100', "'": '010010000000000', '$': '011110010011110', '(': '010100100100010',
    ')': '010001001001010', '=': '000111000111000', '>': '100010001010100', '<': '001010100010001', '*': '000101010101000',
    '"': '101101000000000', '_': '000000000000111'
  };
  const map = { 'Ä': 'A', 'Ö': 'O', 'Ü': 'U', 'É': 'E', 'È': 'E', 'À': 'A' };
  return { g, map };
})();
const glyph = ch => { ch = ch.toUpperCase(); ch = FONT.map[ch] || ch; return FONT.g[ch] || FONT.g['?']; };
const textW = (s, sc = 1) => Math.max(0, String(s).length * 4 * sc - sc);
/** Text in Pixel-Puffer schreiben */
function pbText(pb, s, x, y, c, sc = 1) {
  s = String(s);
  for (let i = 0; i < s.length; i++) {
    const gl = glyph(s[i]);
    for (let j = 0; j < 15; j++) if (gl[j] === '1') pb.rect(x + (i * 4 + (j % 3)) * sc, y + Math.floor(j / 3) * sc, sc, sc, c);
  }
}
/** Text auf 2D-Canvas (fillRect = gestochen scharf), align: 'l' | 'c' | 'r' */
function cxText(ctx, s, x, y, color, sc = 1, align = 'l', shadow = null) {
  const k = ctx.getTransform ? ctx.getTransform().a : 1;
  if (k >= 2) return cxTextHD(ctx, s, x, y, color, sc, align, shadow, k);   // feine 5x7-Schrift
  s = String(s);
  const w = textW(s, sc);
  if (align === 'c') x -= Math.floor(w / 2); else if (align === 'r') x -= w;
  x = Math.round(x); y = Math.round(y);
  if (shadow) cxText(ctx, s, x + sc, y + sc, shadow, sc, 'l', null);
  ctx.fillStyle = color;
  for (let i = 0; i < s.length; i++) {
    const gl = glyph(s[i]);
    for (let j = 0; j < 15; j++) if (gl[j] === '1') ctx.fillRect(x + (i * 4 + (j % 3)) * sc, y + Math.floor(j / 3) * sc, sc, sc);
  }
}

function glyphHD(ch) { ch = ch.toUpperCase(); ch = FONT.map[ch] || ch; return FONT_HD[ch] || FONT_HD['?']; }
/** Text in HD-Auflösung: p = Gerätepixel pro Glyphenpixel */
function cxTextHD(ctx, s, x, y, color, sc, align, shadow, k) {
  s = String(s);
  const p = Math.max(1, Math.round(sc * k / 2)), M = ctx.getTransform();
  const w = (s.length * 6 - 1) * p / k, h = 7 * p / k;
  if (align === 'c') x -= w / 2; else if (align === 'r') x -= w;
  y += (5 * sc - h) / 2;
  const X0 = Math.round(M.a * x + M.e), Y0 = Math.round(M.d * y + M.f);
  const key = s + '\u0001' + color + '\u0001' + (shadow || '') + '\u0001' + p;
  let c = _txtCache.get(key);
  if (!c) {                                             // einmal rendern, danach nur noch kopieren (schnell)
    c = document.createElement('canvas'); c.width = Math.max(1, s.length * 6 * p + p); c.height = 8 * p;
    const g = c.getContext('2d');
    const draw = (ox, oy, col) => {
      g.fillStyle = col;
      for (let i = 0; i < s.length; i++) { const gl = glyphHD(s[i]); for (let r = 0; r < 7; r++) { const row = gl[r]; if (!row) continue; for (let b = 0; b < 5; b++) if (row & (16 >> b)) g.fillRect(ox + (i * 6 + b) * p, oy + r * p, p, p); } }
    };
    if (shadow) draw(p, p, shadow);
    draw(0, 0, color);
    if (_txtCache.size > 900) _txtCache.clear();
    _txtCache.set(key, c);
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(c, X0, Y0); ctx.restore();
}
const _txtCache = new Map();
/** Canvas auf doppelte Auflösung umstellen; liefert Kontext mit Zeichnen in logischen Pixeln */
function hdCtx(cv, f = 2) {
  if (!cv._hd) { cv._lw = cv.width; cv._lh = cv.height; cv.width = cv._lw * f; cv.height = cv._lh * f; cv._hd = f; }
  const ctx = cv.getContext('2d'); ctx.setTransform(cv._hd, 0, 0, cv._hd, 0, 0); ctx.imageSmoothingEnabled = false;
  return ctx;
}

/** Icon als Data-URL (8x8, wird per CSS pixelig vergrössert) */
function iconURL(name) {
  if (_iconCache[name]) return _iconCache[name];
  const rows = ICONS[name] || ICONS.star;
  const cv = document.createElement('canvas'); cv.width = 8; cv.height = 8;
  const ctx = cv.getContext('2d');
  rows.forEach((row, y) => { for (let x = 0; x < 8; x++) { const ch = row[x]; if (ch && ch !== '.' && ICON_PAL[ch]) { ctx.fillStyle = ICON_PAL[ch]; ctx.fillRect(x, y, 1, 1); } } });
  return (_iconCache[name] = cv.toDataURL());
}
const ico = (n, cls = '') => `<img class="ico ${cls}" src="${iconURL(n)}" alt="">`;

/** Pixel-Balken als HTML */
function barHTML(v, max, color = 'var(--lime)') {
  const p = clamp(v / max, 0, 1) * 100;
  return `<div class="bar"><i style="width:${p.toFixed(1)}%;background:repeating-linear-gradient(90deg,${color} 0 5px,rgba(0,0,0,.25) 5px 6px)"></i></div>`;
}

/** Poisson-Zufallszahl (für Verkäufe pro Tag) */
function poisson(l) {
  if (l <= 0) return 0;
  if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * (Math.random() + Math.random() + Math.random() - 1.5) * 2));
  const L = Math.exp(-l); let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L && k < 200);
  return k - 1;
}

/** Datum aus Spieltag (Start: 1. Januar 2026) */
function dayToDate(day) {
  const d = new Date(2026, 0, 1); d.setDate(d.getDate() + Math.floor(day));
  return d;
}
const fmtDate = day => { const d = dayToDate(day); return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear(); };

  // Gewicht

  if (isEV) weight += disp * 5.2 + (e.motors - 1) * 35;         // Batterie + Motoren
  // Drehzahl
  const red = Math.round(isEV ? T.red : (T.red + ind.red) * mat.red);
  const idle = isEV ? 0 : 900;
  const u0 = isEV ? 0.33 : isHy ? 0.4 : ind.u0;
  // Normierte Drehmomentkurve f(u), u = rpm/red
  const f = isEV ? (u => u < u0 ? 1 : u0 / u) : (u => Math.max(0.25, 1 - 1.15 * Math.pow(u - u0, 2) / Math.pow(Math.max(u0, 1 - u0), 2) * 0.55));
  let best = 0, bestU = 0.8;
  for (let u = 0.1; u <= 1.0001; u += 0.01) { const p = f(u) * u; if (p > best) { best = p; bestU = u; } }
  const redRad = red * Math.PI / 30;
  const pW = ps * 735.5;
  const tqPeak = pW / (best * redRad);                     // Nm im Maximum
  const torque = rpm => tqPeak * f(clamp(rpm / red, 0.05, 1.05));
  // Getriebe
  const ratioSet = RATIOS[e.ratio] || RATIOS.normal;
  let ratios, final;
  const gears = isEV ? 1 : clamp(e.gears | 0, 4, 8);
  if (isEV) { ratios = [1]; final = ratioSet.ev; }
  else {
    final = ratioSet.final;
    const g1 = 3.45, gn = gears >= 7 ? 0.64 : gears >= 6 ? 0.7 : 0.78;
    ratios = []; for (let i = 0; i < gears; i++) ratios.push(g1 * Math.pow(gn / g1, i / (gears - 1)));
  }
  const shiftTime = (has('tun_dct') ? 0.08 : 0.24 - gears * 0.008) * (e.shiftMul || 1);
  // Verbrauch (l/100 km bzw. kWh/100 km bei 1300 kg)
  let cons = isEV ? 13 + ps * 0.009 : (2.2 + disp * 1.9 * ind.cons + ps * 0.004) * (isHy ? 0.55 : 1);
  // Zuverlässigkeit
  let rel = T.rel - ind.rel + mat.rel - exh.rel - nos.rel - Math.max(0, ps / Math.max(1, disp) - 120) * (isEV ? 0 : 0.05) + bonus('rel');
  rel = clamp(Math.round(rel), 20, 99);
  // Kosten
  let cost = (T.cost + disp * T.cpl) * (isEV ? 1 : mat.cm) + ind.cost + exh.cost + nos.cost + (isEV ? (e.motors - 1) * 3500 : gears * 250);
  if (isHy) cost += 2500;
  const key = engKey(e);
  return {
    key, ps, nm: Math.round(tqPeak), red, idle, weight: Math.round(weight), cons, rel, cost: Math.round(cost), torque, peakU: bestU,
    isEV, gears, ratios, final, shiftTime, nos: nos.mul ? { mul: nos.mul, dur: nos.dur } : null, type: e.type, cyl: T.cyl, disp,
    ind: isEV ? 'none' : (INDUCTIONS[e.ind] ? e.ind : 'none'), indMul: ind.mul
  };
}

// ---------- Autowerte ----------
/** Berechnet sämtliche Werte eines Autodesigns (inkl. simulierter Fahrleistungen) */
function computeCar(d, engOverride) {
  const B = BODIES[d.body] || BODIES.hatch3;
  const eDef = engOverride || getEngine(d.engineId);
  const E = computeEngine(eDef);
  const I = Object.assign(defaultInterior(), d.interior || {});
  const tier = INT_TIERS[I.tier] || INT_TIERS.basic, seat = SEATS[I.seats] || SEATS.cloth, steer = STEER[I.steer] || STEER.standard, dash = DASHES[I.dash] || DASHES.analog;
  const sp = SPOILERS[d.spoiler] || SPOILERS.none, lip = LIPS[d.lip] || LIPS.none, sk = SKIRTS[d.skirts] || SKIRTS.none, df = DIFFUSERS[d.diffuser] || DIFFUSERS.none;
  const rim = RIMS[d.rim] || RIMS.steel, tire = TIRES[clamp(d.tire | 0, 0, 6)], paint = PAINTS[d.paint] || PAINTS.gloss;
  const cage = I.cage && has('int_rollcage');
  // Gewicht
  const bodyW = B.w * (1 + bonus('wMul'));
  const kit = KITS[d.kit] || KITS.none, glow = d.glow && d.glow !== 'none';
  const weight = Math.round((bodyW + E.weight + tier.w + seat.w + dash.w + sp.w + lip.w + sk.w + df.w + kit.w + (rim.w + tire.w) * 4 + (cage ? 28 : 0) + (I.ambient !== 'none' ? 2 : 0) + (glow ? 3 : 0)) * (d.wAdj || 1));
  // Aerodynamik
  const cd = Math.max(0.2, (B.cd + sp.cd + lip.cd + sk.cd + df.cd + d.ride * 0.003) * (1 + bonus('cdMul')));
  const cl = sp.df + lip.df + df.df + kit.df;
  // Grip
  const grip = 0.92 + tire.grip + bonus('grip') + (-d.ride) * 0.006 + cl * 0.15 + (d.gripAdj || 0);
  // Antrieb & Gewichtsverteilung (statisch angetriebener Anteil)
  const drive = E.isEV && B.cls !== 'small' && B.cls !== 'family' ? 'AWD' : B.drive;
  const wd = drive === 'AWD' ? 1 : drive === 'FWD' ? 0.62 : (B.eng === 'rear' ? 0.62 : B.eng === 'mid' ? 0.58 : 0.48);
  // Komfort, Sicherheit, Zuverlässigkeit
  const exh = E.isEV ? EXHAUSTS.stock : (EXHAUSTS[eDef.exh] || EXHAUSTS.stock);
  const comfort = clamp(Math.round(B.comfort + tier.comfort + seat.comfort + steer.comfort + dash.comfort + tire.comfort + d.ride * 2 + exh.comfort
    - (cage ? 10 : 0) + (I.ambient !== 'none' ? 3 : 0) + (E.isEV ? 4 : 0)), 0, 100);
  const safety = clamp(Math.round(B.safety + bonus('safety') + (cage ? 8 : 0) + (weight - 1200) * 0.01), 0, 100);
  const qc = S ? S.factory.qc : 0;
  const rel = clamp(Math.round(E.rel * 0.85 + 8 + qc * 3), 0, 100);
  const style = clamp(Math.round(B.style + paint.style + rim.style + sp.style + (STICKERS[d.sticker] || STICKERS.none).style + (d.stripe !== 'none' ? 3 : 0) + kit.style + (glow ? 6 : 0) + (d.banner ? 2 : 0)
    + (lip.df ? 2 : 0) + (sk.w ? 2 : 0) + (-d.ride) * 1.5 + tire.inch * 0.3 - 4), 0, 100);
  const cons = E.cons * Math.pow(weight / 1300, 0.5) * (1 + (cd - 0.3));
  // Produktionskosten
  const costMul = 1 + bonus('costMul') + modSum('cost');
  const partsCost = sp.cost + lip.cost + sk.cost + df.cost + (rim.cost + tire.cost) * 4 + paint.cost + tier.cost + seat.cost + steer.cost + dash.cost
    + (cage ? 2500 : 0) + (I.ambient !== 'none' ? 400 : 0) + (d.stripe !== 'none' ? 250 : 0) + (d.sticker !== 'none' ? 150 : 0) + kit.cost + (glow ? 600 : 0) + (d.banner ? 80 : 0);
  const prodCost = Math.round((B.cost + E.cost + partsCost) * costMul);
  const car = {
    B, E, weight, mass: weight + 75, ps: E.ps, nm: E.nm, cd, area: B.area, cl, grip, drive, wd, comfort, safety, rel, style, cons,
    prac: B.prac, prodCost, cls: B.cls, isEV: E.isEV, interior: I, nos: E.nos
  };
  // Fahrleistungen simulieren
  const perf = simulateRun(car);
  Object.assign(car, perf);
  car.top = topSpeed(car);
  // Kundengruppen-Bewertung
  car.engKey = engKey(eDef);
  car.score = scoreCar(car, d);
  const q = Math.max(car.score.family, car.score.sport, car.score.hyper) / 100;
  car.value = Math.round(prodCost * (1.08 + 0.45 * q) + (B.cls === 'hyper' ? prodCost * 0.4 : B.cls === 'super' ? prodCost * 0.2 : 0));
  return car;
}

/** Punkte je Kundengruppe (0..100) */
function scoreCar(c, d) {
  const econ = c.isEV ? clamp(100 - (c.cons - 12) * 3.5, 0, 100) : clamp(100 - (c.cons - 4) * 9, 0, 100);
  const fuelW = 0.25 * (1 + modSum('fuel'));
  const tier = c.interior.tier;
  const fam = (0.3 * c.safety + fuelW * econ + 0.2 * c.comfort + 0.15 * c.rel + 0.12 * c.prac) / (0.77 + fuelW) * 1.05
    + (tier === 'luxus' ? 6 : tier === 'komfort' ? 3 : tier === 'race' ? -12 : 0) - Math.max(0, c.ps - 350) * 0.03;
  const power = clamp(c.ps / 6, 0, 100), accel = clamp((14 - c.t100) / 10.5 * 100, 0, 100), spd = clamp((c.top - 150) / 200 * 100, 0, 100);
  const handling = clamp((c.grip - 0.85) * 220, 0, 100);
  const sport = 0.28 * power + 0.25 * accel + 0.2 * spd + 0.17 * c.style + 0.1 * handling + (tier === 'race' ? 7 : 0) + (c.nos ? 3 : 0);
  const excl = { small: 0, family: 0, suv: 10, sport: 25, super: 65, hyper: 100 }[c.cls];
  const hpow = clamp(c.ps / 15, 0, 100), hacc = clamp((4.2 - c.t100) / 2.2 * 100, 0, 100), hspd = clamp((c.top - 280) / 150 * 100, 0, 100);
  const hyper = 0.27 * hpow + 0.22 * hacc + 0.13 * hspd + 0.15 * c.style + 0.18 * excl + 0.05 * c.comfort + (tier === 'luxus' ? 5 : 0);
  return { family: clamp(Math.round(fam), 0, 100), sport: clamp(Math.round(sport), 0, 100), hyper: clamp(Math.round(hyper), 0, 100) };
}

// ---------- Fahrphysik (für Simulation, KI und Drag Race) ----------
class Vehicle {
  constructor(car) { this.c = car; this.reset(); }
  reset() {
    const c = this.c;
    this.v = 0; this.x = 0; this.t = 0; this.gear = 1; this.rpm = c.E.isEV ? 0 : c.E.idle; this.shiftT = 0; this.slip = 0;
    this.nosT = 0; this.nosUsed = false; this.bonusT = 0; this.launched = false; this.locked = false; this.acc = 0;
    this.heat = 0.35; this.limiterT = 0; this.wheelAng = 0; this.spin = 0; this.lastShift = ''; this.boost = 0;
  }
  get ratio() { return this.c.E.ratios[this.gear - 1] * this.c.E.final; }
  rpmFromV() { return this.v / RW * this.ratio * 30 / Math.PI; }
  /** NOS zünden */
  fireNos() { if (this.c.nos && !this.nosUsed) { this.nosUsed = true; this.nosT = this.c.nos.dur; return true; } return false; }
  /** Hochschalten – liefert Bewertung 'perfect' | 'good' | 'early' | 'late' */
  shiftUp() {
    const E = this.c.E;
    if (this.gear >= E.ratios.length || this.shiftT > 0) return null;
    const u = this.rpm / E.red;
    let q = 'good';
    if (this.limiterT > 0.12) q = 'late';
    else if (u >= 0.86 && u <= 0.985) q = 'perfect';
    else if (u < 0.72) q = 'early';
    this.gear++; this.shiftT = E.shiftTime * (q === 'perfect' ? 0.6 : q === 'late' ? 1.6 : 1);
    this.boost *= 0.8;                                             // Schubumluftventil: etwas Ladedruck geht beim Schalten verloren
    if (q === 'perfect') this.bonusT = 1.2;
    this.limiterT = 0; this.lastShift = q;
    return q;
  }
  shiftDown() { if (this.gear > 1 && this.shiftT <= 0) { this.gear--; this.shiftT = this.c.E.shiftTime; return true; } return false; }
  /** Ein Physikschritt. inp = { thr: 0..1, clutch: bool, burnout: bool } */
  step(dt, inp) {
    const c = this.c, E = c.E, g = 9.81, m = c.mass;
    const thr = clamp(inp.thr || 0, 0, 1);
    this.t += dt;
    if (this.nosT > 0) this.nosT -= dt;
    if (this.bonusT > 0) this.bonusT -= dt;
    const nosMul = this.nosT > 0 ? 1 + c.nos.mul : 1;
    const turbo = E.ind === 'turbo' || E.ind === 'twin';
    const spool = (bt, up) => { this.boost += (bt - this.boost) * clamp(dt * (bt > this.boost ? up : 4), 0, 1); };
    const bonusMul = this.bonusT > 0 ? 1.06 : 1;
    let Fdrive = 0;
    const rpmV = this.rpmFromV();
    const engaged = this.launched && !inp.clutch;
    if (!engaged || this.shiftT > 0) {
      // Kupplung getreten bzw. Schaltvorgang: Motor dreht frei
      if (this.shiftT > 0) {
        this.shiftT -= dt;
        this.rpm = lerp(this.rpm, Math.max(E.idle, rpmV), clamp(dt * 14, 0, 1));
      } else {
        const target = E.isEV ? 0 : E.idle + thr * (E.red - E.idle);
        this.rpm = lerp(this.rpm, target, clamp(dt * (target > this.rpm ? 2.2 : 2.6), 0, 1));   // langsam genug zum Dosieren
        if (this.rpm >= E.red * 0.995 && thr > 0.5) this.rpm = E.red * (0.96 + Math.random() * 0.03); // Begrenzer
      }
      // Turbo an der Linie vorspannen (Two-Step): hohe Drehzahl mit getretener Kupplung baut Teil-Ladedruck auf
      if (turbo) spool(this.shiftT > 0 ? this.boost : (thr > 0.5 && this.rpm / E.red > 0.45 ? 0.55 : 0), 1.5);
      this.slip = inp.burnout && thr > 0.3 ? 1 : Math.max(0, this.slip - dt * 3);
      if (inp.burnout && thr > 0.3) { this.heat = Math.min(1.1, this.heat + dt * 0.22 * thr * (has('tun_radials') ? 1.4 : 1)); this.spin = this.rpm; }
    } else {
      // Kupplung greift
      let eRpm = this.rpm, slipClutch = false;
      if (this.gear === 1 && eRpm > rpmV + 80 && !this.locked && !E.isEV) {
        slipClutch = true;
        eRpm = Math.max(rpmV, E.idle * 0.95, eRpm - dt * (1800 + 9000 * (1 - thr)));
        if (eRpm - rpmV < 120) this.locked = true;
      } else { this.locked = true; eRpm = Math.max(rpmV, E.isEV ? 0 : E.idle * 0.95); }
      if (eRpm >= E.red) { this.limiterT += dt; eRpm = E.red; } else this.limiterT = 0;
      this.rpm = eRpm;
      // Ladedruck baut sich mit Last und Drehzahl verzögert auf (Turboloch); ohne Druck nur Saugerleistung
      if (turbo) spool(thr * clamp((eRpm / E.red - 0.25) / 0.35, 0, 1), E.ind === 'twin' ? 3.2 : 2.2);
      const boostMul = turbo ? 1 / E.indMul + (1 - 1 / E.indMul) * this.boost : 1;
      let tq = E.torque(eRpm) * thr * nosMul * bonusMul * boostMul;
      if (this.limiterT > 0) tq *= 0.15;                            // Begrenzer schneidet Leistung
      if (slipClutch) tq *= 1 + clamp((eRpm - rpmV) / E.red, 0, 1) * 0.5;  // Schwungmasse beim Start
      Fdrive = tq * this.ratio * (c.drive === 'AWD' ? 0.84 : c.drive === 'FWD' ? 0.9 : 0.88) / RW;   // Antriebsverluste je Antriebsart
    }
    // Traktion
    const transfer = clamp(this.acc / g, 0, 2) * 0.28;
    const wd = c.drive === 'AWD' ? 1 : c.drive === 'FWD' ? clamp(c.wd - transfer, 0.3, 1) : clamp(c.wd + transfer, 0, 0.95);
    const down = 0.5 * 1.2 * c.cl * c.area * this.v * this.v;
    const heatF = this.heat < 0.85 ? 0.82 + 0.25 * this.heat : 1.03 - (this.heat - 0.85) * 0.4;
    const Fmax = c.grip * heatF * (m * g + down) * wd;
    let F = Fdrive;
    if (Fdrive > Fmax) {
      this.slip = clamp((Fdrive - Fmax) / Fmax, 0.15, 1); F = Fmax * (0.97 - 0.17 * this.slip);   // durchdrehende Reifen haften schlechter
      this.heat = Math.min(1.1, this.heat + dt * 0.25 * this.slip);
      if (this.locked) this.rpm = Math.min(E.red, this.rpm + dt * 2500 * this.slip);
    } else this.slip = Math.max(0, this.slip - dt * 4);
    this.heat = Math.max(0.2, this.heat - dt * 0.012);
    const Faero = 0.5 * 1.2 * c.cd * c.area * this.v * this.v;
    const Froll = 0.013 * m * g * (this.v > 0.1 ? 1 : 0);
    const mEff = m * (1.03 + (this.launched && !inp.clutch ? 0.0012 * this.ratio * this.ratio : 0));   // drehende Massen: in kleinen Gängen träger
    const a = this.launched ? (F - Faero - Froll) / mEff : 0;
    this.acc = a;
    this.v = Math.max(0, this.v + a * dt);
    this.x += this.v * dt;
    this.wheelAng += (this.v / RW + (this.slip > 0.1 ? this.slip * 40 : 0) + (!this.launched && inp.burnout && thr > 0.3 ? 45 : 0)) * dt;
  }
}

/** Automatische Fahrt (perfekter Fahrer) für 0–100, 1/8 und 1/4 Meile */
const _simCache = new Map();
/** Rennsimulation (teuer) – Ergebnis pro Fahrzeug-Kennwerten zwischenspeichern */
function simulateRun(car, launchU, opt = {}) {
  const E = car.E, key = [car.ps, car.nm, car.weight, car.mass, car.cd, car.area, car.cl, car.grip, car.drive, car.wd, E.red, E.idle, E.peakU, E.type, E.disp, E.ratios.join(','), E.final, E.shiftTime, E.ind, car.nos ? car.nos.mul + ':' + car.nos.dur : 0,
    launchU, opt.heat, opt.nos, has('tun_radials') ? 1 : 0].join('|');
  const hit = _simCache.get(key); if (hit) return hit;
  const res = simulateRunRaw(car, launchU, opt);
  if (_simCache.size > 600) _simCache.delete(_simCache.keys().next().value);
  _simCache.set(key, res);
  return res;
}
function simulateRunRaw(car, launchU, opt = {}) {
  const E = car.E;
  const tries = launchU != null ? [launchU] : E.isEV ? [0] : [0.3, 0.42, 0.55, 0.7];
  let best = null;
  for (const lu of tries) {
    const v = new Vehicle(car); v.heat = opt.heat != null ? opt.heat : 0.8; v.boost = E.ind === 'turbo' || E.ind === 'twin' ? 0.55 : 0;
    v.rpm = E.isEV ? 0 : E.idle + lu * (E.red - E.idle); v.launched = true;
    let t100 = 0, t18 = 0, t14 = 0, trap18 = 0, trap14 = 0;
    const dt = 1 / 120;
    for (let i = 0; i < 120 * 45; i++) {
      if (opt.nos && v.t > 0.3) v.fireNos();
      v.step(dt, { thr: v.slip > 0.3 ? 0.8 : 1, clutch: false });            // guter Fahrer: Gas leicht lupfen, wenn die Reifen durchdrehen
      if (!E.isEV && v.rpm >= E.red * 0.95 && v.shiftT <= 0 && v.gear < E.ratios.length) v.shiftUp();
      if (!t100 && v.v >= 27.78) t100 = v.t;
      if (!t18 && v.x >= 201.17) { t18 = v.t; trap18 = v.v * 3.6; }
      if (!t14 && v.x >= 402.34) { t14 = v.t; trap14 = v.v * 3.6; }
      if (t14 && t100) break;
    }
    const r = { t100: t100 || 45, t18: t18 || 45, t14: t14 || 45, trap18, trap14, launchU: lu };
    if (!best || r.t14 < best.t14) best = r;
  }
  return best;
}

/** Höchstgeschwindigkeit: grösstes v, bei dem Antriebskraft ≥ Widerstand */
function topSpeed(car) {
  const E = car.E, m = car.mass;
  let top = 0;
  for (let kmh = 20; kmh <= 520; kmh += 1) {
    const v = kmh / 3.6;
    let fAvail = 0;
    for (const r of E.ratios) {
      const rpm = v / RW * r * E.final * 30 / Math.PI;
      if (rpm > E.red) continue;
      fAvail = Math.max(fAvail, E.torque(Math.max(rpm, E.idle)) * r * E.final * 0.88 / RW);
    }
    const fRes = 0.5 * 1.2 * car.cd * car.area * v * v + 0.013 * m * 9.81 + 0.5 * 1.2 * car.cl * car.area * v * v * 0.08;
    if (fAvail >= fRes) top = kmh; else if (top) break;
  }
  return top;
}

/** Werte eines gespeicherten Modells (gecacht, solange sich Forschung/QK nicht ändern) */
const _carCache = new Map();
function carOf(m) {
  const eng = getEngine(m.engineId);
  const key = JSON.stringify([m, eng, S.techs.length, S.factory.qc, S.mods.filter(x => x.until > S.day && (x.cost || x.fuel)).length]);
  let c = _carCache.get(m.id);
  if (c && c.key === key) return c.car;
  const car = computeCar(m);
  _carCache.set(m.id, { key, car });
  return car;
}

// ---------- XP / Level ----------
const xpNeed = l => Math.round(80 * Math.pow(l, 1.5));
const rpGain = l => 2 + Math.floor(l / 5);
function addXP(n) {
  if (!S || n <= 0) return;
  if (S.boost && S.boost.xpUntil > S.day) n *= 2;
  n *= prestigeMul();          // Shop-Booster: doppelte XP
  S.xp += Math.round(n);
  let ups = 0;
  while (S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; const g = rpGain(S.level); S.rp += g; ups += g; }
  if (ups) { showLevelUp(S.level, ups); checkAchievements(); unlockNotice(); }
}
function addRep(n) {
  if (n > 0) n *= (1 + bonus('repGain')) * Math.max(0.12, 1 - S.rep / 100 * 0.88);   // je höher der Ruf, desto schwerer wird es
  S.rep = clamp(S.rep + n, 0, 100);
}
/* =============================================================================
   Teil 4: Pixel-Auto-Renderer (Seitenansicht, Front zeigt nach rechts)
   Jedes Pixel wird einzeln berechnet: Karosserie mit Schattierung, Glanzlicht,
   Lackart, Streifen, Fenster mit Spiegelung, Türfugen, Lichter, Felgen, Fahrwerk.
   ============================================================================= */
const M_BODY = 1, M_GLASS = 2, M_WHEEL = 3, M_LIGHT = 4, M_AERO = 5, M_TRIM = 6, M_WELL = 7;
const SHADE = [-0.66, -0.46, -0.24, 0, 0.2, 0.5];      // Schattierungsstufen L0..L5
const RIM_FRAC = [0.54, 0.58, 0.62, 0.66, 0.69, 0.72, 0.75]; // Felgenanteil je Reifengrösse
const GLASS_TINT = [['#8fb4cc', '#4c6f8a'], ['#6a8aa4', '#2c4258'], ['#4a6680', '#1e2e40'], ['#33465a', '#141c28'], ['#1f2a38', '#0b0f16']];

/** Profilpunkte in ein Höhen-Array pro Pixelspalte umwandeln (linear + leicht geglättet) */
function profileArr(points, L, sharp) {
  const a = new Float32Array(L);
  for (let x = 0; x < L; x++) {
    const px = x + 0.5;
    let i = 0;
    while (i < points.length - 2 && points[i + 1][0] < px) i++;
    const p0 = points[i], p1 = points[i + 1];
    const t = p1[0] === p0[0] ? 1 : clamp((px - p0[0]) / (p1[0] - p0[0]), 0, 1);
    a[x] = lerp(p0[1], p1[1], t);
  }
  if (sharp) return a;
  const b = a.slice();
  for (let x = 1; x < L - 1; x++) a[x] = (b[x - 1] + 2 * b[x] + b[x + 1]) / 4;

    if (mAt(tx, tk) === M_BODY && mAt(tx + ts, tk + ts) === M_BODY && !d.wear) for (let a = 0; a <= ts; a++) for (let b = 0; b <= ts; b++) { if (a === 0 || b === 0) shadePx(tx + a, tk + b, -0.3); else if (a === ts || b === ts) shadePx(tx + a, tk + b, 0.15); } }
  // Dachreling bei Kombi, Van und SUVs
  if (['wagon', 'mpv', 'suv', 'offroad'].includes(d.body)) {
    const r0 = B.glass[0] + 3 * Q, r1 = B.glass[1] - 9 * Q;
    for (let x = r0; x <= r1; x++) { const k = Math.floor(top[x] - 0.5) + 1 + Q; for (let t = 0; t < Q; t++) put(x, k + t, Chex(x === r0 || x === r1 || t === Q - 1 && Q > 1 ? '#1a1b22' : '#4a4c58'), M_AERO); if (x - r0 < Q || r1 - x < Q || (x - r0) % (12 * Q) < Q) for (let t = 1; t < Q + 1; t++) put(x, k - t, Chex('#1a1b22'), M_AERO); }
  }
  // Haifischflossen-Antenne auf dem Dach (nicht bei offenen Autos / Supersportlern)

    const axx = Math.round(B.glass[0] + (B.glass[1] - B.glass[0]) * 0.22), k = Math.floor(top[axx] - 0.5) + 1;
    for (let a = 0; a < 2 * Q + 1; a++) for (let b = 0; b < Q + 1; b++) if (b <= a / 2) put(axx + a, k + b, Chex(b ? '#2a2b33' : '#1a1b22'), M_AERO);
  }
  // ---------- 5c) Street-Style: Kotflügelverbreiterung, Canards, Scheibenbanner ----------
  if (d.kit === 'wide' || d.kit === 'race') {
    for (const w of wheels) for (let a = Math.PI * 0.04; a < Math.PI * 0.96; a += 0.03 / Q) for (let rr = ra + 0.1 * Q; rr < ra + 2.4 * Q; rr += 0.4) {
      const x = Math.floor(w.x + Math.cos(a) * rr), k = Math.floor(archY + Math.sin(a) * rr);

      if (rr > ra + 0.9 * Q && rr < ra + 1.6 * Q && Math.round(a * 30) % 7 === 0) pb.d[sy * W + sx] = Chex('#e0e4ec');          // Nieten
    }
    if (d.kit === 'race') {
      const kc = Math.floor(lerp(bot[L - 3], beltY, 0.3));                                              // Canards vorne
      for (let i = 0; i < 4 * Q; i++) { put(L - 2 * Q + i, kc + Math.floor(i / 2), Chex('#22232a'), M_AERO); put(L - 3 * Q + i, kc + 3 * Q + Math.floor(i / 2), Chex('#22232a'), M_AERO); }
    }
  }
  if (d.banner && !B.open) {
    const c2b = Crgb(shadeRGB(c2, -0.1)), wsx = g1 - Math.round((g1 - g0) * 0.32);
    for (let x = wsx; x <= g1; x++) for (let k = Math.floor(top[x]) - 3 * Q; k <= Math.ceil(top[x]); k++) if (mAt(x, k) === M_GLASS && k + 0.5 > top[x] - 3.4 * Q) put(x, k, (x + k) % (5 * Q) ? c2b : Chex('#f4f4f4'));
  }
  // ---------- 5b) Abnutzung (Gebrauchtwagen): ausgebleicht, Schmutz, Rost, Sprung in der Scheibe ----------
  const WR = d.wear;
  if (WR && WR.w > 0.02) {
    const w = WR.w;
    for (let x = 0; x < L; x++) for (let k = Math.floor(bot[x]) - 1; k <= Math.ceil(top[x]) + 1; k++) {
      const m = mAt(x, k);
      if (m !== M_BODY && m !== M_TRIM && m !== M_GLASS && m !== M_LIGHT) continue;
      const sx = ox + x, sy = row(k), u = unC(pb.d[sy * W + sx]);
      let c = [u[0], u[1], u[2]];
      const f = clamp((k + 0.5 - bot[x]) / Math.max(1, beltY - bot[x]), 0, 1);
      if (m === M_GLASS) {
        if (hash2(x * 5, k * 3) < w * 0.35) c = mixRGB(c, [110, 96, 70], 0.45);
      } else {
        const g = luma(c) * 255;
        c = mixRGB(c, [g, g, g], w * 0.45);                                           // ausgebleichter Lack
        if (hash2(x * 7, k * 3) < w * 0.3) c = mixRGB(c, [96, 74, 52], 0.5);              // Schmutz
        if (WR.rust && m === M_BODY && f < 0.5) {                                          // Rost von unten
          const n = hash2(x >> Q, k >> Q) * 0.65 + hash2(x, k) * 0.35;
          if (n < w * 0.7 + 0.08 - f * 0.4) c = n < 0.22 ? [86, 44, 24] : n < 0.4 ? [138, 74, 42] : [178, 104, 60];
        }
      }
      pb.d[sy * W + sx] = Crgb(c);
    }
    // Sprung in der Frontscheibe
    if (WR.crack) {
      const cx = g1 - 3 * Q, ck = Math.floor(top[g1 - 3 * Q]) - 3 * Q;
      for (let r = 0; r < 6; r++) { const a = r * 1.05 + 0.4; for (let t = 0; t < 6 * Q; t++) { const X = Math.round(cx + Math.cos(a) * t), K = Math.round(ck + Math.sin(a) * t * 0.8); if (mAt(X, K) === M_GLASS) put(X, K, Chex(t < 2 * Q ? '#ffffff' : '#c8dce8')); } }
    }
  }
  // ---------- 6) Fahrwerk sichtbar im Radhaus ----------
  for (const w of wheels) {
    const sx = ox + w.x;
    for (let k = Math.ceil(R); k < Math.floor(archY + ra); k++) {
      if (mAt(Math.floor(w.x), k) !== M_WELL) continue;
      const coil = (Math.floor(k / Q) % 2) ? (I.tier === 'race' ? '#ffcd75' : '#c03040') : '#2b2b33';
      for (let o = -Q; o <= Q; o++) put(Math.floor(w.x) + o, k, Chex(Math.abs(o) < Q / 2 ? '#5a5e68' : coil));
    }
    void sx;
  }
  // ---------- 7) Räder ----------
  const rimRGB = d.wear && d.wear.w > 0.3 ? mixRGB(hex2rgb(d.rimColor || '#c8ccd4'), [96, 84, 70], d.wear.w * 0.6) : hex2rgb(d.rimColor || '#c8ccd4');
  const angle = opt.angle || 0;
  for (const w of wheels) drawWheel(pb, ox + w.x, gy - w.y, R, rimR, rimRGB, d.rim, angle, mask, W, Q);
  // ---------- 8) Aerodynamik-Anbauteile ----------
  const carbon = (x, k) => Chex(((x + k) & 1) ? '#22232a' : '#34353e');
  const aeroPut = (x, k, c) => put(x, k, c, M_AERO);
  // Frontlippe / Splitter
  if (d.lip !== 'none') {
    const kk = Math.floor(bot[L - 4 * Q]) - 1;
    for (let x = L - 13 * Q; x <= L + (d.lip === 'lip' ? 0 : Q); x++) for (let t = 0; t < Q; t++) aeroPut(x, kk - t, d.lip === 'lip' ? Crgb(shadeRGB(c1, t ? -0.6 : -0.45)) : d.lip === 'carbon' ? carbon(x, kk - t) : Chex(t ? '#121216' : '#2a2b33'));

  }
  // Seitenschweller
  if (d.skirts !== 'none') {
    for (let x = Math.ceil(B.wr + ra); x <= Math.floor(B.wf - ra); x++) {
      const kk = Math.floor(bot[x]);
      for (let k = kk - 2 * Q + 1; k <= kk; k++) aeroPut(x, k, d.skirts === 'carbon' ? carbon(x, k) : Crgb(shadeRGB(c1, k > kk - Q ? -0.25 : -0.5)));
    }
  }
  // Diffusor
  if (d.diffuser !== 'none') {
    for (let x = 0; x <= 9 * Q; x++) {
      const kk = Math.floor(bot[x]) - 1;
      for (let t = 0; t < Q; t++) aeroPut(x, kk - t, Chex('#1c1c22'));
      if (d.diffuser === 'race' && x % (2 * Q) < Q) for (let t = Q; t < 2 * Q; t++) aeroPut(x, kk - t, Chex('#2a2b33'));
    }
  }
  // Heckflügel (alle Masse mit Q skaliert)
  if (d.spoiler !== 'none') {
    const q = n => Math.round(n * Q);
    const wx = B.wing, deck = Math.ceil(top[wx + q(4)]);
    const wcB = Crgb(paintCol(c1, 3, 0, 0, 1)), wcL = Crgb(paintCol(c1, 5, 0, 0, 1)), wcD = Crgb(paintCol(c1, 1, 0, 0, 1));
    const vbar = (x, k0, k1, c) => { for (let k = k0; k < k1; k++) for (let t = 0; t < Q; t++) aeroPut(x + t, k, c); };
    if (d.spoiler === 'ducktail') {
      for (let x = 0; x <= wx + q(4); x++) { const k = Math.ceil(top[x]); for (let t = 0; t < Q; t++) aeroPut(x, k + t, x <= wx + q(1) ? wcL : wcB); if (x <= wx) aeroPut(x, k + Q, outC); }
    } else if (d.spoiler === 'low') {
      vbar(wx + q(5), deck, deck + q(3), Chex('#1c1c22'));
      for (let x = wx - q(1); x <= wx + q(9); x++) { for (let t = 0; t < Q; t++) aeroPut(x, deck + q(3) + t, x < wx + q(8) ? wcD : outC); for (let t = 0; t < Q; t++) aeroPut(x, deck + q(4) + t, x > wx - q(1) ? (t === Q - 1 ? wcL : wcB) : outC); }
    } else if (d.spoiler === 'gt' || d.spoiler === 'swan') {
      if (d.spoiler === 'gt') { vbar(wx + q(6), deck, deck + q(5), Chex('#1c1c22')); vbar(wx + q(7), deck, deck + q(5), Chex('#2a2b33')); }
      else { vbar(wx + q(9), deck, deck + q(11), Chex('#1c1c22')); for (let x = wx + q(4); x <= wx + q(9); x++) for (let t = 0; t < Q; t++) aeroPut(x, deck + q(10) + t, Chex('#2a2b33')); }
      // Endplatte mit Carbon-Muster
      const ex0 = wx - q(2), ex1 = wx + q(11), ek0 = deck + q(4), ek1 = deck + q(9);
      for (let x = ex0; x <= ex1; x++) for (let k = ek0; k <= ek1; k++) {
        const edge = x === ex0 || x === ex1 || k === ek0 || k === ek1;

      }
      for (let x = wx - q(1); x <= wx + q(10); x++) for (let t = 0; t < Q; t++) aeroPut(x, deck + q(7) - Math.floor((x - wx + q(1)) / q(6)) + t, Chex(t ? '#3a3c48' : '#6a6e80'));  // Flügelprofil
    } else if (d.spoiler === 'active') {
      vbar(wx + q(8), deck, deck + q(3), Chex('#5a5e68'));
      for (let x = wx - q(2); x <= wx + q(15); x++) { const kk = deck + q(3) + (x < wx + q(4) ? Q : 0); for (let t = 0; t < Q; t++) aeroPut(x, kk + t, carbon(x >> (Q - 1), kk + t)); aeroPut(x, kk + Q, Chex('#0e0f14')); }
    }
  }

  const exh = opt.exh || 'stock';
  const exK = Math.floor(bot[2 * Q]);
  const exC = { stock: '#4a4a52', sport: '#c8ccd4', race: '#9a9aa8', titan: '#8a7ae0' }[exh] || '#4a4a52';
  const pipe = (k0, big) => { const n = big ? Q + 1 : Q; for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) aeroPut(-n + a, k0 - b, Chex(b === 0 ? shadeHex(exC, -0.3) : a === 0 ? '#101014' : b === n - 1 ? shadeHex(exC, 0.35) : exC)); };

  // ---------- 8b) Neon-Unterbodenbeleuchtung ----------
  if (d.glow && d.glow !== 'none') {
    const gc = Chex(d.glow), x0 = Math.floor(B.wr - R * 0.6), x1 = Math.ceil(B.wf + R * 0.6);
    for (let x = x0 - 6 * Q; x <= x1 + 6 * Q; x++) {
      const fade = x < x0 ? (x - x0 + 6 * Q) / (6 * Q) : x > x1 ? (x1 + 6 * Q - x) / (6 * Q) : 1;
      if (fade <= 0) continue;
      const bk = x >= 0 && x < L ? Math.floor(bot[x]) : 1;
      for (let k = -3 * Q; k < bk; k++) {
        const sx = ox + x, sy = row(k);

  }

  return { pb, cv, k: Q, W: W * iq, H: H * iq, ox: ox * iq, gy: gy * iq, L: L * iq, R: R * iq,
    wheels: wheels.map(w => ({ x: (ox + w.x) * iq, y: (gy - w.y) * iq, r: R * iq })), exhaust: { x: (ox - 2 * Q) * iq, y: row(exK) * iq },
    mask, beltY: beltY * iq, top: Q === 1 ? top : logical(top), bot: Q === 1 ? bot : logical(bot), by: by * iq,
    bodyCv: layers && layers.bodyCv, spec: layers && layers.spec, tailY: (gy - row(Math.floor((B.tail[1] || 12 * Q) + by)) ) * iq };
}

/** Rad zeichnen: Reifen mit Profilkante, Felge nach Design, Bremsscheibe und Bremssattel */
function drawWheel(pbOut, cx, cy, R, rimR, rimRGB, design, angle, mask, W, Q = 1) {
  // Proxy: Karosseriepixel (z. B. bei Tieferlegung) verdecken das Rad
  const free = (x, y) => { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= pbOut.w || y >= pbOut.h) return false; const m = mask[y * W + x]; return m === 0 || m === M_WELL || m === M_WHEEL; };

    w: pbOut.w, h: pbOut.h,
    set: (x, y, c) => { if (free(x, y)) pbOut.set(x, y, c); },
    disc: (x, y, r, c) => { const t = new PB(pbOut.w, pbOut.h); t.disc(x, y, r, c); copy(t); },
    ring: (x, y, a, b, c) => { const t = new PB(pbOut.w, pbOut.h); t.ring(x, y, a, b, c); copy(t); },
    rect: (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) pb.set(x + i, y + j, c); }
  };
  function copy(t) { const x0 = Math.max(0, Math.floor(cx - R - 2)), x1 = Math.min(pbOut.w - 1, Math.ceil(cx + R + 2)), y0 = Math.max(0, Math.floor(cy - R - 2)), y1 = Math.min(pbOut.h - 1, Math.ceil(cy + R + 2));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const c = t.d[y * t.w + x]; if (c) pb.set(x, y, c); } }
  const mark = (x, y) => { x = Math.floor(x); y = Math.floor(y); if (x >= 0 && y >= 0 && x < pb.w && y < pb.h) mask[y * W + x] = M_WHEEL; };
  // Reifen
  const Rc = Math.ceil(R) + 1;
  for (let y = Math.floor(cy - Rc); y <= cy + Rc; y++) for (let x = Math.floor(cx - Rc); x <= cx + Rc; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy, dd = Math.sqrt(dx * dx + dy * dy);
    if (dd > R) continue;
    let c;
    if (dd > R - Q) { const a = Math.atan2(dy, dx) + angle; c = (Math.floor(a * R * 0.95 + 100) % 2) ? '#363640' : '#24242a'; }   // Profilkante
    else if (dd > rimR + 0.6 * Q) {
      c = (dx + dy < -R * 0.5 && dd > rimR + 1.2 * Q) ? '#3a3a44' : '#2a2a31';                                                // Flanke mit Glanz
      const mid = (rimR + 0.6 * Q + R - Q) / 2, aa = ((Math.atan2(dy, dx) + angle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      if (R - rimR > 2.2 * Q && Math.abs(dd - mid) < 0.55 * Q && ((aa > 0.4 && aa < 1.5) || (aa > 3.5 && aa < 4.6)) && (Math.floor(aa * R * 1.1) % 3) !== 0) c = '#d8d6cc';   // Schriftzug
    }

    if (free(x, y)) { pbOut.set(x, y, Chex(c)); mark(x, y); }
  }
  // Bremsscheibe + Sattel
  pb.disc(cx, cy, rimR * 0.8, Chex('#5f636d'));
  pb.ring(cx, cy, rimR * 0.62, rimR * 0.8, Chex('#767a85'));
  { const ca = -2.3, px = cx + Math.cos(ca) * rimR * 0.62, py = cy + Math.sin(ca) * rimR * 0.62;
    pb.rect(Math.floor(px) - Q, Math.floor(py) - Q, 2 * Q, 3 * Q, Chex('#c02838')); pb.rect(Math.floor(px) - Q, Math.floor(py) - Q, Q, Q, Chex('#ff5a68')); }
  // Farbe der Felge abhängig von Lichtrichtung (oben links hell)
  const rimCol = (dx, dy, extra = 0) => { const l = (-dx - dy) / (Math.hypot(dx, dy) + 0.001); return Crgb(shadeRGB(rimRGB, clamp(l * 0.28 + extra, -0.6, 0.6))); };
  const sp = (x, y, c) => { pb.set(x, y, c); if (Q >= 3) { pb.set(x + 0.8, y, c); pb.set(x, y + 0.8, c); } };
  const spoke = (th, r0, r1, wide) => {
    for (let r = r0; r <= r1; r += 0.35 / Q) {
      const px = cx + Math.cos(th) * r, py = cy + Math.sin(th) * r;
      sp(px, py, rimCol(Math.cos(th), Math.sin(th)));
      if (wide) for (let wq = 0.6; wq <= 0.7 * Q + 0.01; wq += 0.5) { const qx = px - Math.sin(th) * wq, qy = py + Math.cos(th) * wq; sp(qx, qy, rimCol(Math.cos(th), Math.sin(th), -0.18)); }
    }

    const Rr = Math.ceil(r1) + 1;

    }

  switch (design) {
    case 'steel': {
      pb.disc(cx, cy, rimR - 0.6 * Q, Crgb(shadeRGB(rimRGB, -0.12)));
      for (let i = 0; i < 8; i++) { const a = angle + i * Math.PI / 4; pb.disc(cx + Math.cos(a) * rimR * 0.6, cy + Math.sin(a) * rimR * 0.6, 0.45 * Q + 0.15, Chex('#121218')); }
      pb.ring(cx, cy, rimR * 0.28, rimR * 0.42, Crgb(shadeRGB(rimRGB, 0.2)));

      break;
    }
    case 'five': for (let i = 0; i < 5; i++) spoke(angle + i * Math.PI * 2 / 5, 1.2 * Q, rimR - 0.8 * Q, true); lip(rimR - Q, rimR, false); break;
    case 'multi': for (let i = 0; i < 10; i++) spoke(angle + i * Math.PI / 5, 1.2 * Q, rimR - 0.8 * Q, false); lip(rimR - Q, rimR, false); break;
    case 'mesh':
      for (let i = 0; i < 8; i++) {
        const a = angle + i * Math.PI / 4;
        for (let t = 0; t <= 1; t += 0.06) {
          const r = 1.2 + t * (rimR - 2);
          sp(cx + Math.cos(a + t * 0.45) * r, cy + Math.sin(a + t * 0.45) * r, rimCol(Math.cos(a), Math.sin(a)));
          sp(cx + Math.cos(a - t * 0.45) * r, cy + Math.sin(a - t * 0.45) * r, rimCol(Math.cos(a), Math.sin(a), -0.15));
