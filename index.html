/** Federung pro Auto: Feder-Dämpfer hinten und vorne, angeregt von Beschleunigung, Bremsen, Schalten und Fahrbahn */
function suspStep(v, dt, extra) {
  if (v.zR == null) { v.zR = v.zF = v.vR = v.vF = 0; v.aS = 0; v.pv = v.v; }
  const aRaw = dt > 0 ? (v.v - v.pv) / dt : 0; v.pv = v.v;
  v.aS += (clamp(aRaw, -14, 14) - v.aS) * clamp(dt * 10, 0, 1);                   // geglättete Längsbeschleunigung
  const A = v.aS;
  // Gas: hinten geht in die Knie, vorne kaum hoch · Bremsen: vorne taucht ein, hinten kommt etwas hoch
  const tR = A >= 0 ? clamp(A * 0.2, 0, 1.4) : clamp(A * 0.06, -0.7, 0);
  const tF = A >= 0 ? clamp(-A * 0.04, -0.4, 0) : clamp(-A * 0.17, 0, 1.6);
  const K = 85, C = 8.5;
  v.vR += (K * (tR - v.zR) - C * v.vR) * dt; v.zR += v.vR * dt;
  v.vF += (K * (tF - v.zF) - C * v.vF) * dt; v.zF += v.vF * dt;
  // Fahrbahn: feine Unebenheiten ab Tempo, Motor schüttelt im Stand
  if (extra && extra.idle) { const n = extra.idle * 14 * dt; v.vR += (Math.random() - 0.5) * n; v.vF += (Math.random() - 0.5) * n; }   // nur Motorschütteln im Stand
  v.zR = clamp(v.zR, -1.4, 2.2); v.zF = clamp(v.zF, -1.2, 2.5);
  // Kamera-Trägheit (Meter): eilt beim Beschleunigen nach, beim Bremsen vor
  const camT = clamp(A * 0.16, -1.3, 1.2);
  v.camOff = (v.camOff || 0) + (camT - (v.camOff || 0)) * clamp(dt * 1.3, 0, 1);
}
/** Karosserie in senkrechten Streifen zeichnen – jeder Streifen um die Federung hinten/vorne verschoben; dazu wandernde Lack-Spiegelung */

const G_A0 = Math.PI * 0.8, G_A1 = Math.PI * 2.2;          // Skalenbereich der Rundinstrumente
const HUD_RPM = { x: 34, r: 24 }, HUD_SPD = { x: RW_ - 34, r: 24 };
/** Statische HUD-Ebene (Carbon, Skalen mit Zahlen, Rahmen) – einmal pro Rennen gezeichnet */
function buildHUDLayer(R) {
  const c = R.pc, E = c.E, y0 = HUD_Y, cy = y0 + 28;
  const cv = document.createElement('canvas'); cv.width = RW_; cv.height = RH_ - y0;
  const ctx = hdCtx(cv); ctx.translate(0, -y0);
  ctx.fillStyle = '#14161f'; ctx.fillRect(0, y0, RW_, RH_ - y0);
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0, y0, RW_, 2); ctx.fillStyle = '#333c57'; ctx.fillRect(0, y0 + 2, RW_, 1);
  ctx.fillStyle = '#1a1c28';
  for (let y = y0 + 3; y < RH_; y += 2) for (let x = (y >> 1) % 2 * 2; x < RW_; x += 4) ctx.fillRect(x, y, 2, 1);
  const face = (cx, r, max, redFrom, ticks, lab, label) => {
    ctxDisc(ctx, cx, cy, r + 2, '#0d0f1a'); ctxDisc(ctx, cx, cy, r, '#1e2030'); ctxDisc(ctx, cx, cy, r - 1, '#05060c');
    ctx.save(); ctx.lineCap = 'butt';
    // roter Bereich
    ctx.strokeStyle = '#b13e53'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, r - 2, G_A0 + (G_A1 - G_A0) * Math.min(1, redFrom / max), G_A1); ctx.stroke();
    // Striche (gross) und Zwischenstriche
    for (let i = 0; i <= ticks * 2; i++) {
      const f = i / (ticks * 2), a = G_A0 + (G_A1 - G_A0) * f, big = i % 2 === 0;
      ctx.strokeStyle = f * max >= redFrom ? '#ff4b55' : '#f4f4f4'; ctx.lineWidth = big ? 1 : 0.5;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r - (big ? 5 : 3.5)), cy + Math.sin(a) * (r - (big ? 5 : 3.5))); ctx.lineTo(cx + Math.cos(a) * (r - 1.5), cy + Math.sin(a) * (r - 1.5)); ctx.stroke();
      const t = big ? lab(i / 2) : '';
      if (t) cxText(ctx, t, cx + Math.cos(a) * (r - 10), cy + Math.sin(a) * (r - 10) - 1.75, f * max >= redFrom ? '#ff7b8a' : '#c8ccd4', 1, 'c');
    }

  const redK = E.red / 1000, gMax = Math.ceil(redK + 0.5), stepR = gMax > 10 ? 2 : 1;
  face(HUD_RPM.x, HUD_RPM.r, gMax, redK, gMax, i => i % stepR ? '' : String(i), 'X1000');
  const maxK = Math.max(200, Math.ceil((c.top + 20) / 50) * 50);
  face(HUD_SPD.x, HUD_SPD.r, maxK, maxK * 2, 10, i => i % 2 ? '' : String(Math.round(maxK * i / 10)), 'KM/H');

  ctx.fillRect(90, y0 + 42, 46, 5); ctx.fillRect(184, y0 + 40, 46, 9); ctx.fillRect(66, y0 + 48, 188, 5);

/** Nadel eines Rundinstruments (glatte Linie) */
function hudNeedle(ctx, cx, cy, r, f, col) {

/** Cockpit-HUD: Drehzahlmesser, Tacho, Gang, Schaltlichter, NOS, Reifentemperatur */
function drawHUD(ctx) {

// ---------- Ergebnis ----------
function showRaceResult() {
  const R = RACE; R.resultShown = true;
  const win = playerWins(), cfg = R.cfg;
  const p = R.p, o = R.o;
  let reward = '';
  S.stats.races++;
  if (win) {
    S.stats.wins++;
    if (cfg.oppId) { S.stats.beat = S.stats.beat || {}; S.stats.beat[cfg.oppId] = (S.stats.beat[cfg.oppId] || 0) + 1; }
    S.money += cfg.prize; addXP(cfg.xp); if (cfg.rep) addRep(cfg.rep);
    reward = `${cfg.prize ? `<div class="good">+${fmtMoney(cfg.prize)}</div>` : ''}<div class="good">+${cfg.xp} XP${cfg.rep ? ` · +${cfg.rep} Ruf` : ''}</div>`;
  } else { addXP(Math.round(cfg.xp * 0.25)); reward = `<div class="muted">+${Math.round(cfg.xp * 0.25)} XP fürs Mitmachen</div>`; }
  if (!p.foul && p.et) {
    if (cfg.dist === 'quarter' && (!S.stats.best14 || p.et < S.stats.best14)) S.stats.best14 = p.et;
    if (p.t18 && (!S.stats.best18 || p.t18 < S.stats.best18)) S.stats.best18 = p.t18;
    if (p.react != null && (!S.stats.react || p.react < S.stats.react)) S.stats.react = p.react;
  }
  if (p.blown && cfg.player.salvageId && S.salvage) {
    const o = S.salvage.owned.find(x => x.id === cfg.player.salvageId);
    if (o) { o.cond = Math.max(5, o.cond - 15); svSyncWear(o); }
  }
  const leagueTxt = cfg.league ? leagueAfterRace(cfg, p, o) : '';
  const ghostTxt = ghostSave(R), wearTxt = wearAfter(R), mg = finishMargin(R);
  if (typeof chalEvent === 'function') chalEvent('race', { win, R });
  checkAchievements();
  const fmt = v => v != null ? v.toFixed(3) + ' s' : '–';
  const perf = p.shifts.filter(s => s === 'perfect').length;
  const box = document.createElement('div');
  box.className = 'ov';
  box.style.position = 'absolute';
  box.innerHTML = `<div class="mbox small">
    <h2 class="title" style="color:${win ? 'var(--lime)' : '#ff7b8a'}">${ico(win ? 'trophy' : 'race', 'big')} ${win ? 'SIEG!' : 'NIEDERLAGE'}</h2>
    ${p.blown ? '<div class="bad" style="margin:4px">💥 MOTORSCHADEN – Ausgeschieden! Der Wagen hat 15 % Zustand verloren.</div>' : ''}
    ${timeslipHTML(R, win, mg)}
    <div class="hint" style="margin:4px">0–100 km/h: ${fmt(p.t100)} · Perfekte Schaltvorgänge: ${perf}/${p.shifts.length}${p.launchQ ? ' · Start: ' + ({ perfect: 'perfekt', high: 'zu viel Gas', low: 'zu wenig Drehzahl' })[p.launchQ] : ''}</div>
    ${cfg.oppId && OPP_INFO[cfg.oppId] ? `<div class="flex" style="margin:8px 4px">${faceImg(cfg.oppId, 40)}<i>„${esc(oppQuote(cfg.oppId, win ? 'lose' : 'win'))}“</i></div>` : ''}
    <div style="margin:10px 4px">Gewinner: <b>${win ? 'Du (' + esc(cfg.player.name) + ')' : esc(cfg.opp.name)}</b>${reward}${ghostTxt}${wearTxt}</div>${leagueTxt}
    <div class="flex"><button class="btn green ${cfg.league ? 'hidden' : ''}" id="rr-again">Nochmal${cfg.fee ? ' (' + fmtMoney(cfg.fee) + ')' : ''}</button><button class="btn gray" id="rr-back">Zurück</button></div></div>`;
  $('#race').appendChild(box);
  $('#rr-back').onclick = () => endRace(false);
  $('#rr-again').onclick = () => {
    if (S.money < cfg.fee) { toast('Zu wenig Geld für das Startgeld.', 'bad'); return; }
    S.money -= cfg.fee; const c2 = cfg; endRace(false, true); startRace(c2);
  };
  saveGame();
}

function endRace(quit, silent) {
  const R = RACE; if (!R) return;
  cancelAnimationFrame(R.raf); clearTimeout(R.loadTO);
  if (R.cruise) { const km = R.pv.x / 1000; if (km >= 0.5) addXP(Math.min(150, Math.round(km * 12))); toast(`${ico('car')} Cruise beendet: ${km.toFixed(1)} km · Spitze ${Math.round(R.vmax || 0)} km/h · ${R.passed || 0} überholt${R.crashes ? ' · ' + R.crashes + '× angestossen' : ''}`, 'good', 5000); }
  else if (quit && !R.resultShown) { S.stats.races++; toast('Rennen aufgegeben.', 'bad'); }
  audioStop();
  RACE = null;
  const el = $('#race'); if (el) el.remove();
  if (!silent) { updateTopbar(true); if (curTab === 'race') rerender(); }
}

// ---------- Motorsound je Motortyp ----------
let _noiseBuf = null;
function noiseBuffer() {

  const n = AUD.sampleRate, b = AUD.createBuffer(1, n, AUD.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return (_noiseBuf = b);
}
/** Eine Motorstimme: Grundton + Obertöne, Brummen (V-Motoren), Turbo-/Kompressor-Pfeifen, E-Surren */
function makeVoice(car, eng, vol, pan) {
  const out = AUD.createGain(); out.gain.value = 0;
  let dst = out;
  if (AUD.createStereoPanner) { const p = AUD.createStereoPanner(); p.pan.value = pan; out.connect(p); p.connect(AUD.destination); }
  else out.connect(AUD.destination);
  const V = { out, vol, ev: car.isEV, ind: eng.ind || 'none', cyl: car.cyl || 4, type: car.type, nodes: [] };
  const osc = (type, g0) => { const o = AUD.createOscillator(), g = AUD.createGain(); o.type = type; g.gain.value = g0; o.connect(g); o.start(); V.nodes.push(o); return { o, g }; };

  V.lp = lp;

    V.b = osc('triangle', 0.25); V.b.g.connect(lp);
    V.c = osc('sine', 0.12); V.c.g.connect(lp);                            // hohes Inverter-Surren
  } else {
    V.a = osc('sawtooth', 0.55); V.b = osc('square', 0.3); V.c = osc('sawtooth', 0.18);
    // Brummen: Lautstärke schwankt mit halber Zündfrequenz (V6/V8/V10/V12 klingen „unrund“)

    V.a.g.connect(am); V.b.g.connect(am); V.c.g.connect(am); am.connect(lp);

    if (V.ind === 'super') { V.t = osc('sawtooth', 0); const hp = AUD.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500; V.t.g.connect(hp); hp.connect(dst); }
  }
  return V;
}
function voiceUpdate(V, veh, thr, mute, now) {
  const E = veh.c.E, rpm = veh.rpm, u = rpm / E.red;
  if (V.ev) {
    const f = 40 + rpm / 9;
    V.a.o.frequency.setTargetAtTime(f, now, 0.03); V.b.o.frequency.setTargetAtTime(f * 2, now, 0.03); V.c.o.frequency.setTargetAtTime(f * 6, now, 0.03);
    V.lp.frequency.setTargetAtTime(1200 + rpm / 4, now, 0.05);
  } else {
    const fire = Math.max(18, rpm / 60 * Math.max(2, V.cyl / 2));
    V.a.o.frequency.setTargetAtTime(fire, now, 0.025); V.b.o.frequency.setTargetAtTime(fire * 0.5, now, 0.025); V.c.o.frequency.setTargetAtTime(fire * 2.01, now, 0.025);
    V.lfo.o.frequency.setTargetAtTime(fire / 2, now, 0.03);
    V.lp.frequency.setTargetAtTime(380 + thr * 1300 + rpm / 8, now, 0.05);
    if (V.t) {
      const boost = clamp((u - 0.35) * 1.6, 0, 1) * (0.4 + thr * 0.6);
      V.t.o.frequency.setTargetAtTime(V.ind === 'super' ? 900 + rpm * 0.9 : 1800 + rpm * 0.55, now, 0.08);
      V.t.g.gain.setTargetAtTime(boost * (V.ind === 'super' ? 0.05 : 0.07), now, 0.1);

/** kurzer Knall (Schalten, Fehlzündung im Begrenzer) */
function popSound(vol = 0.18, freq = 700) {

    s.buffer = noiseBuffer(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;

function audioStart() {

/* =============================================================================

// ---------- Donner ----------
function thunderSound(dist) {
  if (!AUD || !RACE || RACE.muted) return;
  try {
    const now = AUD.currentTime + dist, s = AUD.createBufferSource(), f = AUD.createBiquadFilter(), g = AUD.createGain();
    s.buffer = noiseBuffer(); s.loop = true; f.type = 'lowpass'; f.frequency.value = 180 + Math.random() * 120;
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.5, now + 0.08);
    g.gain.exponentialRampToValueAtTime(0.18, now + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
    s.connect(f); f.connect(g); g.connect(AUD.destination); s.start(now); s.stop(now + 2.8);
  } catch (e) { /* kein Ton */ }
}

// ---------- vor den Autos: nasser Asphalt, Pfützen, Lichtspiegelungen ----------
function drawWetRoad(ctx, W, camX) {

// ---------- nach der Szene: Regen, Blitze, Linsentropfen ----------
function drawRain(ctx, camX) {
  const R = RACE, t = R.t;
  // Wolkenbänder, die über den Himmel ziehen
  for (let i = 0; i < 7; i++) {
    const x = ((hash2(i, 31) * (RW_ + 120) - t * (4 + i) - camX * PPM * 0.03) % (RW_ + 120) + RW_ + 120) % (RW_ + 120) - 60;
    ctx.fillStyle = 'rgba(30,36,52,0.45)'; ctx.beginPath(); ctx.ellipse(x, 6 + hash2(i, 32) * 18, 40 + hash2(i, 33) * 30, 7, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(18,26,44,0.26)'; ctx.fillRect(0, 0, RW_, HUD_Y);
  // Blitz: zufällig alle 5–11 s, doppeltes Aufflackern, Donner kommt verzögert
  if (R.boltNext == null) R.boltNext = t + 2.5 + Math.random() * 4;
  if (t >= R.boltNext) { R.boltT = t; R.boltX = 30 + Math.random() * (RW_ - 60); R.boltSeed = Math.random() * 1000; R.boltNext = t + 5 + Math.random() * 6; thunderSound(0.25 + Math.random() * 0.8); }
  const bt = R.boltT != null ? t - R.boltT : 99;
  const flash = bt < 0.6 ? Math.max(0, (bt < 0.08 ? 1 : bt < 0.14 ? 0.25 : bt < 0.22 ? 0.85 : 1 - (bt - 0.22) / 0.38)) : 0;
  if (flash > 0.3 && bt < 0.3) {
    ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.shadowColor = '#a8d0ff'; ctx.shadowBlur = 6;
    ctx.beginPath(); let x = R.boltX, y = 0; ctx.moveTo(x, y);
    for (let k = 0; k < 9; k++) { x += (hash2(R.boltSeed, k) - 0.5) * 14; y += 4 + hash2(R.boltSeed, k + 20) * 3; ctx.lineTo(x, y); if (k === 4) { ctx.moveTo(x, y); ctx.lineTo(x + 9, y + 8); ctx.moveTo(x, y); } }
    ctx.stroke(); ctx.restore();
  }
  // Regen: hinten fein und langsamer, vorne lange schräge Striche
  const wind = 0.28;
  ctx.fillStyle = 'rgba(170,200,235,0.35)';
  for (let i = 0; i < 90; i++) {
    const y = (hash2(i, 2) * 150 + t * 190) % 150 - 12, x = ((hash2(i, 1) * RW_ - y * wind - t * 40 + camX * PPM * 0.2) % RW_ + RW_) % RW_;
    ctx.fillRect(Math.round(x), Math.round(y), 0.5, 3);
  }
  ctx.fillStyle = 'rgba(205,225,250,0.6)';
  for (let i = 0; i < 110; i++) {
    const y = (hash2(i, 12) * 150 + t * 330) % 150 - 12, x = ((hash2(i, 11) * RW_ - y * wind - t * 70 + camX * PPM * 0.45) % RW_ + RW_) % RW_;
    ctx.fillRect(Math.round(x), Math.round(y), 1, 3); ctx.fillRect(Math.round(x - 1), Math.round(y + 3), 1, 3);

    const ph = (t * 3 + hash2(i, 40)) % 1, cyc = Math.floor(t * 3 + hash2(i, 40));
    const x = Math.round(hash2(i, cyc) * RW_), y = hash2(i + 50, cyc) > 0.5 ? 78 + Math.round(hash2(i + 60, cyc) * 16) : 99 + Math.round(hash2(i + 70, cyc) * 25);
    if (ph > 0.35) continue;

    ctx.fillRect(x - Math.round(sp * 2), y - Math.round(sp * 2), 1, 1); ctx.fillRect(x + Math.round(sp * 2), y - Math.round(sp * 2), 1, 1); ctx.fillRect(x, y - Math.round(sp * 3), 1, 1);
  }

  for (let i = 0; i < 7; i++) {
    const life = (t * (0.08 + hash2(i, 90) * 0.06) + hash2(i, 91)) % 1, cyc = Math.floor(t * (0.08 + hash2(i, 90) * 0.06) + hash2(i, 91));
    const x = 10 + hash2(i, cyc + 100) * (RW_ - 20), y = 4 + hash2(i, cyc + 200) * 50 + life * life * 50, r = 1.5 + hash2(i, 92) * 2;

    if (life > 0.25) { ctx.fillStyle = 'rgba(200,220,255,0.08)'; ctx.fillRect(x - 0.5, y - life * 30, 1, life * 30); }

    const ph = (t * 0.6 + hash2(i, 300)) % 1, x = ((hash2(i, 301) * RW_ + camX * PPM * 0.9) % RW_ + RW_) % RW_ - ph * 10, y = 124 - ph * 50;
    ctx.fillStyle = `rgba(255,${Math.round(140 + 80 * (1 - ph))},60,${(0.8 * (1 - ph)).toFixed(2)})`; ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
  }

/* =============================================================================
   Teil 10e: Längere Distanzen + Strecke „Koh Samui – Lamai“
   Lamai: grüne Hügel, türkises Meer mit Longtail-Booten, bunte Shophouses mit
   Markisen und Schildern, Strommasten, Palmen am Strassenrand, Roller.
   ============================================================================= */
const DISTS = {
  eighth:  { m: 201.17,  label: '1/8 Meile (201 m)',   short: '1/8 Meile', prize: 0.6, lvl: 1 },
  quarter: { m: 402.34,  label: '1/4 Meile (402 m)',   short: '1/4 Meile', prize: 1,   lvl: 1 },
  half:    { m: 804.67,  label: '1/2 Meile (805 m)',   short: '1/2 Meile', prize: 1.5, lvl: 6 },
  mile:    { m: 1609.34, label: '1 Meile (1609 m)',    short: '1 Meile',   prize: 2.2, lvl: 12 }
};
const distOf = k => DISTS[k] || DISTS.quarter;
const distOK = () => S.level >= distOf(RSEL.dist).lvl || (RSEL.dist = 'quarter');
/** geschätzte Zeit (perfekt gefahren) für eine Distanz */
function distTime(car, k) {
  if (k === 'eighth') return car.t18;
  if (k === 'quarter' || !DISTS[k]) return car.t14;
  const ck = [k, car.ps, car.nm, car.weight, car.cd, car.grip, car.E.red, car.E.gears, car.top, car.launchU].join('|');
  if (_distCache.has(ck)) return _distCache.get(ck);
  const res = distTimeRaw(car, k); if (_distCache.size > 400) _distCache.clear(); _distCache.set(ck, res); return res;
}
const _distCache = new Map();
function distTimeRaw(car, k) {
  const D = DISTS[k].m, v = new Vehicle(car), E = car.E; v.heat = 0.8;
  v.rpm = E.isEV ? 0 : E.idle + (car.launchU || 0.5) * (E.red - E.idle); v.launched = true;
  const dt = 1 / 60;
  for (let i = 0; i < 60 * 120; i++) {
    v.step(dt, { thr: 1, clutch: false });
    if (!E.isEV && v.rpm >= E.red * 0.95 && v.shiftT <= 0 && v.gear < E.ratios.length) v.shiftUp();
    if (v.x >= D) return v.t;
  }
  return 120;
}

// ---------- Lamai: Hügel + Meer im Hintergrund-Streifen (320x30, pro Spalte) ----------
function drawSamuiScene(p, T, x) {
  const set = (y, c) => p.set(x, y, Chex(c));
  const m = Math.round(9 + 5 * Math.sin(x * 0.021 + 1) + 3 * Math.sin(x * 0.067) + 2 * Math.sin(x * 0.17));
  for (let y = m; y < 22; y++) set(y, (hash2(x >> 1, y >> 1) > 0.7) ? '#24603a' : (y < m + 2 ? '#4a9a56' : '#2f7a4a'));
  if (hash2(x, 4) > 0.93 && m < 18) { set(m - 1, '#3a8a4a'); set(m - 2, '#58aa5e'); }             // Baumkronen
  for (let y = 22; y < 29; y++) set(y, (y + Math.floor(x / 3)) % 5 === 0 ? '#73eff7' : y < 24 ? '#2aa8c0' : '#1f8fb0');   // Meer
  set(29, '#f0dca8');                                                                          // Strand
  const b = x % 97;                                                                            // Longtail-Boote
  if (b >= 10 && b < 19) { set(25, '#6a3a1e'); set(26, b > 11 && b < 18 ? '#8a5a2e' : '#6a3a1e'); if (b > 12 && b < 16) set(24, '#f4f4f4'); if (b === 18) set(24, '#6a3a1e'); }
}

// ---------- Shophouses (ersetzen die Tribüne), 192x34, 2 Bilder für Lichter ----------
function samuiTownTile(fr) {
  const W = 192, H = 34, p = new PB(W, H);
  const cols = ['#f4c87a', '#8fd0c8', '#f49ab0', '#c8e070', '#f4f0e0', '#a0c0f0', '#f0a070', '#d8b0f0'];
  let x = 0, i = 0;
  while (x < W) {
    const w = 20 + Math.floor(hash2(i, 1) * 14), h = 18 + Math.floor(hash2(i, 2) * 14), top = H - h;
    if (hash2(i, 9) > 0.78 && x > 4 && x < W - 12) {                                       // Lücke mit Palme
      const tx = x + 5;
      for (let y = top + 2; y < H; y++) p.set(tx + Math.round(Math.sin((H - y) * 0.12) * 1.5), y, Chex(y % 3 ? '#8a6a3a' : '#6a4a2a'));
      const cx = tx + Math.round(Math.sin((H - top - 2) * 0.12) * 1.5), cy = top + 2;
      for (let a = 0; a < 7; a++) { const ang = -Math.PI + a * Math.PI / 6; for (let r = 1; r < 8; r++) p.set(cx + Math.round(Math.cos(ang) * r), cy + Math.round(Math.sin(ang) * r * 0.5 + r * r * 0.05), Chex(r > 5 ? '#4a9a46' : '#2f7a3a')); }
      x += 12; i++; continue;
    }
    const c = hex2rgb(cols[Math.floor(hash2(i, 3) * cols.length)]);
    const ww = Math.min(w, W - x);
    p.rect(x, top, ww, h, Crgb(c));
    p.rect(x, top, ww, 2, Crgb(shadeRGB(c, -0.35)));                                         // Dachkante
    p.rect(x, top, 1, h, Crgb(shadeRGB(c, 0.15))); p.rect(x + ww - 1, top, 1, h, Crgb(shadeRGB(c, -0.25)));
    const floors = Math.floor((h - 12) / 7);
    for (let f = 0; f < floors; f++) {                                                      // Fenster + Balkone
      const wy = top + 4 + f * 7;
      for (let k = 0; k < Math.floor((ww - 4) / 6); k++) {
        const wx = x + 3 + k * 6, lit = fr && hash2(i * 10 + k, f + 30) > 0.6;
        p.rect(wx, wy, 4, 4, Chex(lit ? '#ffe8a0' : '#29366f')); p.rect(wx, wy, 4, 1, Chex('#1a1c2c'));
        if (hash2(i * 10 + k, f) > 0.5) p.rect(wx - 1, wy + 4, 6, 1, Chex('#f4f4f4'));
      }
    }
    // Erdgeschoss: offener Laden, Markise, Schild
    const sy = H - 12;
    const sc = ['#b13e53', '#3b5dc9', '#38b764', '#ffcd75', '#ef7d57'][Math.floor(hash2(i, 5) * 5)];
    p.rect(x + 1, sy - 4, ww - 2, 4, Chex(sc));
    for (let k = x + 3; k < x + ww - 3; k += 2) if (hash2(k, i) > 0.35) p.set(k, sy - 2 - (k % 3 ? 0 : 1), Chex(fr && hash2(i, 6) > 0.5 ? '#ffffff' : '#f4f4e0'));   // „Schrift“
    for (let k = 0; k < ww - 2; k++) p.rect(x + 1 + k, sy, 1, 2, Chex(Math.floor(k / 3) % 2 ? '#f4f4f4' : (hash2(i, 7) > 0.5 ? '#b13e53' : '#38b764')));   // Markise
    p.rect(x + 2, sy + 2, ww - 4, 10, Chex('#1a1c2c'));
    for (let k = 0; k < 3; k++) { const ox = x + 4 + Math.floor(hash2(i, 20 + k) * (ww - 8)); p.rect(ox, H - 5, 2, 3, Chex(['#ef7d57', '#ffcd75', '#73eff7'][k])); }   // Waren
    x += ww; i++;
  }
  // Strommasten + durchhängende Kabel
  for (let px = 14; px < W; px += 64) {
    p.rect(px, 0, 1, H, Chex('#3a3e48')); p.rect(px - 3, 2, 7, 1, Chex('#3a3e48'));
    for (let k = 0; k < 64 && px + k < W; k++) { const sag = Math.round(Math.sin(k / 64 * Math.PI) * 3); p.set(px + k, 2 + sag, Chex('#22263a')); p.set(px + k, 4 + sag, Chex('#22263a')); }
  }
  return p.canvas();
}

// ---------- vor den Autos: Meeresglitzern, Roller, Palmen am Strassenrand ----------
function drawSamuiFront(ctx, W, camX) {
  const t = sceneT();

  const sl = -((camX * PPM * 0.05) % RW_);
  for (let i = 0; i < 26; i++) {
    const x = ((hash2(i, 401) * RW_ + sl) % RW_ + RW_) % RW_, y = 32 + Math.floor(hash2(i, 402) * 7);
    if (Math.sin(t * 3 + i * 1.7) > 0.6) { ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(x), y, 1, 1); }
  }
  // Möwen
  for (let i = 0; i < 4; i++) {
    const x = ((hash2(i, 410) * RW_ + t * (12 + i * 3)) % (RW_ + 40)) - 20, y = 10 + hash2(i, 411) * 14 + Math.sin(t * 2 + i) * 2, f = Math.sin(t * 9 + i) > 0 ? 1 : 0;
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(Math.round(x) - 2, Math.round(y) - f, 2, 1); ctx.fillRect(Math.round(x) + 1, Math.round(y) - f, 2, 1); ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
  // Roller auf der Gegenfahrbahn hinter der Mauer
  for (let i = 0; i < 3; i++) {
    const x = ((hash2(i, 420) * 400 - t * (30 + i * 9) - camX * PPM * 0.35) % 400 + 400) % 400 - 40, y = 63;
    ctx.fillStyle = ['#b13e53', '#3b5dc9', '#ffcd75'][i]; ctx.fillRect(Math.round(x), y, 6, 2);
    ctx.fillStyle = '#1a1c2c'; ctx.fillRect(Math.round(x), y + 2, 2, 1); ctx.fillRect(Math.round(x) + 4, y + 2, 2, 1);
    ctx.fillStyle = '#f0c0a0'; ctx.fillRect(Math.round(x) + 2, y - 3, 1, 1); ctx.fillStyle = ['#38b764', '#f4f4f4', '#ef7d57'][i]; ctx.fillRect(Math.round(x) + 2, y - 2, 2, 2);
  }
  // Palmen am Strassenrand (wiegen sich im Wind)
  for (let k = Math.floor(camX / 6.5) - 2; k < camX / 6.5 + RW_ / PPM / 6.5 + 2; k++) {
    if (hash2(k, 430) < 0.4) continue;
    const bx = W(k * 6.5 + hash2(k, 431) * 2.5), h = 30 + Math.round(hash2(k, 432) * 12), lean = (hash2(k, 433) - 0.5) * 0.5, sway = Math.sin(t * 1.3 + k) * 1.2;
    for (let y = 0; y < h; y++) { const xx = bx + Math.round(lean * y + Math.sin(y * 0.08) * 2 + sway * y / h); ctx.fillStyle = y % 3 ? '#8a6a3a' : '#6a4a2a'; ctx.fillRect(xx, 74 - y, 2, 1); }
    const cx = bx + Math.round(lean * h + Math.sin(h * 0.08) * 2 + sway), cy = 74 - h;
    for (let a = 0; a < 8; a++) {
      const ang = -Math.PI * 1.05 + a * Math.PI * 1.1 / 7 + Math.sin(t * 1.6 + k + a) * 0.06;
      for (let r = 1; r < 12; r++) { ctx.fillStyle = r > 8 ? '#5aaa50' : r > 4 ? '#3a8a40' : '#2a6a32'; ctx.fillRect(Math.round(cx + Math.cos(ang) * r), Math.round(cy + Math.sin(ang) * r * 0.55 + r * r * 0.045), 1, 1); }
    }
    ctx.fillStyle = '#6a4a20'; ctx.fillRect(cx - 1, cy + 1, 2, 2); ctx.fillRect(cx + 1, cy + 2, 1, 1);    // Kokosnüsse
  }
}
/* =============================================================================
   Teil 10f: Länder-Kulissen (für Rennstrecken und die freie Fahrt)
   Jedes Land: Hintergrund-Streifen (320x30, spaltenweise), Häuserreihe
   (192x34, 2 Bilder für Lichter), Requisiten vor der Strasse und Animationen.
   Länder: Japan (Fuji, Izakaya), Vietnam (Halong-Felsen, Röhrenhäuser),
   Kambodscha (Tempel, Pfahlhäuser), China (Grosse Mauer, Pagoden),

let ROAM = null;                                         // (früher: freie Fahrt – entfernt)
let TILE_SEED = 0;                                       // Varianten der Häuserreihen
const sceneT = () => (RACE ? RACE.t : ROAM ? ROAM.t : (typeof CUT !== 'undefined' && CUT) ? CUT.t : 0);

// ---------- kleine Zeichenhelfer (PB = Pixelpuffer) ----------
/** zeichenähnliches 5x5-Muster (wirkt wie Kanji/Hanzi, ist aber frei erfunden) */
function pbGlyph(p, x, y, seed, col) {
  const c = Chex(col);
  p.rect(x, y + 1 + Math.floor(hash2(seed, 1) * 3), 5, 1, c);
  p.rect(x + 1 + Math.floor(hash2(seed, 2) * 3), y, 1, 5, c);
  for (let k = 0; k < 4; k++) if (hash2(seed, 10 + k) > 0.45) p.set(x + Math.floor(hash2(seed, 20 + k) * 5), y + Math.floor(hash2(seed, 30 + k) * 5), c);
}
function pbTree(p, x, base, kind, fr, seed) {
  if (kind === 'sakura') {
    for (let y = base - 9; y < base; y++) p.set(x, y, Chex('#5a3a2a'));
    for (let a = 0; a < 40; a++) { const r = hash2(seed, a) * 6, an = hash2(seed, a + 50) * Math.PI * 2; p.set(x + Math.round(Math.cos(an) * r * 1.3), base - 11 + Math.round(Math.sin(an) * r * 0.8), Chex(hash2(seed, a + 99) > 0.4 ? '#ffb0d0' : '#ff8ab8')); }
  } else if (kind === 'pine') {
    for (let y = base - 3; y < base; y++) p.set(x, y, Chex('#4a3020'));
    for (let k = 0; k < 12; k++) { const w = Math.round(k * 0.45); p.rect(x - w, base - 15 + k, w * 2 + 1, 1, Chex(k % 3 ? '#1e5a3a' : '#2a7048')); }
  } else if (kind === 'palm') {
    for (let y = base - 14; y < base; y++) p.set(x + Math.round(Math.sin((base - y) * 0.12) * 1.5), y, Chex(y % 3 ? '#8a6a3a' : '#6a4a2a'));
    const cx = x + 2, cy = base - 14;
    for (let a = 0; a < 7; a++) { const ang = -Math.PI + a * Math.PI / 6; for (let r = 1; r < 8; r++) p.set(cx + Math.round(Math.cos(ang) * r), cy + Math.round(Math.sin(ang) * r * 0.5 + r * r * 0.05), Chex(r > 5 ? '#4a9a46' : '#2f7a3a')); }
  } else if (kind === 'bamboo') {
    for (let s = 0; s < 4; s++) { const bx = x + s * 2 - 3, h = 16 + Math.floor(hash2(seed, s) * 10); for (let y = base - h; y < base; y++) p.set(bx, y, Chex(y % 5 ? '#5aa050' : '#3a7a3a')); p.set(bx + 1, base - h + 2, Chex('#7ac060')); }
  }
}
/** Reihe von Gebäuden: house(p, x, w, h, i, fr) zeichnet eins; Lücken optional mit Baum */
function pbStreet(fr, house, opt = {}) {
  const W = 192, H = 34, p = new PB(W, H);
  if (opt.back) for (let bx = 0; bx < W; bx++) { const hb = Math.round(6 + 4 * Math.sin(bx * 0.11) + 3 * hash2(bx >> 2, 3)); for (let y = hb; y < H; y++) p.set(bx, y, Chex(y === hb ? shadeHex(opt.back, 0.15) : opt.back)); }
  let x = 0, i = TILE_SEED;
  while (x < W) {
    if (opt.tree && hash2(i, 9) > (opt.gap || 0.8) && x > 3 && x < W - 12) { pbTree(p, x + 5, H, opt.tree, fr, i); x += 11; i++; continue; }
    const w = Math.min((opt.wMin || 18) + Math.floor(hash2(i, 1) * (opt.wVar || 14)), W - x), h = (opt.hMin || 16) + Math.floor(hash2(i, 2) * (opt.hVar || 14));
    house(p, x, w, h, i, fr, H);
    x += w + (opt.space || 0); i++;
  }
  if (opt.poles) for (let px = 14; px < W; px += 64) {
    p.rect(px, 0, 1, H, Chex('#3a3e48')); p.rect(px - 3, 2, 7, 1, Chex('#3a3e48'));
    for (let k = 0; k < 64 && px + k < W; k++) { const sag = Math.round(Math.sin(k / 64 * Math.PI) * 3); p.set(px + k, 2 + sag, Chex('#22263a')); if (opt.poles > 1) p.set(px + k, 5 + sag, Chex('#22263a')); }
  }
  return p.canvas();
}

// ---------- vor der Strasse: Requisiten mit Bewegung (Canvas) ----------
function ctxSakura(ctx, x, t, k) {
  ctx.fillStyle = '#4a2e22'; ctx.fillRect(x, 46, 3, 29); ctx.fillRect(x - 5, 49, 5, 2); ctx.fillRect(x + 3, 45, 6, 2); ctx.fillRect(x - 2, 42, 2, 5);
  const sw = Math.sin(t * 1.2 + k) * 1;
  for (let a = 0; a < 130; a++) {
    const r = Math.sqrt(hash2(k, a)) * 14, an = hash2(k, a + 150) * Math.PI * 2, yy = Math.sin(an) * r * 0.62;
    ctx.fillStyle = yy > 4 ? '#e86a9a' : hash2(k, a + 300) > 0.35 ? '#ffb8d8' : '#ffd8ea';
    ctx.fillRect(Math.round(x + 1 + Math.cos(an) * r * 1.5 + sw * (1 - yy / 10)), Math.round(38 + yy), 2, 2);
  }
}
function ctxLanternPole(ctx, x, t, k, col = '#d83030') {
  ctx.fillStyle = '#2a2b33'; ctx.fillRect(x, 44, 1, 31);
  ctx.fillRect(x - 4, 44, 9, 1);
  for (const [ox, ph] of [[-3, 0], [4, 1.7]]) {
    const sw = Math.sin(t * 2 + k + ph) * 1.2, lx = Math.round(x + ox + sw);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,120,60,0.16)'; ctx.beginPath(); ctx.arc(lx, 50, 8, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#2a2b33'; ctx.fillRect(lx, 45, 1, 1);
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(lx + 0.5, 50, 3.2, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffb070'; ctx.fillRect(lx - 1, 48, 1, 4);
    ctx.fillStyle = '#d4a640'; ctx.fillRect(lx - 2, 46, 5, 1); ctx.fillRect(lx - 2, 54, 5, 1); ctx.fillRect(lx, 55, 1, 3);
  }
}
function ctxPine(ctx, x, k) {
  const h = 26 + Math.round(hash2(k, 7) * 12);
  ctx.fillStyle = '#4a3020'; ctx.fillRect(x, 70, 2, 5);
  for (let i = 0; i < h; i++) { const w = Math.round(i * 0.32); ctx.fillStyle = i % 4 ? '#1e5a3a' : '#2a7048'; ctx.fillRect(x + 1 - w, 70 - h + i, w * 2 + 1, 1); }
}
function ctxScooter(ctx, x, y, i, hat) {
  ctx.fillStyle = ['#b13e53', '#3b5dc9', '#ffcd75', '#38b764', '#f4f4f4'][i % 5]; ctx.fillRect(Math.round(x), y, 6, 2);
  ctx.fillStyle = '#1a1c2c'; ctx.fillRect(Math.round(x), y + 2, 2, 1); ctx.fillRect(Math.round(x) + 4, y + 2, 2, 1);
  ctx.fillStyle = ['#38b764', '#f4f4f4', '#ef7d57', '#5d275d'][i % 4]; ctx.fillRect(Math.round(x) + 2, y - 2, 2, 2);
  if (hat) { ctx.fillStyle = '#e8d8a0'; ctx.fillRect(Math.round(x) + 1, y - 3, 4, 1); ctx.fillRect(Math.round(x) + 2, y - 4, 2, 1); } else { ctx.fillStyle = '#f0c0a0'; ctx.fillRect(Math.round(x) + 2, y - 3, 1, 1); }
}
/** Fahrzeuge hinter der Mauer (Roller, Tuk-Tuks) */
function ctxTraffic(ctx, camX, t, n, kind) {
  for (let i = 0; i < n; i++) {
    const x = ((hash2(i, 420) * 420 - t * (26 + i * 7) - camX * PPM * 0.35) % 420 + 420) % 420 - 50, y = 63;
    if (kind === 'tuk' && i % 2 === 0) {
      ctx.fillStyle = '#2a6ac8'; ctx.fillRect(Math.round(x), y - 5, 9, 1); ctx.fillStyle = '#ffcd75'; ctx.fillRect(Math.round(x), y - 4, 1, 5); ctx.fillRect(Math.round(x) + 8, y - 4, 1, 5);
      ctx.fillStyle = '#b13e53'; ctx.fillRect(Math.round(x) + 6, y - 2, 4, 3); ctx.fillStyle = '#1a1c2c'; ctx.fillRect(Math.round(x) + 1, y + 1, 2, 1); ctx.fillRect(Math.round(x) + 7, y + 1, 2, 1);
    } else ctxScooter(ctx, x, y, i, kind === 'hat');
  }
}

  // ---------------- Vietnam ----------------

    }, { tree: 'palm', gap: 0.88, wMin: 12, wVar: 8, hMin: 22, hVar: 12, poles: 3, back: '#7a8a8a' }),

/* =============================================================================

function cruiseKey(e, down) {

  else if (k === 'ArrowLeft' || k === 'Shift' || k === 'a' || k === 'A') { R.inp.brake = down; e.preventDefault(); }

function cruiseStep(dt) {

  pv.step(dt, { thr: I.gas && !I.brake ? 1 : 0, clutch: false });
  R.brakeF = clamp((R.brakeF || 0) + (I.brake ? dt * 4 : -dt * 8), 0, 1);                  // Bremsdruck baut sich auf

/** Verkehr: langsamere Autos auf beiden Spuren, die man überholen kann */

  const R = RACE, pv = R.pv;

    const front = R.traffic.filter(o => o !== c && o.lane === c.lane && o.x > c.x).sort((a, b) => a.x - b.x)[0];

/* =============================================================================
   Teil 10n: Effekte & Licht für Rennen und Cruisen
   - Partikel: dicker Reifenqualm, Auspuff-Wölkchen, Fehlzündungen mit Funken,
     Gummi-Krümel beim Start, Funken bei tiefergelegten Autos
   - Himmel: ziehende Wolken, funkelnde Sterne, Sonnen-Reflexe
   - Licht: Scheinwerfer-Lichtpfützen, Laternenlicht auf der Fahrbahn,

   ============================================================================= */
const FX_PART_MAX = 420;

/** Rauch-Textur (Pixel-Wolke mit Licht oben links, ausgefranstem Rand), pro Farbe zwischengespeichert */
const _blobCache = {};

  const key = kind + v; if (_blobCache[key]) return _blobCache[key];
  const S = 24, pb = new PB(S, S), c = S / 2;

  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {

JUDGES.forEach(j => { OPP_INFO['judge_' + j.id] = Object.assign({ hi: [''], win: [''], lose: [''] }, j.face); });
const SHOW_NICKS = ['NeonNico', 'DriftQueen', 'BoostBen', 'LowLina', 'TurboTara', 'RimRaj', 'StanceSam', 'VtecVera', 'GaragenGabi', 'NitroNils', 'ChromeChris', 'PixelPia'];
const SHOW_NAMES = ['Midnight Ghost', 'Sakura Spec', 'Red Viper', 'Blue Thunder', 'Kitsune', 'Lowrider X', 'Street Samurai', 'Sunset Cruiser', 'Neon Shark', 'Gold Rush', 'Ice Queen', 'Black Mamba'];

// ---------- gemeinsamer Speicher (alle Konten in diesem Browser) ----------
function showStore() { try { const s = JSON.parse(localStorage.getItem(CSHOW_KEY) || 'null'); if (s && s.entries) return s; } catch (e) { /* neu */ } return { entries: {} }; }
function showStoreSave(s) { try { localStorage.setItem(CSHOW_KEY, JSON.stringify(s)); } catch (e) { /* voll */ } }

// ---------- Wertung ----------
function showScores(car, d, extra = 0) {
  const excl = { small: 5, family: 10, suv: 25, sport: 45, super: 75, hyper: 95 }[car.cls] || 20;
  const paintB = { chrome: 18, pearl: 15, metallic: 8, matte: 6 }[d.paint] || 0;
  return {
    style: clamp(car.style, 0, 100),
    perf: clamp((17 - car.t14) / 9.5 * 100, 0, 100),
    exo: clamp(excl * 0.7 + paintB + (d.kit && d.kit !== 'none' ? 8 : 0) + (d.glow && d.glow !== 'none' ? 6 : 0) + extra, 0, 100)
  };
}
/** Jury-Punkte 1–10 (mit etwas Laune, aber fest pro Runde) */
function judgePoints(sc, seed) {
  const r = seededRand(seed);
  return JUDGES.map(j => clamp(Math.round((sc[j.id] / 10 + (r() - 0.5) * 1.6) * 10) / 10, 1, 10));
}

// ---------- Runde ----------
function npcShowEntry(r, i) {
  const L = S.level, maxC = clamp(Math.floor(L / 5), 1, 5);
  const cls = CLASS_ORDER[clamp(Math.floor(r() * (maxC + 1)), 0, 5)];
  const bodies = Object.keys(BODIES).filter(b => BODIES[b].cls === cls);
  const pickR = a => a[Math.floor(r() * a.length)];
  const d = oppDesign(cls, pickR(bodies), pickR(PAINT_COLORS), pickR(PAINT_COLORS), {
    stripe: pickR(Object.keys(STRIPES)), paint: pickR(Object.keys(PAINTS)), rim: pickR(Object.keys(RIMS)), rimColor: pickR(RIM_COLORS),
    tire: 2 + Math.floor(r() * 5), spoiler: pickR(Object.keys(SPOILERS)), lip: pickR(Object.keys(LIPS)), skirts: pickR(Object.keys(SKIRTS)),
    diffuser: pickR(Object.keys(DIFFUSERS)), ride: -Math.floor(r() * 5), kit: pickR(Object.keys(KITS)), glow: r() > 0.5 ? pickR(GLOWS) : 'none',
    sticker: pickR(Object.keys(STICKERS)), number: r() > 0.6 ? 1 + Math.floor(r() * 98) : 0, tint: Math.floor(r() * 5)
  });
  const types = ['i4', 'v6', 'v8', 'v10', 'v12'].slice(0, 1 + Math.floor(r() * (1 + maxC)));
  const ty = pickR(types), T = ENGINE_TYPES[ty];
  const e = oppEngine(ty, Math.round((T.dmin + r() * (T.dmax - T.dmin)) * 10) / 10, pickR(['none', 'turbo', 'twin', 'super']), 'alu', 6, r() > 0.6 ? 'small' : 'none');
  return { id: 'npc' + i, npc: true, user: pickR(SHOW_NICKS), name: pickR(SHOW_NAMES), design: d, engine: e, likes: Math.floor(r() * 8) };
}
function showEnsure() {
  if (!S) return null;
  if (!S.show || !S.show.npc) S.show = { round: 1, ends: S.day + SHOW_DAYS, entry: null, npc: [], voted: {}, history: [] };
  const X = S.show;
  if (!X.npc.length) { const r = seededRand('show' + X.round + S.company); X.npc = Array.from({ length: 6 }, (_, i) => npcShowEntry(r, i)); }
  return X;
}
/** alle Ausstellungsstücke der Runde (eigene, andere Konten, KI) */
function showEntries() {
  const X = showEnsure(), st = showStore(), list = [];
  for (const [u, e] of Object.entries(st.entries)) {
    if (u === AUTH_USER) continue;
    list.push({ id: 'acc_' + u, acc: u, user: e.user, name: e.name, design: e.design, engine: e.engine, likes: Object.keys(e.likes || {}).length, company: e.company });
  }
  if (X.entry) { const me = st.entries[AUTH_USER]; list.push(Object.assign({ id: 'me', me: true, user: (currentAccount() || {}).name || 'Du', likes: me ? Object.keys(me.likes || {}).length : 0 }, X.entry)); }
  return list.concat(X.npc.map(n => Object.assign({}, n, { likes: n.likes + (X.voted[n.id] ? 1 : 0) })));
}
function rankShow() {
  const X = showEnsure();
  return showEntries().map(en => {
    const car = computeCar(en.design, en.engine), sc = showScores(car, en.design, en.premium ? 10 : 0);
    const jp = judgePoints(sc, 'j' + X.round + en.id + en.name);
    const jury = jp.reduce((a, b) => a + b, 0) / 3 * 10;
    const crowd = clamp(sc.style * 0.5 + sc.perf * 0.25 + 15 + en.likes * 7, 0, 100);
    return Object.assign({}, en, { car, jp, jury, crowd, total: Math.round((jury * 0.7 + crowd * 0.3) * 10) / 10 });
  }).sort((a, b) => b.total - a.total);
}
/** am Ende jeder Runde aus dayTick */
function showDay() {
  const X = showEnsure(); if (!X || S.day < X.ends) return;
  const ranks = rankShow(), place = ranks.findIndex(e => e.me) + 1;
  let txt = '';
  if (place) {
    const prize = place <= 3 ? [[30, 8000, 4], [20, 4000, 2], [10, 2000, 1]][place - 1] : [3, 300, 0];
    const money = Math.round(prize[1] * Math.pow(S.level, 1.2));
    S.gems = (S.gems || 0) + prize[0]; S.money += money; if (prize[2]) addRep(prize[2]);
    addXP(place <= 3 ? 300 * S.level : 50 * S.level);
    txt = `Platz ${place} von ${ranks.length} mit „${esc(X.entry.name)}“ – +${prize[0]} Diamanten, +${fmtMoney(money)}`;
    X.history.unshift({ round: X.round, place, of: ranks.length, name: X.entry.name, total: ranks[place - 1].total });
    X.history = X.history.slice(0, 10);
    X.best = Math.min(X.best || 99, place);
    toast(`${ico('trophy', 'big')} <div><b>Autoshow beendet!</b><br>${txt}</div>`, place <= 3 ? 'good' : '', 9000);
    if (place === 1) sfx('goal');
  }
  X.lastResult = { round: X.round, top: ranks.slice(0, 3).map(e => ({ name: e.name, user: e.user, total: e.total, me: !!e.me })), place, of: ranks.length };
  X.round++; X.ends = S.day + SHOW_DAYS; X.npc = []; X.voted = {};
  showEnsure();
}

ACTIONS.showVote = d => {

};

// ---------- Laufsteg-Animation ----------
let _showT = 0;
function drawShowStage(t) {
  const cv = $('#showcv'); if (!cv) return;
  const ctx = hdCtx(cv), W = 320, H = 120, X = showEnsure();
  const en = X.entry || (rankShow()[0]);
  // Halle
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b0c18'); g.addColorStop(1, '#1a1c2c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 9; i++) { ctx.fillStyle = i % 2 ? '#14162a' : '#181a30'; ctx.fillRect(i * 36, 0, 36, 70); }
  // Publikum (Silhouetten) mit Kamerablitzen
  for (let x = 0; x < W; x += 5) { const h = 6 + ((x * 7) % 5); ctx.fillStyle = '#0d0f1a'; ctx.fillRect(x, 70 - h, 4, h); ctx.fillRect(x + 1, 70 - h - 3, 2, 3); }
  for (let i = 0; i < 4; i++) { const k = Math.floor(t * 3 + i * 7.3); if (hash2(k, i) > 0.72) { const fx = Math.floor(hash2(k, i + 9) * W); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(fx, 58, 2, 2); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(fx - 4, 54, 10, 10); } }
  // Bühne (Drehteller)
  ctx.fillStyle = '#2a2e48'; ctx.beginPath(); ctx.ellipse(W / 2, 98, 120, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a4060'; ctx.beginPath(); ctx.ellipse(W / 2, 96, 116, 14, 0, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2 + t * 0.6; ctx.fillStyle = (i % 2) ? '#ffcd75' : '#566c86'; ctx.fillRect(W / 2 + Math.cos(a) * 112 - 1, 96 + Math.sin(a) * 13 - 0.5, 2, 1); }
  // Scheinwerfer, die über die Bühne wandern
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const sx = 40 + i * 120, tx = W / 2 + Math.sin(t * 0.9 + i * 2.1) * 70;
    const grd = ctx.createLinearGradient(sx, 0, tx, 98); grd.addColorStop(0, ['rgba(255,80,200,0.35)', 'rgba(120,200,255,0.35)', 'rgba(255,220,120,0.35)'][i]); grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.moveTo(sx - 3, 0); ctx.lineTo(sx + 3, 0); ctx.lineTo(tx + 34, 100); ctx.lineTo(tx - 34, 100); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // Auto mit leichtem Schweben und Glanz
  if (en) {
    const s = renderCar(en.design, { brand: X.entry ? S.company : '' });
    const bob = Math.sin(t * 2) * 0.6, x0 = Math.round(W / 2 - s.W / 2), y0 = Math.round(94 - s.gy + bob);
    ctx.save(); ctx.globalAlpha = 0.25; ctx.translate(0, (94 + bob) * 2); ctx.scale(1, -1); ctx.drawImage(s.cv, x0, y0, s.W, s.H); ctx.restore();   // Spiegelung
    ctx.drawImage(s.cv, x0, y0, s.W, s.H);
    const sweep = ((t * 0.5) % 1.6) - 0.3;                                  // Glanzstreifen
    if (sweep > 0 && sweep < 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); const gx = x0 + sweep * s.W; ctx.moveTo(gx, y0); ctx.lineTo(gx + 8, y0); ctx.lineTo(gx - 2, y0 + s.H); ctx.lineTo(gx - 10, y0 + s.H); ctx.fill(); ctx.restore(); }
    cxText(ctx, en.name.toUpperCase().slice(0, 26), W / 2, 6, '#ffcd75', 2, 'c', '#000');
    cxText(ctx, X.entry ? 'DEIN AUSSTELLUNGSSTÜCK' : 'FAVORIT DER RUNDE', W / 2, 20, '#94b0c2', 1, 'c');
  }
}

  wx.fillStyle = '#29366f'; wx.fillRect(0, 0, 128, 32); wx.fillStyle = '#ffcd75'; wx.fillRect(0, 0, 128, 1); wx.fillRect(0, 31, 128, 1);
  cxText(wx, S.company.toUpperCase().slice(0, 28), 64, 9, '#ffcd75', 1, 'c'); cxText(wx, 'SHOWROOM', 64, 19, '#73eff7', 1, 'c');
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(24, 6), new THREE.MeshLambertMaterial({ map: pixTex(wc) }));
  wall.position.set(0, 5, -14); scene.add(wall);
  for (let i = -2; i <= 2; i++) { const l = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.15, 0.6), new THREE.MeshBasicMaterial({ color: 0xfff4c8 })); l.position.set(i * 5, 11, -4); scene.add(l); }
  // Drehscheibe
  const table = new THREE.Group(); scene.add(table);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.4, 0.3, 24), new THREE.MeshLambertMaterial({ color: 0x566c86 }));
  disc.position.y = 0.15; table.add(disc);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(6.25, 0.08, 4, 32), new THREE.MeshBasicMaterial({ color: 0x73eff7 }));

  table.add(built.group);

    if (!SHOW) return;

    SHOW.door += (SHOW.doorTarget - SHOW.door) * Math.min(1, dt * 5);

}

function close3D() {
  if (!SHOW) return;
  cancelAnimationFrame(SHOW.raf);
  SHOW.scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  SHOW.renderer.dispose();
  SHOW = null;
}

/** Baut aus dem Pixel-Sprite ein Voxel-Auto (Karosserieform, Farben, Felgen, Spoiler, Tieferlegung) */
function buildVoxelCar(design) {

      if (headRows.has(k) && az >= hw * 0.35) return lit(60, 64, 80);
      if (grilleRows.has(k) && az < hw * 0.5) return k % 2 ? lit(15, 16, 22) : lit(90, 94, 110);
      if (lowK >= 1 && lowK < 3 && az <= 3) return lowK === 1 ? lit(40, 40, 50) : lit(232, 232, 236);    // Nummernschild
      if (lowK < 1) return lit(20, 20, 26);                                                               // Frontlippe
    } else {

      if (tailRows.has(k) && design.kit !== 'none' && az < hw * 0.38) return lit(120, 14, 30);           // Leuchtband
      if (lowK >= 1.5 && lowK < 3.5 && az <= 3) return Math.floor(lowK) === 1 ? lit(40, 40, 50) : lit(232, 232, 236);
      if (lowK < 1.5 && az >= hw * 0.45 && az <= hw * 0.45 + 2) return lit(60, 62, 70);                   // Auspuff

  };
  const tmpC = new THREE.Color();
  const toC = c => { const u = unC(c); return [u[0] / 255, u[1] / 255, u[2] / 255]; };
  const paintTop = (x, z) => {
    let base = c1;
    if (design.stripe === 'racing' && Math.abs(z) < hw0 * 0.32 && Math.abs(z) > 0.6) base = c2;
    if (design.stripe === 'twotone') base = c1;
    const sh = design.paint === 'matte' ? -0.08 : design.paint === 'chrome' ? 0.4 : 0.04;
    let c = shadeRGB(base, sh + (design.paint === 'metallic' ? (hash2(x, z + 50) - 0.5) * 0.15 : 0));

  };
  for (let x = -12; x < L + 6; x++) for (let k = -2; k < H; k++) {
    const hw = hwAt(x, k); if (hw < 0) continue;
    const m = maskAt(x, k);
    const nb = [hwAt(x, k + 1), hwAt(x, k - 1), hwAt(x - 1, k), hwAt(x + 1, k)];
    const inner = Math.min(hw - 1, ...nb.map(v => v < 0 ? -1 : v));

    })();

      const er = !side && (m === M_BODY || m === M_LIGHT || m === M_TRIM) && (exF || exR) ? endRGB(x, k, z, hw, exF) : null;

      else if (side) rgb = sideRGB;

      else if (m === M_BODY) {

      else if (m === M_GLASS) (inDoor(x, k) ? (z > 0 ? doorL : doorR) : glass).push(v);

  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mkInst = (list, mat) => {
    const im = new THREE.InstancedMesh(geo, mat, Math.max(1, list.length));
    const m4 = new THREE.Matrix4();
    list.forEach((v, i) => { m4.makeTranslation(v.x, v.y, v.z); im.setMatrixAt(i, m4); tmpC.setRGB(v.rgb[0], v.rgb[1], v.rgb[2]); im.setColorAt(i, tmpC); });
    if (!list.length) im.count = 0;

    return im;
  };
  const scale = 0.1;
  const inner = new THREE.Group(); inner.scale.set(scale, scale, scale); group.add(inner);
  inner.add(mkInst(body, new THREE.MeshLambertMaterial({ color: 0xffffff })));
  inner.add(mkInst(glass, new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 })));
  // Türen als drehbare Gruppen (Scharnier an der Vorderkante)
  const doors = [];
  for (const [list, side] of [[doorL, 1], [doorR, -1]]) {
    const g = new THREE.Group();
    const hx = dFront[1] - L / 2 + 0.5, hz = side * hw0;
    g.position.set(hx, 0, hz); g.userData.side = side;
    list.forEach(v => { v.x -= hx; v.z -= hz; });
    g.add(mkInst(list, new THREE.MeshLambertMaterial({ color: 0xffffff })));
    inner.add(g); doors.push(g);
  }
  // Interieur: Boden, Sitze, Armaturenbrett, Lenkrad, ggf. Käfig
  const seatC = new THREE.Color(I.seatColor), dashC = new THREE.Color(I.dash === 'carbon' ? '#2a2b33' : I.tier === 'luxus' ? '#5a3a28' : '#2e2f38');
  const box = (w, h, d, x, y, z, col) => { const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col })); mesh.position.set(x - L / 2, y, z); inner.add(mesh); return mesh; };
  const g0 = B.glass[0], g1 = B.glass[1], cabinY = Math.ceil(s.bot[Math.floor(L / 2)]) + 1;
  box(Math.max(6, g1 - g0 - 2), 1, hw0 * 2 - 3, (g0 + g1) / 2, cabinY, 0, 0x14151c);
  const seatX = Math.round(g1 - (g1 - g0) * 0.45);
  for (const z of [hw0 * 0.45, -hw0 * 0.45]) {
    box(6, 2, 6, seatX + 1, cabinY + 2, z, seatC);
    box(2, I.seats === 'sport' || I.seats === 'carbon' ? 9 : 8, 6, seatX - 2, cabinY + 6, z, seatC);
    box(1.5, 2, 4, seatX - 2.5, cabinY + 11, z, seatC.clone().multiplyScalar(0.8));
  }
  box(4, 4, hw0 * 2 - 3, g1 - 4, kb + 1, 0, dashC);
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.4, 4, 12), new THREE.MeshLambertMaterial({ color: 0x1a1b22 }));
  wheel.position.set(g1 - 8 - L / 2, kb + 3, hw0 * 0.45); wheel.rotation.y = Math.PI / 2; wheel.rotation.x = 0.3; inner.add(wheel);
  if (I.ambient !== 'none' && has('int_ambient')) box(1, 0.5, hw0 * 2 - 4, g1 - 6, kb + 3.2, 0, new THREE.Color(I.ambient));
  if (I.cage && has('int_rollcage')) { box(1, 12, 1, seatX - 5, kb + 2, hw0 - 3, 0xe8b830); box(1, 12, 1, seatX - 5, kb + 2, -hw0 + 3, 0xe8b830); box(1, 1, hw0 * 2 - 5, seatX - 5, kb + 8, 0, 0xe8b830); }
  // Räder aus den Sprite-Pixeln (Felgendesign bleibt erhalten)
  const tireC = new THREE.Color('#1e1e24');
  const wheelVox = [];
  for (const w of s.wheels) {
    const R = w.r;
    for (let dy = -Math.ceil(R); dy <= Math.ceil(R); dy++) for (let dx = -Math.ceil(R); dx <= Math.ceil(R); dx++) {
      const sx = Math.floor(w.x + dx), sy = Math.floor(w.y + dy);
      if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;

  }
  inner.add(mkInst(wheelVox, new THREE.MeshLambertMaterial({ color: 0xffffff })));
  // Unterboden-Schatten
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(L * 1.05, hw0 * 2.2), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.05; inner.add(shadow);

}
/* =============================================================================
   Teil 12: Start, Hauptschleife, Autospeichern
   ============================================================================= */
let _autoDay = -1, _last = performance.now(), _dayAcc = 0, _animT = 0, _saveT = 0, _navT = 0;

function mainLoop(now) {
  const dt = clamp((now - _last) / 1000, 0, 0.1); _last = Math.max(_last, now);
  _animT += dt;
  if (S) {
    adminTick();
    cinemaCheck();
    // Spielzeit läuft nur ausserhalb von Rennen
    if (!RACE && !ROAM && S.speed > 0) {
      const days = dt * S.speed / DAY_SEC;
      tickProduction(days);
      _dayAcc += days;
      while (_dayAcc >= 1) { _dayAcc -= 1; dayTick(); }
    }
    updateTopbar(false);
    const tab = TABS[curTab];
    if (tab && tab.tick && !RACE) tab.tick(dt, _animT);
    // Seiten mit Live-Werten gelegentlich neu aufbauen
    _navT += dt;
    if (_navT > 2) {
      _navT = 0; renderNav();
      const focused = document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
      if (!focused && ['home', 'models', 'market'].includes(curTab) && $('#modal').classList.contains('hidden') && S.day !== _autoDay) { _autoDay = S.day; rerender(); }
    }
    _saveT += dt;
    if (_saveT > 15 && !RACE && !CUT) { _saveT = 0; saveGame(); }   // nicht mitten im Rennen (Ruckler) – danach wird ohnehin gespeichert
  }
  requestAnimationFrame(mainLoop);
}

function boot() {
  bindDelegation(document.body);
  // Tastenkürzel: Leertaste = Pause/Weiter, 1/2/3 = Tempo (nicht im Rennen oder beim Tippen)
  window.addEventListener('keydown', e => {
    if (RACE || ROAM || !S) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) return;
    if (e.key === ' ') { e.preventDefault(); S.speed = S.speed ? 0 : (S._lastSpeed || 1); if (S.speed) S._lastSpeed = S.speed; updateTopbar(true); }
    else if (['1', '2', '3'].includes(e.key)) { S.speed = [1, 2, 5][+e.key - 1]; S._lastSpeed = S.speed; updateTopbar(true); }
  });
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
  requestAnimationFrame(mainLoop);
  // Startbildschirm: gemerktes Konto ist vorausgewählt, Anmelden ist freiwillig
  const u = sessionUser();
  if (u) AUTH_USER = u;
  showTitle();
}
/** Spielstand des angemeldeten Kontos laden (oder neues Spiel) */
function startGameForUser(fresh) {
  hideTitle();
  const st = fresh ? null : loadGame();
  if (st && !st.seenUnlock) st.seenUnlock = Object.keys(TAB_LVL).filter(t => st.level >= TAB_LVL[t]);
  _carCache.clear(); _spriteCache.clear(); _tbCache = '';
  if (st) {
    S = st;
    renderTopbar(); renderNav(); setTab('home');
    toast(`Willkommen zurück bei <b>${esc(S.company)}</b>, ${esc(currentAccount().name)}!`, 'good');
    let again = false; try { again = localStorage.getItem('at_tour_again') === '1'; localStorage.removeItem('at_tour_again'); } catch (e) { /* egal */ }
    if (!S.tutDone || again) setTimeout(() => tourStart(again), 600);
  } else {
    newState('Pixel Motors'); S.speed = 0;
    renderTopbar(); renderNav(); setTab('home');
    showNewGame(false);
  }
  if (isAdmin()) toast(`${ico('crown')} Angemeldet als <b>${ROLE_NAME[currentAccount().role]}</b> – siehe Tab <b>Admin</b>.`, 'good', 5000);
}
boot();
