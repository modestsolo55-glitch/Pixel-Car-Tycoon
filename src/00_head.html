<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161f">
<title>AutoTycoon</title>
<!-- Pixel-Schriften (Fallback: Monospace, das Spiel läuft auch offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<!-- Three.js nur für den 3D-Showroom -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ===================== Grundfarben (Pixel-Palette) ===================== */
:root{
  --bg:#1a1c2c; --bg2:#22263a; --panel:#333c57; --panel2:#3e4a6b; --line:#0d0f1a;
  --text:#f4f4f4; --muted:#94b0c2; --yellow:#ffcd75; --orange:#ef7d57; --red:#b13e53;
  --green:#38b764; --lime:#a7f070; --blue:#3b5dc9; --sky:#41a6f6; --cyan:#73eff7;
  --purple:#5d275d; --dark:#29366f; --gray:#566c86;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Pixelify Sans','Courier New',monospace;font-size:16px;overflow:hidden;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
img.ico{image-rendering:pixelated;width:16px;height:16px;vertical-align:middle;display:inline-block}
img.ico.big{width:24px;height:24px}
.hf{font-family:'Press Start 2P',monospace}
b,strong{color:var(--yellow);font-weight:600}
.muted{color:var(--muted)} .good{color:var(--lime)} .bad{color:#ff7b8a} .warn{color:var(--yellow)}
/* ===================== Layout ===================== */
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
#topbar{display:flex;gap:7px;align-items:center;padding:6px 8px;background:var(--dark);border-bottom:4px solid var(--line);flex-wrap:wrap;position:relative;z-index:5}
#tb-goaltxt{max-width:210px;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--yellow)}
#topbar .brand{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:18px;color:var(--yellow);margin-right:6px;text-shadow:2px 2px 0 #000;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:5px;background:var(--bg2);padding:3px 8px;box-shadow:0 -2px 0 var(--line),0 2px 0 var(--line),-2px 0 0 var(--line),2px 0 0 var(--line);white-space:nowrap;font-size:15px;min-height:26px}
.xpbar{width:74px;height:9px;background:#000;position:relative;box-shadow:0 0 0 1px #566c86}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--lime) 0 5px,var(--green) 5px 6px)}
.spd{display:flex;gap:0}
.spd button{font-family:inherit;font-size:13px;background:#14182a;color:var(--muted);border:0;padding:4px 8px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.spd button.on{background:var(--yellow);color:var(--bg)}
#main{display:grid;grid-template-columns:172px 1fr;min-height:0}
#nav{background:var(--bg2);border-right:4px solid var(--line);overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:7px}
#nav button{font-family:inherit;font-size:15px;text-align:left;display:flex;align-items:center;gap:8px;color:var(--text);background:var(--panel);border:0;padding:7px 8px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.12),0 -2px 0 var(--line),0 2px 0 var(--line),-2px 0 0 var(--line),2px 0 0 var(--line)}
#nav button:hover{background:var(--panel2)}
#nav button.on{background:var(--yellow);color:var(--bg)}
#nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:0 5px}
#content{overflow:auto;padding:12px 14px 40px;min-height:0;position:relative}
/* ===================== Pixel-Elemente ===================== */
.btn{font-family:inherit;font-size:15px;color:#fff;background:var(--sky);border:0;padding:6px 12px;cursor:pointer;margin:4px;position:relative;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.28),0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line)}
.btn:hover{filter:brightness(1.12)}
.btn:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.35),0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line);transform:translateY(1px)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.orange{background:var(--orange)}
.btn.yellow{background:var(--yellow);color:var(--bg)} .btn.gray{background:var(--gray)} .btn.dark{background:#262b44}
.btn.sel{background:var(--yellow);color:var(--bg)}
.btn.sm{font-size:13px;padding:3px 8px;margin:3px}
.btn.big{font-size:18px;padding:10px 18px}
.btn:disabled,.btn.lock{background:#3a3f52;color:#7d8296;cursor:not-allowed;filter:none}
.btn.lock::after{content:'';position:absolute;right:-4px;top:-6px;width:10px;height:10px;background:var(--lock-ico) no-repeat center/10px;image-rendering:pixelated}
.panel{background:var(--panel);padding:10px 12px;margin:6px 4px 16px;box-shadow:0 -4px 0 var(--line),0 4px 0 var(--line),-4px 0 0 var(--line),4px 0 0 var(--line),inset 0 4px 0 rgba(255,255,255,.07),inset 0 -4px 0 rgba(0,0,0,.2)}
.panel h3{font-family:'Pixelify Sans','Courier New',monospace;font-weight:700;letter-spacing:1px;font-size:17px;color:var(--yellow);margin-bottom:10px;text-transform:uppercase;line-height:1.5;display:flex;align-items:center;gap:8px}
.panel.dark{background:#262b44}
h2.title{font-family:'Pixelify Sans','Courier New',monospace;font-weight:700;font-size:26px;letter-spacing:1px;color:var(--yellow);margin:4px 4px 12px;text-shadow:3px 3px 0 #000;display:flex;align-items:center;gap:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1 1 320px;min-width:0}
.col.narrow{flex:0 1 300px}
.opts{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:2px}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:1px}
input[type=text],input[type=number],input[type=password],select{font-family:inherit;font-size:16px;background:#0d0f1a;color:var(--text);border:0;padding:5px 8px;box-shadow:0 0 0 3px var(--gray);outline:none;margin:4px;max-width:100%}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,select:focus{box-shadow:0 0 0 3px var(--yellow)}
input[type=color]{width:34px;height:26px;border:0;padding:0;background:none;cursor:pointer;margin:3px;box-shadow:0 0 0 2px var(--line)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:#0d0f1a;box-shadow:0 0 0 2px var(--gray);margin:8px 0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;background:var(--yellow);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 0 0 2px var(--line);border:0}
input[type=range]::-moz-range-thumb{width:14px;height:22px;background:var(--yellow);border:0;border-radius:0;box-shadow:0 0 0 2px var(--line)}
.sw{width:22px;height:22px;border:0;cursor:pointer;box-shadow:0 0 0 2px var(--line);margin:3px;display:inline-block;vertical-align:middle}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--line)}
.stat{display:grid;grid-template-columns:118px 1fr 84px;gap:8px;align-items:center;font-size:14px;margin:3px 0}
.stat span:last-child{text-align:right}
.bar{height:10px;background:#0d0f1a;position:relative;box-shadow:0 0 0 1px #000}
.bar i{position:absolute;left:0;top:0;bottom:0}
.pbar{height:14px;background:#0d0f1a;position:relative;box-shadow:0 0 0 2px var(--line);overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--green) 0 6px,var(--lime) 6px 8px)}
.pbar.blue i{background:repeating-linear-gradient(90deg,var(--sky) 0 6px,var(--cyan) 6px 8px)}
.pbar em{position:absolute;inset:0;font-style:normal;font-size:11px;text-align:center;line-height:14px;color:#fff;text-shadow:1px 1px 0 #000}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{color:var(--yellow);text-align:left;font-weight:400;padding:4px 6px;border-bottom:3px solid var(--line);font-size:12px;text-transform:uppercase}
table.t td{padding:4px 6px;border-bottom:1px solid rgba(0,0,0,.3)}
table.t tr:nth-child(even) td{background:rgba(255,255,255,.035)}
.tag{display:inline-block;font-size:13px;padding:1px 6px;background:#0d0f1a;color:var(--muted);margin:1px}
.tag.y{color:var(--yellow)} .tag.g{color:var(--lime)} .tag.r{color:#ff7b8a}
.cv{width:100%;height:auto;box-shadow:0 0 0 4px var(--line);background:#000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.card{background:#262b44;padding:8px;box-shadow:0 0 0 3px var(--line);margin:6px 3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.hint{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.35}
/* ===================== Toasts, Modal, Level-Up ===================== */
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:9px;z-index:80;max-width:340px;pointer-events:none}
.toast{background:var(--panel2);padding:8px 11px;font-size:14px;line-height:1.3;display:flex;gap:8px;align-items:flex-start;animation:tin .32s steps(4);
  box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line),inset 4px 0 0 var(--yellow)}
.toast.good{box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line),inset 4px 0 0 var(--lime)}
.toast.bad{box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line),inset 4px 0 0 var(--red)}
.toast.out{animation:tout .3s steps(3) forwards}
@keyframes tin{from{transform:translateX(120%)}to{transform:none}}
@keyframes tout{to{transform:translateX(130%);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(8,9,18,.82);display:flex;align-items:center;justify-content:center;z-index:60;padding:10px}
.mbox{background:var(--panel);width:min(920px,97vw);max-height:95vh;overflow:auto;padding:14px 16px;
  box-shadow:0 -4px 0 var(--line),0 4px 0 var(--line),-4px 0 0 var(--line),4px 0 0 var(--line),inset 0 4px 0 rgba(255,255,255,.08)}
.mbox.small{width:min(520px,96vw)}
.hidden{display:none!important}
#lvlup{position:fixed;inset:0;z-index:90;pointer-events:none;display:flex;align-items:center;justify-content:center}
#lvlup canvas{width:min(640px,96vw);height:auto}
/* ===================== Forschungsbaum ===================== */
.treewrap{overflow:auto;padding:4px 4px 12px}
.tree{display:grid;grid-template-columns:repeat(7,minmax(158px,1fr));gap:18px;position:relative;min-width:1180px}
.tcol h4{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:14px;color:var(--cyan);text-align:center;padding:8px 2px;background:#14182a;margin-bottom:12px;box-shadow:0 0 0 3px var(--line);line-height:1.5}
.tnode{position:relative;z-index:1;background:#2b3046;padding:6px 7px;margin:0 2px 16px;font-size:13px;cursor:pointer;line-height:1.25;
  box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line)}
.tnode .tn{font-size:14px;color:#fff;display:flex;gap:5px;align-items:center}
.tnode .td{color:var(--muted);font-size:12px;margin-top:3px}
.tnode .tc{display:flex;justify-content:space-between;margin-top:4px;font-size:12px}
.tnode.done{background:#1d4a3a;box-shadow:0 -3px 0 var(--line),0 3px 0 var(--line),-3px 0 0 var(--line),3px 0 0 var(--line),inset 0 0 0 2px var(--green)}
.tnode.avail{background:#4b3d1c;animation:tpulse 1s steps(2) infinite}
.tnode.lock{opacity:.55;filter:grayscale(.6)}
@keyframes tpulse{50%{box-shadow:0 -3px 0 var(--yellow),0 3px 0 var(--yellow),-3px 0 0 var(--yellow),3px 0 0 var(--yellow)}}
#treecv{position:absolute;left:0;top:0;z-index:0;pointer-events:none;image-rendering:pixelated}
/* ===================== Drag Race ===================== */
#race,#roam{position:fixed;inset:0;background:#07080f;z-index:50;display:flex;flex-direction:column}
#race .rtop,#roam .rtop{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#14161f}
#racecv,#roamcv{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;background:#07080f}
.rctl{display:flex;justify-content:center;align-items:stretch;gap:8px;padding:8px;background:#14161f;flex-wrap:wrap;touch-action:none}
.rbtn{font-family:'Press Start 2P',monospace;font-size:11px;color:#fff;border:0;cursor:pointer;min-width:74px;padding:12px 10px;touch-action:none;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.4),inset 4px 4px 0 rgba(255,255,255,.25),0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000}
.rbtn.on{box-shadow:inset 4px 4px 0 rgba(0,0,0,.45),0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000;filter:brightness(1.3)}
.rbtn.gas{background:#38b764;min-width:120px;font-size:13px} .rbtn.clutch{background:#566c86;min-width:110px}
.rbtn.nos{background:#3b5dc9} .rbtn.shift{background:#ef7d57;min-width:58px;font-size:16px} .rbtn.stage{background:#b13e53}
.rbtn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
/* ===================== 3D-Showroom ===================== */
#show3d canvas{width:100%;height:auto;aspect-ratio:16/9;cursor:grab;touch-action:none;box-shadow:0 0 0 4px var(--line)}
/* ===================== Mobil ===================== */
@media (max-width:780px){
  #main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:4px solid var(--line);padding:6px}
  #nav button{flex:0 0 auto;font-size:13px;padding:6px 7px}
  #topbar .brand{display:none}
  .chip{font-size:13px;padding:2px 6px}
  #content{padding:8px 6px 40px}
  .tree{min-width:1100px}
  .rbtn{min-width:60px;padding:12px 6px;font-size:10px}
  .rbtn.gas{min-width:96px}
}
#login{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 8px),radial-gradient(ellipse at 50% 30%,#2b3260 0%,#1a1c2c 55%,#0d0f1a 100%)}
#login.hidden{display:none}
#title{position:fixed;inset:0;z-index:58;background:#05060c;overflow:hidden}
#title.hidden{display:none}
#ttl-cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.ttl-top{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:2;align-items:center}
.ttl-top>div{display:flex;gap:6px}
.ttl-chip{display:flex;align-items:center;gap:6px;background:var(--panel);padding:4px 8px;box-shadow:0 0 0 3px var(--line)}
.ttl-mid{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);z-index:2;text-align:center;width:min(560px,94vw);max-height:84vh;overflow:auto;padding:6px}
.ttl-play{font-family:inherit;font-size:38px;letter-spacing:4px;padding:12px 64px;color:#fff;background:#38b764;border:0;cursor:pointer;text-shadow:0 3px 0 #1e6a3a;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.25),0 0 0 4px #0d0f1a,0 8px 0 4px rgba(0,0,0,.45);animation:ttlp 1.6s ease-in-out infinite}
.ttl-play:hover{background:#45c873}
@keyframes ttlp{50%{transform:scale(1.06)}}
.ttl-sub{margin-top:12px;color:#f4f4f4;text-shadow:0 2px 0 #000;font-size:14px}
.ttl-panel{text-align:left;background:var(--panel);padding:12px 14px;box-shadow:0 0 0 4px var(--line),0 10px 0 4px rgba(0,0,0,.35);max-width:520px;margin:0 auto}
.ttl-foot{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#94b0c2;text-shadow:0 1px 0 #000;z-index:2}
#tour{position:fixed;inset:0;z-index:90}
.tour-dim{position:absolute;inset:0;background:rgba(5,6,12,.72)}
.tour-hole{position:absolute;box-shadow:0 0 0 9999px rgba(5,6,12,.72);outline:3px solid var(--yellow);animation:tourp 1.2s ease-in-out infinite;pointer-events:none}
@keyframes tourp{50%{outline-color:#fff}}
.tour-card{position:absolute;width:min(380px,90vw);background:var(--panel);padding:10px 12px;box-shadow:0 0 0 4px var(--yellow),0 10px 0 4px rgba(0,0,0,.4)}
.tour-card h3{margin:2px 0 4px;color:var(--yellow)}
.tour-card p{margin:0 0 8px;line-height:1.45}
.tour-step{font-size:11px;color:#94b0c2}

.lbox{width:100%;max-width:380px;background:var(--panel);padding:16px 18px 14px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.1),0 0 0 4px var(--line),0 10px 0 4px rgba(0,0,0,.35)}
.lbox input[type=text],.lbox input[type=password]{width:calc(100% - 8px)}
.lhead{display:flex;align-items:center;justify-content:center;gap:10px;font-size:30px;color:var(--yellow);text-shadow:3px 3px 0 var(--line)}
.lcar{display:block;margin:8px auto 2px;width:100%;max-width:300px;image-rendering:pixelated}
.lbox h3{text-align:center;margin:6px 0 2px}
.lmsg{background:#0d0f1a;padding:6px 8px;margin:8px 4px 0}
.lrem{display:flex;align-items:center;gap:6px;margin:10px 4px 6px;font-size:14px;cursor:pointer}
/* ===================== Vereinfachte Bedienung ===================== */
#nav button.nlock{background:#262b40;color:#7d8296}
#nav button.nlock .lv{margin-left:auto;font-size:10px;color:#7d8296;white-space:nowrap}
#nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 12px;padding-bottom:10px;border-bottom:3px solid var(--line)}
.subnav button{font-family:inherit;font-size:15px;display:flex;align-items:center;gap:6px;color:var(--text);background:var(--bg2);border:0;padding:6px 12px;cursor:pointer;box-shadow:0 0 0 3px var(--line)}
.subnav button:hover{background:var(--panel2)}
.subnav button.on{background:var(--yellow);color:var(--bg)}
.subnav button.lock{color:#7d8296;background:#20243a}
.subnav small{font-size:11px}
button.chip.menubtn{font-family:inherit;color:var(--text);border:0;cursor:pointer;background:var(--panel)}
button.chip.menubtn:hover{background:var(--panel2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 0 8px}
.mgrid .btn{text-align:left;display:flex;align-items:center;gap:6px}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,#2b3a5a,#333c57);padding:12px 14px;margin:4px 4px 14px;box-shadow:0 0 0 4px var(--line),inset 0 0 0 2px var(--yellow)}
.next .nl{display:flex;gap:10px;align-items:flex-start;flex:1 1 300px}
.next .nt{font-size:20px;color:var(--yellow);margin-top:2px}
.tl{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:0 4px 14px}
.tile{display:flex;align-items:center;gap:10px;background:var(--panel);padding:8px 10px;box-shadow:0 0 0 3px var(--line)}
.tile .tv{font-size:18px}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h3{margin-bottom:0}
details.fold>summary h3::after{content:'+';margin-left:auto;color:var(--muted)}
details.fold[open]>summary h3{margin-bottom:10px}
details.fold[open]>summary h3::after{content:'–'}
.tip{margin:3px 0}
img.face{image-rendering:pixelated;box-shadow:0 0 0 2px var(--line);background:#22263a;flex:0 0 auto}
.rquote{display:flex;align-items:center;gap:6px;font-size:12px;color:#c8ccd4;max-width:52%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.revbox #revcv{width:210px;height:28px;box-shadow:0 0 0 2px var(--line)}
.revtxt{font-size:20px;min-width:130px;font-variant-numeric:tabular-nums}
.revgas.on{filter:brightness(1.3);transform:translateY(1px)}
.revgas{touch-action:none;user-select:none}

#content.anim>*{animation:fadeUp .3s ease-out both}

#content.anim>*:nth-child(3){animation-delay:.08s}

#content.anim .row>.col:nth-child(2){animation-delay:.08s}
.btn{transition:transform .08s,filter .12s}
.btn:hover{transform:translateY(-1px)}

#nav button.on img.ico{animation:icoBounce .5s ease-out}
@keyframes icoBounce{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.chip.up{animation:chipUp .5s ease-out}
.chip.down{animation:chipDown .5s ease-out}
@keyframes chipUp{0%{background:#2f6a3a;transform:scale(1.08)}100%{transform:none}}
@keyframes chipDown{0%{background:#6a2a34}100%{}}
.tile{transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.next{animation:nextGlow 2.5s ease-in-out infinite}
@keyframes nextGlow{50%{box-shadow:0 0 0 4px var(--line),inset 0 0 0 2px var(--lime)}}
.card{transition:transform .12s}
.showcard:hover,.subnav button:hover{transform:translateY(-2px)}
.mbox{animation:popIn .22s cubic-bezier(.2,1.4,.5,1) both}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
